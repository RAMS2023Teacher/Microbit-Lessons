id: dodge-the-drop
title: Dodge the Drop
tagline: Tilt to dodge the falling raindrops
minutes: 90          # about two class periods

mission:
  big_question: "How do games keep running until something happens?"
  goal: |
    Build your first **micro:bit game**. You are the LED on the bottom row. A raindrop falls
    from the top. **Tilt** the micro:bit to move left and right. Dodge the drop to score a point.
    Get hit and it's game over!
  picture:
    type: leds
    frames: ["09000:00000:00000:00000:00900", "00000:09000:00000:00000:00900", "00000:00000:09000:00000:00900", "00000:00000:00000:09000:00900"]
    caption: The drop falls. You (bottom row) tilt to get out of the way.
  you_need:
    - A partner
    - A Chromebook with MakeCode open
    - A micro:bit and USB cable (or just the simulator)
  learn:
    - "**while loops** repeat as long as something is True"
    - "the **accelerometer** senses tilt"
    - "**sprites**: game characters you can move"
  talk: Most games keep going *until* something happens. Name a game you know that runs until you lose. What makes it end?

build:
  - part: Set up
    title: Open MakeCode in Python
    do:
      - Click the green **Open MakeCode** button. Click **New Project** and name it **Warm-ups**.
      - At the top, switch from **Blocks** to **Python**.
      - Delete any code that's already there, so the editor is empty.
      - "The micro:bit picture on the left is the **simulator**. To tilt it, move your mouse over it."
    tip: "**Python cares about spaces.** Lines that belong inside a loop or an `if` must be pushed in (indented) the same amount. If something breaks, check the spaces first."
    test:
      - MakeCode is open in Python, with an empty editor

  - part: "Part 1: Warm-ups"
    title: A loop that counts
    say: A **while** loop repeats **as long as** its condition is True. It checks the condition before every trip through the loop.
    do:
      - Type this code exactly. Watch the indentation.
      - Before you run it, answer the question below.
      - Now run it and check the boxes.
    code: |
      count = 0
      while count < 5:
          basic.show_number(count)
          count += 1
      basic.show_string("Done!")
    what: "`count < 5` is the condition. `count += 1` adds 1 each trip. When count reaches 5 the condition is False, so the loop stops and the last line runs."
    test:
      - It shows 0, 1, 2, 3, 4
      - Then it shows "Done!"
    ask: "Predict: what would happen if you deleted the line count += 1? Then try it. Were you right?"

  - part: "Part 1: Warm-ups"
    title: A loop that never stops
    say: "`while True` means the condition is always True, so the loop runs **forever**. Games need this: they keep checking and drawing."
    do:
      - Delete your counting code.
      - Type this beating heart.
      - Run it.
    code: |
      while True:
          basic.show_icon(IconNames.HEART)
          basic.pause(500)
          basic.show_icon(IconNames.SMALL_HEART)
          basic.pause(500)
    what: Big heart, wait half a second, small heart, wait half a second, then back to the top. 500 means 500 milliseconds.
    tip: "**Watch out:** always put a `basic.pause` inside a `while True` loop. Without one, the micro:bit gets too busy to update the screen."
    test:
      - The heart beats and never stops
    ask: Change both 500s to make the heart beat faster. What numbers did you use?

  - part: "Part 1: Warm-ups"
    title: Wait for a button
    say: "`input.button_is_pressed(Button.A)` answers True or False. `while not` means **keep waiting until it is True**."
    do:
      - Delete your heart code.
      - Type this code and run it.
      - Press button A in the simulator.
    code: |
      basic.show_string("Press A")
      while not input.button_is_pressed(Button.A):
          basic.pause(20)
      basic.show_icon(IconNames.YES)
    what: The loop does nothing except wait. The moment A is pressed, the condition becomes False, the loop ends, and the checkmark appears. This is how games say "Press A to start."
    test:
      - Nothing happens until I press A
      - After I press A, a checkmark shows
    ask: What changes if you use Button.B instead? Try it and describe what you had to do.

  - part: "Part 1: Warm-ups"
    title: Read the tilt
    say: |
      The **accelerometer** is a sensor that feels which way the micro:bit is **leaning**.
      It gives one number for left and right: **0** when flat, a **negative** number when it leans left,
      a **positive** number when it leans right. The more it leans, the bigger the number (up to about 1023).
    picture:
      type: tilt
      caption: "Lean it more and the number moves further from 0."
    do:
      - Delete your button code.
      - Type this code and run it.
      - "Hold the micro:bit **flat** and wait for a number. Then lean it **left** and **hold it still** until the next number. Then lean it **right**."
      - Write the three numbers below. They won't be exact, and that's fine.
    code: |
      while True:
          x = input.acceleration(Dimension.X)
          basic.show_number(Math.round(x / 100) * 100)
          basic.pause(1000)
          basic.clear_screen()
          basic.pause(300)
    what: "Line 2 reads the tilt and keeps it in `x`. Line 3 rounds it to the nearest hundred, so it's easier to read, and shows it. The pauses give you time: you get **one** number about every two seconds."
    tip: "**In the simulator:** move your mouse left and right over the micro:bit picture to lean it. Keep the mouse still while a number scrolls past."
    stuck:
      - "A long number like -1000 **scrolls** across the screen. Wait for it to finish before you move."
      - "Capital **M** in `Math.round`, and capital **X** in `Dimension.X`."
    test:
      - Flat shows a number close to 0
      - Leaning left and leaning right show different numbers
    fields: ["Lean left", "Flat", "Lean right"]
    ask: Which direction gives negative numbers? Which gives positive numbers?

  - part: "Part 1: Warm-ups"
    title: Build a tilt sensor
    say: |
      Now use the tilt number to make a **decision**. Every trip through the loop reads the tilt again.
      A small lean shouldn't count, so we pick two **thresholds**: further left than **-300** means left,
      further right than **300** means right.
    picture:
      type: tilt
      threshold: 300
      zones: ["x < -300: ⬅", "do nothing", "x > 300: ➡"]
      caption: "The grey zone in the middle is 'flat enough'. Only a real lean gets past -300 or 300."
    do:
      - Delete your tilt-number code.
      - Type this code. There are three levels of indentation.
      - Run it and tilt left and right.
    code: |
      while True:
          x = input.acceleration(Dimension.X)
          if x < -300:
              basic.show_arrow(ArrowNames.WEST)
          elif x > 300:
              basic.show_arrow(ArrowNames.EAST)
          else:
              basic.clear_screen()
          basic.pause(100)
    what: "-300 and 300 are **thresholds**: how far you must tilt before it counts. Small wobbles near 0 do nothing."
    test:
      - Tilt left shows a left arrow
      - Tilt right shows a right arrow
      - Flat shows nothing
    ask: Change 300 to 600 (in both places). Is it more sensitive or less sensitive now? How do you know?

  - part: "Part 2: Build the game"
    title: "The game plan: every LED has an address"
    say: |
      **You are the 🙂 player** on the **bottom row**. A **💧 raindrop** falls from the top. Tilt to dodge it!

      To move things, the game needs **addresses**. Each LED has two numbers, like a seat in a theater:
      **x = the column** (count across from the left). **y = the row** (count down from the top).
      Both start at **0**.
    picture:
      type: coords
      marks:
        - {x: 1, y: 4, icon: "🙂", label: "you, the player", color: green}
        - {x: 3, y: 0, icon: "💧", label: "the raindrop", color: blue}
      ask: true
      caption: "Count across the top for x and down the side for y. Start at 0!"
    fields_prompt: "Look at the picture. Write the address of the 🙂 player and the 💧 raindrop:"
    fields: ["🙂 Player x (column)", "🙂 Player y (row)", "💧 Drop x (column)", "💧 Drop y (row)"]
    do:
      - Make a **New Project** named **Dodge the Drop**, switch to **Python**, and delete the starter code.
      - Type the code below. Use **your numbers** from the boxes above. Ours are in the code so you can check.
      - Run it. Two LEDs light up. Do they sit where the 🙂 and the 💧 are in the picture?
      - Change the player's **x** to `3` and run it again. Which way did the player move?
      - Delete all the code. From the next step on you'll keep **adding** to this program.
    code: |
      led.plot(1, 4)
      led.plot(3, 0)
    what: "`led.plot(x, y)` lights **one** LED. The first number is **x** (the column) and the second is **y** (the row). Line 1 is the player: column 1, row 4. Line 2 is the raindrop: column 3, row 0."
    tip: "**Memory trick:** x is a cross, so it goes **across**. y has a tail that hangs **down**."
    test:
      - My two LEDs lit up in the same places as the 🙂 and the 💧 in the picture
      - I changed the player's x to 3 and the LED moved to the right
      - I deleted the code, and my project is named Dodge the Drop
    ask: The player always has the same row number (y). What is it, and why?

  - part: "Part 2: Build the game"
    title: Make the two sprites
    do:
      - Type these two lines.
      - Run it and look at the screen.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
    new: "1-2"
    what: "`game.create_sprite(2, 4)` makes the player at column 2, row 4: the middle of the bottom row. `randint(0, 4)` picks a random whole number from 0 to 4, so the drop starts in a random column on the top row."
    test:
      - I see one LED on the bottom row, in the middle
      - I see one LED somewhere on the top row
    ask: Run it three more times. Does the drop always start in the same place? Why or why not?

  - part: "Part 2: Build the game"
    title: Tilt to move
    do:
      - Add the highlighted lines under your two sprite lines.
      - Run it and tilt left and right.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
      while not game.is_game_over():
          x = input.acceleration(Dimension.X)
          if x < -300:
              player.change(LedSpriteProperty.X, -1)
          elif x > 300:
              player.change(LedSpriteProperty.X, 1)
          basic.pause(300)
    new: "3-9"
    tip: "**Careful:** lowercase `x` is your tilt number. Capital `X` in `LedSpriteProperty.X` means left and right."
    what: This is your tilt sensor from the last warm-up, but instead of showing an arrow it moves the player. -1 moves left, 1 moves right. The loop keeps going until the game is over.
    test:
      - Tilting left moves my player left
      - Tilting right moves my player right
      - The player stops at the edges
    ask: What does basic.pause(300) do here? Try 100 and 600. What changes?

  - part: "Part 2: Build the game"
    title: Make the drop fall
    do:
      - Add ONE new line at the bottom of the loop, under `basic.pause`.
      - Run it and watch the drop.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
      while not game.is_game_over():
          x = input.acceleration(Dimension.X)
          if x < -300:
              player.change(LedSpriteProperty.X, -1)
          elif x > 300:
              player.change(LedSpriteProperty.X, 1)
          basic.pause(300)
          drop.change(LedSpriteProperty.Y, 1)
    new: "10"
    what: "`LedSpriteProperty.Y` means up and down. Adding 1 to Y moves the drop one row down each trip through the loop."
    test:
      - The drop falls one row at a time
      - The drop reaches the bottom row and stays there
    ask: The drop gets stuck at the bottom. What do you think we need to add next to fix that?

  - part: "Part 2: Build the game"
    title: Score a point and send the drop back up
    do:
      - Add the highlighted lines at the bottom of the loop.
      - Run it. Dodge a few drops.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
      while not game.is_game_over():
          x = input.acceleration(Dimension.X)
          if x < -300:
              player.change(LedSpriteProperty.X, -1)
          elif x > 300:
              player.change(LedSpriteProperty.X, 1)
          basic.pause(300)
          drop.change(LedSpriteProperty.Y, 1)
          if drop.get(LedSpriteProperty.Y) == 4:
              game.add_score(1)
              drop.set(LedSpriteProperty.Y, 0)
              drop.set(LedSpriteProperty.X, randint(0, 4))
    new: "11-14"
    tip: "`==` (two equals signs) asks **is it equal?**"
    what: If the drop has reached row 4 (the bottom), you dodged it. Add 1 point, move the drop back to row 0, and give it a new random column.
    test:
      - The drop falls, then starts again at the top
      - It comes back in different columns
    ask: Why do we use randint(0, 4) again here? What would the game be like without it?

  - part: "Part 2: Build the game"
    title: Game over!
    do:
      - Add the two highlighted lines above the score lines you just added.
      - Change the word `if` on the next line to `elif`.
      - Run it. Dodge some drops, then let one hit you.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
      while not game.is_game_over():
          x = input.acceleration(Dimension.X)
          if x < -300:
              player.change(LedSpriteProperty.X, -1)
          elif x > 300:
              player.change(LedSpriteProperty.X, 1)
          basic.pause(300)
          drop.change(LedSpriteProperty.Y, 1)
          if drop.is_touching(player):
              game.game_over()
          elif drop.get(LedSpriteProperty.Y) == 4:
              game.add_score(1)
              drop.set(LedSpriteProperty.Y, 0)
              drop.set(LedSpriteProperty.X, randint(0, 4))
    new: "11-13"
    what: "`drop.is_touching(player)` is True when the two sprites are on the same LED. `game.game_over()` ends the game and shows your score. We check for a hit first, then check for a dodge."
    test:
      - Getting hit ends the game
      - My score shows after the game ends
      - Dodging still adds points
    ask: What is your high score? What is your partner's?

  - part: "Part 2: Build the game"
    title: "Checkpoint: the whole game"
    say: Your program should match this. Compare it line by line, especially the indentation.
    code: |
      player = game.create_sprite(2, 4)
      drop = game.create_sprite(randint(0, 4), 0)
      while not game.is_game_over():
          x = input.acceleration(Dimension.X)
          if x < -300:
              player.change(LedSpriteProperty.X, -1)
          elif x > 300:
              player.change(LedSpriteProperty.X, 1)
          basic.pause(300)
          drop.change(LedSpriteProperty.Y, 1)
          if drop.is_touching(player):
              game.game_over()
          elif drop.get(LedSpriteProperty.Y) == 4:
              game.add_score(1)
              drop.set(LedSpriteProperty.Y, 0)
              drop.set(LedSpriteProperty.X, randint(0, 4))
    stuck:
      - "**Indentation:** lines inside the loop are pushed in once; lines inside `if` / `elif` are pushed in twice."
      - "**Capital X and Y** after `LedSpriteProperty`, lowercase `x` for your tilt number."
      - "**Two equals signs** in `== 4`."
    test:
      - My program matches, and the whole game works
      - I downloaded it to the real micro:bit (or tested it in the simulator)

quiz:
  - question: "What does `while not game.is_game_over():` do?"
    choices: ["Runs the loop one time", "Keeps looping until the game is over", "Ends the game right away", "Waits for button A"]
    answer: 1
    why: "`not` flips it: the loop keeps going while the game is NOT over."
  - question: "Which way does `player.change(LedSpriteProperty.X, -1)` move the player?"
    choices: ["Left", "Right", "Up", "Down"]
    answer: 0
    why: X is left and right, and -1 makes x smaller, which is further left.
  - question: When the drop goes back to the top, why do we use `randint(0, 4)` again?
    choices: ["To add a point", "To make it fall faster", "So it comes back in a random column", "To end the game"]
    answer: 2
    why: Without it the drop would fall in the same column every time, and the game would be too easy.
  - question: Lines that belong inside a while loop must be...
    choices: ["typed in capital letters", "indented the same amount", "numbered", "all on one line"]
    answer: 1
    why: Python uses the spaces at the start of a line to know which lines are inside the loop.
  - question: A for loop repeats a set number of times. A while loop repeats...
    choices: ["as long as its condition is True", "exactly 5 times", "only when you press A", "one time"]
    answer: 0
    why: That's why games use while loops. They don't know ahead of time how long you'll last.

ship:
  extensions:
    - title: Press A to start
      level: Easier
      goal: The game shows a message and waits until the player presses A.
      where: At the very top of your program, before the sprites are made.
      code: |
        basic.show_string("A")
        while not input.button_is_pressed(Button.A):
            basic.pause(20)
        player = game.create_sprite(2, 4)
        drop = game.create_sprite(randint(0, 4), 0)
        while not game.is_game_over():
            # the rest of your game stays the same
      new: "1-3"
      hints: ["You already wrote this loop in the Wait for a button warm-up.", "The sprites shouldn't appear until after A is pressed."]
    - title: Add sound
      level: Easier
      goal: Play a short tone every time you dodge a drop.
      where: Inside the elif where you score a point, right after game.add_score(1).
      code: |
        elif drop.get(LedSpriteProperty.Y) == 4:
            game.add_score(1)
            music.play_tone(Note.C, 100)
            drop.set(LedSpriteProperty.Y, 0)
            drop.set(LedSpriteProperty.X, randint(0, 4))
      new: "3"
      hints: ["You used music.play_tone in the music lesson.", "Try different notes: Note.C, Note.E, Note.G.", "100 means 100 milliseconds. Keep it short or the game feels slow."]
    - title: Use buttons
      level: Medium
      goal: Move with button A (left) and button B (right) instead of tilting.
      where: Replace the tilt if / elif at the top of your game loop.
      code: |
        while not game.is_game_over():
            if input.button_is_pressed(Button.A):
                player.change(LedSpriteProperty.X, ___)
            elif input.button_is_pressed(Button.___):
                player.change(LedSpriteProperty.X, 1)
            basic.pause(300)
      hints: ["You don't need the x = ... line any more.", "Fill in the two blanks."]
    - title: Speed it up
      level: Medium
      goal: The drop falls faster as your score goes up, but never so fast it's impossible.
      where: Replace basic.pause(300) with these four lines.
      code: |
        speed = 300 - game.score() * 10
        if speed < 100:
            speed = 100
        basic.pause(speed)
        drop.change(LedSpriteProperty.Y, 1)
      new: "1-4"
      hints: ["game.score() gives your current score.", "A smaller pause means a faster game.", "The if sets a speed limit. Without it, the pause would reach 0."]
    - title: A second drop
      level: Challenge
      goal: Add a second raindrop, so there are two to dodge.
      where: One new line at the top, and a copy of the drop code at the bottom of the loop.
      code: |
        drop2 = game.create_sprite(randint(0, 4), 0)
        # at the bottom of the loop, a copy for drop2:
        drop2.change(LedSpriteProperty.Y, 1)
        if drop2.is_touching(player):
            game.game_over()
        elif drop2.get(LedSpriteProperty.Y) == 4:
            # you finish these three lines
      hints: ["Make drop2 at the top, next to your first drop.", "Everything the first drop does, drop2 must do too: fall, check for a hit, and reset.", "Too hard to play? Start drop2 on row 2 so the drops are staggered."]
  reflect:
    - Explain in your own words. What's the difference between a for loop and a while loop?
    - Why does this game use while not game.is_game_over()?

teacher_notes: |
  * **Timing:** two class periods. Part 1 (warm-ups) on day 1, Part 2 and an extension on day 2.
  * **Most common bugs:** indentation (lines inside `if` / `elif` are pushed in twice), lowercase `x` vs capital
    `X`/`Y` in `LedSpriteProperty`, and `=` instead of `==` in the scoring step.
  * **x and y:** students found coordinates confusing, so the game plan step has them light LEDs with
    `led.plot(x, y)` before the game uses x and y. Have partners point at the screen and say "column, row" out loud.
    Quick check: "Where is (0, 4)?" (bottom-left).
  * **Tilt in the simulator:** move the mouse over the simulator picture. On a real micro:bit, students tilt it.
  * **Game over step:** remind students to change `if` to `elif`. Otherwise a hit on the bottom row can also score a point.
  * Students turn in their MakeCode **share link** in Ship it. Open it from the gradebook to see their code.

standards:
  - code: 6-8.CT.b.1
    how: Students design a game loop that uses repetition (while loops) and conditionals (if / elif) to move, score and end the game.
  - code: 6-8.CT.b.2
    how: Students predict what a loop prints before running it, then test their prediction.
  - code: 6-8.CS.a.4
    how: Students read the accelerometer (a sensor) and use it to control the game.
