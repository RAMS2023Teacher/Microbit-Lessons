id: ai-gesture-remote
title: AI Gesture Remote
tagline: Your model, your code, your moves
minutes: 90          # about two class periods

mission:
  big_question: How can a program use what an AI model decides?
  goal: |
    Put your AI model **inside your own code**. When the model sees a wave, the micro:bit shows a picture.
    When it sees a shake, it plays a sound. Then use your moves to play **Rock, Paper, Scissors**
    with gestures. No buttons allowed!
  picture:
    type: flow
    steps: ["You move", "Model guesses the move", "Event block runs", "micro:bit reacts"]
    caption: Your model turns a move into an event your code can use.
  you_need:
    - A partner
    - A Chromebook with your CreateAI project from last lesson
    - A **micro:bit V2**, USB cable and battery pack
  learn:
    - "**ML event blocks** run when the model sees a move"
    - "**events**: code that waits for something to happen"
    - "using **pick random** with an AI input"
  talk: A smart speaker turns on when it hears its name. What does it do after it decides it heard you?

build:
  - part: "Part 1: Model to MakeCode"
    title: Open your model
    say: Last lesson you trained a model. Today you will use it in MakeCode.
    do:
      - Open **createai.microbit.org**. Open your project from last lesson.
      - Connect your micro:bit. Test the model again. Does it still know wave, shake and still?
      - If it makes mistakes, record a few more samples and train again.
    test:
      - My model is open and trained
      - It guesses my moves correctly most of the time
    ask: Which of your moves does the model know best?

  - part: "Part 1: Model to MakeCode"
    title: Send it to MakeCode
    say: "CreateAI can open your model in **MakeCode**. It adds **ML blocks** that match your actions."
    do:
      - In CreateAI, find the button that opens your model in MakeCode, and click it.
      - MakeCode opens in **Blocks**. Look for the **ML** drawer in the block list.
      - Open the ML drawer. Find a block with one of your action names.
    tip: "**The ML drawer is made from YOUR model.** Your action names show up in the dropdowns."
    test:
      - MakeCode is open with my model
      - I found the ML drawer
    ask: What action names do you see in the ML blocks dropdown?

  - part: "Part 2: React to moves"
    title: Show a picture for a wave
    say: "An **event block** waits for something to happen. `on ML wave start` runs when the model decides you started waving."
    do:
      - Drag in an **on ML start** block. Pick **wave** in the dropdown.
      - Put a **show icon** block inside. Pick the **happy face**.
      - "Look at the simulator: it can't move like you. The real test is on the micro:bit."
    blocks: |
      {ml} on ML [wave] start:
        show icon [happy face]
    new: "1-2"
    test:
      - My blocks match the picture
    ask: Why can't the simulator test this program very well?

  - part: "Part 2: React to moves"
    title: One block for every move
    say: Add an event for each action. Now each move gets its own reaction.
    do:
      - "Add an **on ML start** block for **shake**: play a sound."
      - "Add one for **still**: clear the screen."
      - Download to your **micro:bit V2**. Unplug, add the battery pack, and try each move.
    blocks: |
      {ml} on ML [wave] start:
        show icon [happy face]
      {ml} on ML [shake] start:
        {music} play sound [giggle] until done
      {ml} on ML [still] start:
        clear screen
    new: "3-6"
    stuck:
      - "**Nothing happens?** Check that it is a micro:bit V2. It has a gold logo you can touch on the front."
      - "**Wrong reaction?** Check the dropdowns. Each block needs a different action."
    test:
      - Wave shows a happy face on the real micro:bit
      - Shake plays a sound
      - Still clears the screen
    ask: Your micro:bit is unplugged. Where is the model running now?

  - part: "Part 3: Gesture Rock, Paper, Scissors"
    title: The game plan
    say: |
      Rock, Paper, Scissors, but with moves!
      **Shake** to play. The micro:bit picks rock, paper or scissors **at random**.
      Then you and your partner compare and see who wins.
    picture:
      type: compare
      items:
        - {icon: "🪨", title: "1 = Rock", text: "A small square"}
        - {icon: "📄", title: "2 = Paper", text: "A big square"}
        - {icon: "✂️", title: "3 = Scissors", text: "The scissors icon"}
    do:
      - Read the plan with your partner.
      - Fill in which number means which choice.
    test:
      - We know what each number means
    fields: ["1 means", "2 means", "3 means"]
    ask: Why do we need the micro:bit to pick at random?

  - part: "Part 3: Gesture Rock, Paper, Scissors"
    title: Pick at random on a shake
    say: "A **variable** remembers a value. `pick random 1 to 3` gives 1, 2 or 3."
    do:
      - Change your **shake** event. Delete the sound block.
      - "Add **set choice to (pick random 1 to 3)**. Make the variable **choice** in the Variables drawer."
    blocks: |
      {ml} on ML [shake] start:
        set [choice] to (pick random [1] to [3])
    new: "2"
    test:
      - I made a variable called choice
      - The shake event sets it to a random number
    ask: What numbers can choice be after a shake?

  - part: "Part 3: Gesture Rock, Paper, Scissors"
    title: Show the choice
    say: Use **if / else if / else** to show a picture for each number.
    do:
      - Add the if block under the set block.
      - Click the **+** on the if block to get **else if** and **else**.
      - Pick the icons for rock, paper and scissors.
    blocks: |
      {ml} on ML [shake] start:
        set [choice] to (pick random [1] to [3])
        if ((choice) = [1]) then:
          show icon [small square]
        {logic} else if ((choice) = [2]) then:
          show icon [square]
        else:
          show icon [scissors]
    new: "3-8"
    test:
      - Shaking shows rock, paper or scissors
      - It's different on different shakes
    ask: Why does the last part use else instead of checking for 3?

  - part: "Part 3: Gesture Rock, Paper, Scissors"
    title: Wave to say ready
    say: Use your wave event to start each round, so both players are ready.
    do:
      - Change the wave event. Show a **question mark** with show string.
      - Download and play 5 rounds with your partner. Keep score on paper.
    blocks: |
      {ml} on ML [wave] start:
        show string ["?"]
    new: "1-2"
    test:
      - Wave shows a question mark
      - We played 5 rounds with gestures
    fields: ["My wins", "Partner's wins", "Ties"]
    ask: Did the model ever mix up wave and shake during the game? What happened when it did?

  - part: "Part 3: Gesture Rock, Paper, Scissors"
    title: "Checkpoint: the whole program"
    say: Your program should look like this. Check every dropdown.
    blocks: |
      {ml} on ML [wave] start:
        show string ["?"]
      {ml} on ML [shake] start:
        set [choice] to (pick random [1] to [3])
        if ((choice) = [1]) then:
          show icon [small square]
        {logic} else if ((choice) = [2]) then:
          show icon [square]
        else:
          show icon [scissors]
      {ml} on ML [still] start:
        clear screen
    stuck:
      - "**Download won't run the ML blocks?** It needs a micro:bit V2."
      - "**Always shows the same picture?** Check the pick random numbers are 1 and 3."
      - "**A move doesn't do anything?** Go back to CreateAI, add samples for it, train, and open in MakeCode again."
    test:
      - My program matches, and the game works on the real micro:bit
      - I saved my project and copied the share link
    ask: Name one way an AI model and the rest of your code work together in this game.

quiz:
  - question: When does an **on ML wave start** block run?
    choices: ["When you press button A", "When the model decides you started waving", "Every second", "Only in the simulator"]
    answer: 1
    why: It's an event block. It waits until the model recognizes the wave.
  - question: Which micro:bit do you need to run the ML blocks on the micro:bit itself?
    choices: ["Any micro:bit", "A micro:bit V2", "No micro:bit", "Two micro:bits"]
    answer: 1
    why: The model runs on the micro:bit's processor, and only the V2 is fast enough.
  - question: What can **choice** be after `set choice to pick random 1 to 3`?
    choices: ["Only 1", "1, 2 or 3", "Any number", "Rock"]
    answer: 1
    why: pick random gives a whole number from the first number to the last, so 1, 2 or 3.
  - question: The game shows scissors when you wave. What is the most likely problem?
    choices: ["The battery is full", "The model mixed up wave and shake", "The screen is broken", "Random numbers are wrong"]
    answer: 1
    why: Wave and shake both move the micro:bit. If the model guesses shake, the shake event runs.
  - question: How could you make the model better at telling wave and shake apart?
    choices: ["Use bigger icons", "Add more clear samples of both, train again and reopen in MakeCode", "Delete the still action", "Play faster"]
    answer: 1
    why: Better training data makes a better model. Then send the new model to MakeCode.

ship:
  extensions:
    - title: Sound effects
      level: Easier
      goal: Play a different sound for rock, paper and scissors.
      where: Inside each part of the if block, under show icon.
      blocks: |
        if ((choice) = [1]) then:
          show icon [small square]
          {music} play sound [spring] until done
      new: "3"
      hints: ["The play sound block is in the Music drawer.", "Add one under each show icon block."]
    - title: Count the rounds
      level: Easier
      goal: Every wave adds 1 to a rounds variable. Press A to show how many rounds you played.
      blocks: |
        {ml} on ML [wave] start:
          change [rounds] by [1]
          show string ["?"]
        on button [A] pressed:
          show number (rounds)
      new: "2, 4-5"
      hints: ["Make a variable called rounds.", "change rounds by 1 adds one each time."]
    - title: A new move, a new power
      level: Medium
      goal: Add a 4th action in CreateAI, like **clap**. Train, reopen in MakeCode, and make it do something new.
      hints: ["You must train again and open the model in MakeCode again.", "Your new action shows up in the ML dropdowns."]
    - title: AI exercise counter
      level: Challenge
      goal: Count your jumping jacks! Train a **jump** action, then add 1 to a score each time the model sees a jump.
      blocks: |
        {ml} on ML [jump] start:
          change [jumps] by [1]
          show number (jumps)
      new: "1-3"
      hints: ["Record lots of jump samples from different people.", "Test it: count 10 jumps yourself. Did the micro:bit count 10?"]
  reflect:
    - How did your AI model and your own code work together in this game?
    - When the model made a mistake, what happened in the game? How could you fix it?

teacher_notes: |
  * **Needs a micro:bit V2** to run the model on the micro:bit. Any version can collect data and train in CreateAI
    (last lesson), but the ML blocks only work on a V2. The simulator can't really test movement.
  * **Connecting:** CreateAI connects by Bluetooth, or by a second micro:bit plugged in by USB as a radio bridge when
    Bluetooth isn't available.
  * **Getting to MakeCode:** CreateAI has a button that opens the model in MakeCode with an ML extension made from it.
    The ML drawer and its dropdowns come from the student's own action names. Event blocks look like
    "on ML [action] start"; there are also blocks to check if an action is detected and its certainty. Labels can
    change between versions, so open one project yourself before class.
  * **Changing the model:** students who add actions must train again in CreateAI and reopen in MakeCode to get the
    new names in the blocks.
  * **Saving:** students should save the MakeCode project and copy its share link for Ship it. Remind them their
    CreateAI session also needs saving if they'll change the model later.
  * **Answer for step 7:** else catches every other case, so it doesn't need to check for 3.

standards:
  - code: 6-8.CS.b.2
    how: Students connect a model the computer learned with code they wrote to make a game neither does alone.
  - code: 6-8.CS.a.4
    how: Students use the accelerometer and a machine learning model as the input to an embedded system.
  - code: 6-8.CT.b.1
    how: Students use event blocks, a variable, random numbers and if / else to build a gesture game.
