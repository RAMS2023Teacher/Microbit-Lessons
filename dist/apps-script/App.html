<script>
/* Makes the Flask site's browser code work inside Google Apps Script.
 *  - fetch('/api/...') becomes google.script.run.api(path, body), one request at a time, with
 *    queued saves to the same place merged so a slow save can never overwrite a newer one.
 *  - the micro:bit firmware for .hex files comes from the teacher's Drive (then cached in the browser).
 *  - links like /lessons/x become ?p=/lessons/x on this web app's address.
 *  - lesson pages are filled in with the student's saved work before the lesson code starts. */
(function () {
  'use strict';
  var ML = window.ML || {};
  window.MAKERLAB_NO_USB = true;

  function run(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(no);
      r[name].apply(r, args);
    });
  }
  ML.run = run;

  // ------------------------------------------------------------ fetch
  var queue = Promise.resolve(), pending = null;
  function apiCall(path, body) {
    // merge back-to-back saves to the same lesson that haven't started yet
    if (pending && pending.path === path && /\/save$/.test(path) && !pending.started) {
      Object.keys(body).forEach(function (k) { pending.body[k] = body[k]; });
      return pending.promise;
    }
    var job = { path: path, body: body, started: false };
    job.promise = queue = queue.catch(function () {}).then(function () {
      job.started = true;
      if (pending === job) pending = null;
      return run('api', path, JSON.stringify(job.body));
    });
    pending = job;
    return job.promise;
  }
  function response(status, body) {
    return { ok: status < 400, status: status, json: function () { return Promise.resolve(body); },
             text: function () { return Promise.resolve(typeof body === 'string' ? body : JSON.stringify(body)); } };
  }
  function firmware(name) {
    var key = 'ml-firmware-' + name;
    try { var kept = localStorage.getItem(key); if (kept) return Promise.resolve(kept); } catch (e) { /* no storage */ }
    return run('firmwareInfo', name).then(function (info) {
      var parts = [];
      for (var i = 0; i < info.parts; i++) parts.push(run('firmwarePart', name, i));
      return Promise.all(parts);
    }).then(function (parts) {
      var text = parts.join('');
      try { localStorage.setItem(key, text); } catch (e) { /* full or blocked: fetch again next time */ }
      return text;
    });
  }
  var realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (url, opts) {
    url = String(url);
    var fw = /micropython-(v1|v2)\.hex$/.exec(url);
    if (fw) return firmware(fw[1]).then(function (t) { return response(200, t); });
    if (url.indexOf('/api/') === 0) {
      var body = {};
      try { body = opts && opts.body ? JSON.parse(opts.body) : {}; } catch (e) { body = {}; }
      if (!opts || !opts.method || opts.method === 'GET') body = {};
      return apiCall(url, body).then(function (r) { return response(r.status, r.body); },
        function (e) { return response(500, { ok: false, error: (e && e.message) || 'Could not reach Maker Lab.' }); });
    }
    return realFetch(url, opts);
  };

  // ------------------------------------------------------------ links
  ML.href = function (path) {
    var hash = '', i = path.indexOf('#');
    if (i >= 0) { hash = path.slice(i); path = path.slice(0, i); }
    return ML.base + '?p=' + encodeURIComponent(path) + hash;
  };
  ML.go = function (path) { window.top.location.href = ML.href(path); };
  function fixLinks(root) {
    var links = (root || document).querySelectorAll('a[href^="/"]:not([href^="//"])');
    for (var i = 0; i < links.length; i++) {
      var a = links[i], path = a.getAttribute('href');
      a.setAttribute('href', ML.href(path));
      if (!a.getAttribute('target')) a.setAttribute('target', '_top');
    }
  }
  ML.fixLinks = fixLinks;
  new MutationObserver(function () { fixLinks(document); }).observe(document.documentElement, { childList: true, subtree: true });

  // ------------------------------------------------------------ helpers for pages.js
  ML.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  ML.avatarAttr = function (a) { return ML.esc(JSON.stringify(a || {})); };

  // ------------------------------------------------------------ top bar
  function topbar() {
    var bar = document.getElementById('topbar'), d = ML.data || {}, h = [];
    h.push('<a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>micro:bit Maker Lab</a><nav>');
    (ML.nav || []).forEach(function (n) { h.push('<a href="' + n[0] + '">' + ML.esc(n[1]) + '</a>'); });
    if (!ML.teacher && d.level) {
      h.push('<a class="usermenu-lite" href="/me" title="My robot &amp; badges"><span class="nav-avatar" data-avatar="' + ML.avatarAttr(d.avatar) +
        '" data-size="30"></span><span class="nav-xp"><b id="nav-level">Lv ' + d.level.level + '</b><span class="nav-xp-bar"><i id="nav-xp-fill" style="width:' +
        d.level.pct + '%"></i></span></span> ' + ML.esc(d.name || '') + '</a>');
    }
    h.push('</nav>');
    bar.innerHTML = h.join('');
  }

  // ------------------------------------------------------------ lesson pages: put the student's work back
  function lessonPage() {
    var S = window.STATE || {}, d = ML.data || {}, $ = function (id) { return document.getElementById(id); };
    var set = function (id, v) { var el = $(id); if (el && v != null) el.value = v; };
    set('warmup-answer', S.warmup_answer);
    set('debug-reflection', S.debug_reflection);
    set('challenge-response', S.challenge_response);
    var editors = { 'ed-code': S.code, 'ed-practice': S.practice_code, 'ed-debug': S.debug_code, 'ed-challenge': S.challenge_code };
    Object.keys(editors).forEach(function (id) {
      var src = document.querySelector('#' + id + ' .ed-source');
      if (src && editors[id] != null) src.value = editors[id];
    });
    if ($('reflection')) $('reflection').hidden = !S.debug_solved;
    if ($('challenge-status') && S.challenge_submitted) $('challenge-status').textContent = 'Submitted ✓ (you can resubmit)';
    if ($('lesson-xp')) $('lesson-xp').textContent = d.lesson_xp || 0;
    var xpMax = document.querySelector('.xp-chip');
    if (xpMax) xpMax.innerHTML = '⚡ <b id="lesson-xp">' + (d.lesson_xp || 0) + '</b> / ' + (d.xp_possible || 0) + ' XP';
    if ($('lesson-stars')) $('lesson-stars').textContent = '★'.repeat(d.stars || 0) + '☆'.repeat(3 - (d.stars || 0));
    var head = document.querySelector('.lesson-head');
    if (S.feedback && head) {
      var fb = document.createElement('div');
      fb.className = 'card feedback-note';
      fb.innerHTML = '<b>💬 Feedback from your teacher</b><div></div>';
      fb.lastChild.textContent = S.feedback;
      head.insertAdjacentElement('afterend', fb);
    }
    if (ML.teacher) {
      var rewards = document.querySelector('.lesson-rewards');
      if (rewards) rewards.remove();
      var overview = $('overview');
      if (d.teacher_key && overview) overview.insertAdjacentHTML('beforebegin', d.teacher_key);
      var std = document.querySelector('.standards-box');
      if (std) std.open = true;
    }
    var box = document.querySelector('.video-box'), v = d.video;
    if (box && v) {
      box.textContent = '';
      if (v.kind === 'iframe') {
        var f = box.appendChild(document.createElement('iframe'));
        f.src = v.src; f.title = 'Lesson video'; f.allow = 'encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
      } else if (v.kind === 'video') {
        var vid = box.appendChild(document.createElement('video')); vid.src = v.src; vid.controls = true;
      } else {
        var a = box.appendChild(document.createElement('a')); a.href = v.src; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'video-link'; a.textContent = '▶ Watch the lesson video';
      }
    } else if (box && ML.teacher) {
      var ph = box.querySelector('.video-placeholder');
      if (ph) ph.insertAdjacentHTML('beforeend', '<small>Add one on the <a href="/teacher/videos">Videos</a> page.</small>');
    }
  }

  topbar();
  if (ML.page === 'lesson') lessonPage();
  fixLinks(document);
  window.addEventListener('load', function () {
    if (window.showRewards && ML.data && ML.data.rewards) window.showRewards(ML.data.rewards);
  });
  window.ML = ML;
})();

/* Robot avatar renderer. Part ids must match AVATAR_OPTIONS in app/gamify.py.
 * Usage: <span data-avatar='{"body":"box",...}' data-size="48"></span>  (auto-rendered)
 *        RobotAvatar.svg(spec, size) -> SVG markup string */
(function () {
  'use strict';
  let uid = 0;
  const COLORS = {
    teal: ['#14b8a6', '#0d8f82'], red: ['#ef4444', '#b91c1c'], orange: ['#fb923c', '#c2410c'],
    yellow: ['#facc15', '#ca8a04'], green: ['#4ade80', '#15803d'], blue: ['#60a5fa', '#1d4ed8'],
    purple: ['#a78bfa', '#6d28d9'], pink: ['#f472b6', '#be185d'], white: ['#f1f5f9', '#94a3b8'],
    chrome: ['url(#CHROME)', '#64748b'], gold: ['url(#GOLD)', '#a16207'],
  };
  const BG = { sky: '#bfe3ff', mint: '#c7f5df', sun: '#ffe9a8', lilac: '#e3d7ff', night: '#1e2a55', circuit: '#0f3d3a', stars: '#0b1026' };
  const HEADS = {
    box: { x: 25, y: 20, w: 50, h: 40, r: 8 },
    round: { x: 24, y: 18, w: 52, h: 42, r: 21 },
    tall: { x: 31, y: 12, w: 38, h: 48, r: 10 },
    tank: { x: 20, y: 24, w: 60, h: 34, r: 7 },
    hover: { x: 26, y: 18, w: 48, h: 40, r: 16 },
  };
  const DEFAULT = { body: 'box', color: 'teal', eyes: 'round', mouth: 'smile', antenna: 'ball', accessory: 'none', bg: 'sky' };

  function svg(spec, size) {
    const a = Object.assign({}, DEFAULT, spec || {});
    const id = 'av' + (++uid);
    const [fill, dark] = COLORS[a.color] || COLORS.teal;
    const F = fill.replace('CHROME', id + 'c').replace('GOLD', id + 'g');
    const H = HEADS[a.body] || HEADS.box;
    const cx = H.x + H.w / 2;
    const eyeY = H.y + H.h * 0.42, mouthY = H.y + H.h * 0.74;
    const ex = H.w * 0.2;
    const ink = '#13203f';
    const o = [];
    o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${size}" height="${size}" class="robot-avatar" role="img" aria-label="${(a.name || 'robot avatar').replace(/[<>"&]/g, '')}">`);
    o.push(`<defs><linearGradient id="${id}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>` +
      `<linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#eab308"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>` +
      `<clipPath id="${id}clip"><rect width="100" height="100" rx="22"/></clipPath></defs>`);
    o.push(`<g clip-path="url(#${id}clip)"><rect width="100" height="100" fill="${BG[a.bg] || BG.sky}"/>`);
    if (a.bg === 'circuit') {
      o.push('<g stroke="#2dd4bf" stroke-width="1.6" fill="none" opacity=".55"><path d="M0 18h22l8 8h20M100 30H78l-6 6v20M0 70h14l10-10M100 82H70l-8-8"/></g><g fill="#5eead4" opacity=".7"><circle cx="50" cy="26" r="2.2"/><circle cx="72" cy="56" r="2.2"/><circle cx="24" cy="60" r="2.2"/></g>');
    } else if (a.bg === 'stars') {
      o.push('<g fill="#fff">' + [[12, 14], [84, 10], [90, 44], [8, 52], [70, 22], [20, 86], [92, 78], [40, 8]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 0.9 : 1.6}"/>`).join('') + '</g>');
    } else if (a.bg === 'night') {
      o.push('<circle cx="82" cy="16" r="7" fill="#fef3c7"/><circle cx="85" cy="14" r="6" fill="#1e2a55"/>');
    }
    // cape (behind body)
    if (a.accessory === 'cape') o.push(`<path d="M30 64 L18 100 H82 L70 64 Z" fill="#dc2626"/><path d="M30 64 L24 100 H32 Z" fill="#991b1b"/>`);
    // torso
    const tw = a.body === 'tank' ? 46 : 36, tx = 50 - tw / 2;
    o.push(`<rect x="${tx}" y="${H.y + H.h + 2}" width="${tw}" height="${a.body === 'tank' ? 22 : 30}" rx="7" fill="${F}" stroke="${dark}" stroke-width="2"/>`);
    o.push(`<rect x="44" y="${H.y + H.h + 8}" width="12" height="8" rx="2" fill="${ink}" opacity=".8"/><circle cx="47" cy="${H.y + H.h + 12}" r="1.4" fill="#4ade80"/><circle cx="53" cy="${H.y + H.h + 12}" r="1.4" fill="#f87171"/>`);
    if (a.body === 'tank') {
      o.push(`<rect x="18" y="80" width="64" height="16" rx="8" fill="#334155"/>` + [26, 38, 50, 62, 74].map((x) => `<circle cx="${x}" cy="88" r="4.5" fill="#94a3b8" stroke="#1e293b"/>`).join(''));
    } else if (a.body === 'hover') {
      o.push(`<path d="M40 ${H.y + H.h + 32} q3 10 6 0 M54 ${H.y + H.h + 32} q3 10 6 0" fill="#fb923c" stroke="#fde047" stroke-width="1.5"/>`);
    } else {
      o.push(`<rect x="22" y="${H.y + H.h + 6}" width="7" height="20" rx="3.5" fill="${F}" stroke="${dark}" stroke-width="1.6"/><rect x="71" y="${H.y + H.h + 6}" width="7" height="20" rx="3.5" fill="${F}" stroke="${dark}" stroke-width="1.6"/>`);
    }
    // antenna
    const top = H.y;
    switch (a.antenna) {
      case 'ball': o.push(`<line x1="${cx}" y1="${top}" x2="${cx}" y2="${top - 9}" stroke="${ink}" stroke-width="2"/><circle cx="${cx}" cy="${top - 11}" r="3.6" fill="#f43f5e"/>`); break;
      case 'double': o.push(`<path d="M${cx - 9} ${top} l-4 -10 M${cx + 9} ${top} l4 -10" stroke="${ink}" stroke-width="2"/><circle cx="${cx - 13}" cy="${top - 11}" r="3" fill="#facc15"/><circle cx="${cx + 13}" cy="${top - 11}" r="3" fill="#facc15"/>`); break;
      case 'bolt': o.push(`<path d="M${cx + 1} ${top - 16} l-6 9 h5 l-3 8 l8 -10 h-5 l3 -7 z" fill="#facc15" stroke="#a16207" stroke-width="1"/>`); break;
      case 'dish': o.push(`<line x1="${cx}" y1="${top}" x2="${cx}" y2="${top - 6}" stroke="${ink}" stroke-width="2"/><path d="M${cx - 9} ${top - 13} a9 6 0 0 0 18 0 z" fill="#e2e8f0" stroke="${ink}" stroke-width="1.5"/><circle cx="${cx}" cy="${top - 12}" r="1.5" fill="${ink}"/>`); break;
      case 'propeller': o.push(`<line x1="${cx}" y1="${top}" x2="${cx}" y2="${top - 8}" stroke="${ink}" stroke-width="2"/><ellipse cx="${cx - 8}" cy="${top - 9}" rx="8" ry="2.4" fill="#38bdf8"/><ellipse cx="${cx + 8}" cy="${top - 9}" rx="8" ry="2.4" fill="#f472b6"/><circle cx="${cx}" cy="${top - 9}" r="2" fill="${ink}"/>`); break;
    }
    // head + face plate
    o.push(`<rect x="${H.x}" y="${H.y}" width="${H.w}" height="${H.h}" rx="${H.r}" fill="${F}" stroke="${dark}" stroke-width="2.2"/>`);
    o.push(`<rect x="${H.x + 6}" y="${H.y + 7}" width="${H.w - 12}" height="${H.h - 13}" rx="${Math.max(4, H.r - 4)}" fill="#eaf4ff" opacity=".92"/>`);
    // headphones band goes over the head
    if (a.accessory === 'headphones') o.push(`<path d="M${H.x - 2} ${H.y + H.h * 0.5} Q${cx} ${H.y - 22} ${H.x + H.w + 2} ${H.y + H.h * 0.5}" fill="none" stroke="#1f2937" stroke-width="3.5"/><rect x="${H.x - 7}" y="${H.y + H.h * 0.32}" width="9" height="16" rx="4" fill="#ef4444"/><rect x="${H.x + H.w - 2}" y="${H.y + H.h * 0.32}" width="9" height="16" rx="4" fill="#ef4444"/>`);
    // eyes
    const L = cx - ex, R = cx + ex;
    switch (a.eyes) {
      case 'dots': o.push(`<circle cx="${L}" cy="${eyeY}" r="2.6" fill="${ink}"/><circle cx="${R}" cy="${eyeY}" r="2.6" fill="${ink}"/>`); break;
      case 'visor': o.push(`<rect x="${H.x + 9}" y="${eyeY - 5}" width="${H.w - 18}" height="10" rx="5" fill="#0f172a"/><rect x="${L - 4}" y="${eyeY - 2}" width="8" height="4" rx="2" fill="#22d3ee"/><rect x="${R - 4}" y="${eyeY - 2}" width="8" height="4" rx="2" fill="#22d3ee"/>`); break;
      case 'cyclops': o.push(`<circle cx="${cx}" cy="${eyeY}" r="8" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="${cx + 1.5}" cy="${eyeY}" r="4" fill="${ink}"/><circle cx="${cx + 3}" cy="${eyeY - 1.5}" r="1.3" fill="#fff"/>`); break;
      case 'hearts': [L, R].forEach((x) => o.push(`<path d="M${x} ${eyeY + 4} l-5 -5 a2.8 2.8 0 0 1 5 -3.5 a2.8 2.8 0 0 1 5 3.5 z" fill="#ef4444"/>`)); break;
      case 'leds': [L, R].forEach((x) => { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) o.push(`<rect x="${x + i * 3.2 - 1.2}" y="${eyeY + j * 3.2 - 1.2}" width="2.4" height="2.4" fill="${(i + j) % 2 ? '#7f1d1d' : '#ef4444'}"/>`); }); break;
      case 'happy': [L, R].forEach((x) => o.push(`<path d="M${x - 4} ${eyeY + 1.5} q4 -6 8 0" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`)); break;
      default: [L, R].forEach((x) => o.push(`<circle cx="${x}" cy="${eyeY}" r="5" fill="#fff" stroke="${ink}" stroke-width="1.8"/><circle cx="${x + 1}" cy="${eyeY + 0.5}" r="2.5" fill="${ink}"/>`));
    }
    // goggles over the eyes' forehead
    if (a.accessory === 'goggles') o.push(`<rect x="${H.x - 1}" y="${H.y + 4}" width="${H.w + 2}" height="4" fill="#1f2937"/><circle cx="${L}" cy="${H.y + 6}" r="5.5" fill="#bae6fd" stroke="#f59e0b" stroke-width="2"/><circle cx="${R}" cy="${H.y + 6}" r="5.5" fill="#bae6fd" stroke="#f59e0b" stroke-width="2"/>`);
    // mouth
    const mw = H.w * 0.18;
    switch (a.mouth) {
      case 'flat': o.push(`<line x1="${cx - mw}" y1="${mouthY}" x2="${cx + mw}" y2="${mouthY}" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`); break;
      case 'open': o.push(`<ellipse cx="${cx}" cy="${mouthY}" rx="${mw * 0.6}" ry="4" fill="${ink}"/><ellipse cx="${cx}" cy="${mouthY + 2}" rx="${mw * 0.4}" ry="1.6" fill="#f87171"/>`); break;
      case 'grille': o.push(`<rect x="${cx - mw}" y="${mouthY - 3.5}" width="${mw * 2}" height="7" rx="2" fill="${ink}"/>` + [-0.5, 0, 0.5].map((k) => `<line x1="${cx + k * mw}" y1="${mouthY - 3.5}" x2="${cx + k * mw}" y2="${mouthY + 3.5}" stroke="#94a3b8" stroke-width="1"/>`).join('')); break;
      case 'zigzag': o.push(`<path d="M${cx - mw} ${mouthY} l${mw / 2} -3 l${mw / 2} 3 l${mw / 2} -3 l${mw / 2} 3" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linejoin="round"/>`); break;
      default: o.push(`<path d="M${cx - mw} ${mouthY - 2} q${mw} 7 ${mw * 2} 0" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`);
    }
    // hats & neckwear
    if (a.accessory === 'bowtie') o.push(`<path d="M50 ${H.y + H.h + 5} l-8 -5 v10 z M50 ${H.y + H.h + 5} l8 -5 v10 z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/><circle cx="50" cy="${H.y + H.h + 5}" r="2.2" fill="#b91c1c"/>`);
    if (a.accessory === 'cap') o.push(`<path d="M${H.x + 4} ${H.y + 3} a${H.w / 2 - 4} 13 0 0 1 ${H.w - 8} 0 z" fill="#2563eb"/><rect x="${cx}" y="${H.y}" width="${H.w / 2 + 6}" height="4" rx="2" fill="#1d4ed8"/><circle cx="${cx}" cy="${H.y - 9}" r="1.8" fill="#facc15"/>`);
    if (a.accessory === 'crown') o.push(`<path d="M${cx - 14} ${H.y + 2} l0 -12 l7 6 l7 -10 l7 10 l7 -6 l0 12 z" fill="#facc15" stroke="#a16207" stroke-width="1.4"/><circle cx="${cx}" cy="${H.y - 4}" r="1.8" fill="#ef4444"/>`);
    o.push('</g></svg>');
    return o.join('');
  }

  function renderAll(root) {
    (root || document).querySelectorAll('[data-avatar]').forEach((el) => {
      let spec = {};
      try { spec = JSON.parse(el.dataset.avatar || '{}'); } catch (e) { /* default */ }
      el.innerHTML = svg(spec, el.dataset.size || 48);
    });
  }

  window.RobotAvatar = { svg, renderAll };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => renderAll());
  else renderAll();
})();

/* XP toasts, badge pop-ups and level-up celebrations. Call showRewards(rewards). */
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function stack() {
    let s = document.getElementById('reward-stack');
    if (!s) {
      s = document.createElement('div');
      s.id = 'reward-stack';
      s.setAttribute('aria-live', 'polite');
      document.body.appendChild(s);
    }
    return s;
  }

  function toast(html, cls, ms) {
    const t = document.createElement('div');
    t.className = 'reward-toast ' + (cls || '');
    t.innerHTML = html;
    stack().appendChild(t);
    setTimeout(() => t.classList.add('out'), ms || 3800);
    setTimeout(() => t.remove(), (ms || 3800) + 500);
  }

  function confetti() {
    if (reduced) return;
    const box = document.createElement('div');
    box.className = 'confetti';
    const colors = ['#ffd23f', '#0fa3a3', '#ef4444', '#60a5fa', '#a78bfa', '#4ade80'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.6 + 's';
      p.style.animationDuration = 1.8 + Math.random() * 1.4 + 's';
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 4000);
  }

  function updateHeader(level) {
    if (!level) return;
    const fill = document.getElementById('nav-xp-fill');
    const lab = document.getElementById('nav-level');
    if (fill) fill.style.width = level.pct + '%';
    if (lab) lab.textContent = 'Lv ' + level.level;
  }

  function showRewards(r) {
    if (!r || (!r.xp_gained && !(r.badges || []).length)) return;
    let delay = 0;
    if (r.xp_gained) {
      const reasons = (r.items || []).map((i) => `<li>+${i.amount} ${esc(i.reason)}</li>`).join('');
      toast(`<b class="xp-pop">+${r.xp_gained} XP</b><ul>${reasons}</ul>`, 'xp');
      delay += 500;
    }
    (r.badges || []).forEach((b) => {
      setTimeout(() => toast(`<span class="badge-big">${esc(b.icon)}</span><div><small>Badge unlocked!</small><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`, 'badge', 6000), delay);
      delay += 700;
    });
    if (r.level_up && r.level) {
      setTimeout(() => {
        confetti();
        toast(`<span class="badge-big">🚀</span><div><small>Level up!</small><b>Level ${r.level.level}: ${esc(r.level.title)}</b><span>Check your robot — new parts may be unlocked.</span></div>`, 'level', 7000);
      }, delay);
    }
    updateHeader(r.level);
  }

  window.showRewards = showRewards;
})();

/* Draws lesson circuits on a virtual breadboard (SVG).
 * Address scheme matches app/circuits.py — see docs/LESSON_FORMAT.md. */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const P = 16;                 // hole pitch
  const BX = 175;               // breadboard left
  const BW = 40 + 29 * P;       // breadboard width
  const COLX = (c) => BX + 20 + (c - 1) * P;
  const ROWY = { a: 82, b: 98, c: 114, d: 130, e: 146, f: 186, g: 202, h: 218, i: 234, j: 250 };
  const RAILY = { 'T+': 30, 'T-': 46, 'B+': 286, 'B-': 302 };
  const MB_PINS = ['3V', 'GND', 'P0', 'P1', 'P2', 'P8', 'P12', 'P13', 'P14', 'P15', 'P16', 'P19', 'P20'];
  const MBY = (i) => 38 + i * 22;
  const OFF_X = BX + BW + 50;
  const BOARD_TERMS = {
    led: ['anode', 'cathode'], resistor: ['a', 'b'], button: ['a', 'b'], ldr: ['a', 'b'],
    diode: ['anode', 'cathode'], capacitor: ['a', 'b'], buzzer: ['plus', 'minus'],
    potentiometer: ['left', 'wiper', 'right'], transistor: ['collector', 'base', 'emitter'],
  };
  const OFF_TERMS = { servo: ['sig', 'vcc', 'gnd'], dcmotor: ['a', 'b'], battery: ['plus', 'minus'] };
  const WIRE = { red: '#e53935', black: '#263238', blue: '#1e88e5', green: '#43a047', yellow: '#fdd835',
    orange: '#fb8c00', white: '#eceff1', purple: '#8e24aa', brown: '#795548', gray: '#90a4ae' };
  const LEDC = { red: '#ff3b30', green: '#34c759', yellow: '#ffd60a', blue: '#0a84ff', white: '#f5f5f5', orange: '#ff9f0a' };

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function text(parent, x, y, str, attrs) {
    const t = el('text', Object.assign({ x, y }, attrs || {}), parent);
    t.textContent = str;
    return t;
  }

  function holeXY(addr) {
    let m = /^([a-j])(\d{1,2})$/.exec(addr);
    if (m) return [COLX(+m[2]), ROWY[m[1]]];
    m = /^(T\+|T-|B\+|B-)(\d{1,2})$/.exec(addr);
    if (m) return [COLX(+m[2]), RAILY[m[1]]];
    return null;
  }

  function layoutOffboard(steps) {
    const boxes = {};
    let y = 20;
    steps.forEach((s) => (s.add || []).forEach((p) => {
      if (p.type in OFF_TERMS || p.type === 'module') {
        const terms = p.type === 'module' ? (p.terminals || []) : OFF_TERMS[p.type];
        const h = Math.max(56, 26 + terms.length * 20);
        boxes[p.id] = { part: p, x: OFF_X, y, h, terms };
        y += h + 18;
      }
    }));
    return { boxes, height: y };
  }

  function render(container, circuit, stepIndex, opts) {
    opts = opts || {};
    const steps = circuit.steps || [];
    const { boxes, height } = layoutOffboard(steps);
    const W = Object.keys(boxes).length ? OFF_X + 190 : BX + BW + 20;
    const H = Math.max(330, height + 10);
    container.innerHTML = '';
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'bb-svg', role: 'img' }, container);
    const defs = el('defs', {}, svg);
    const f = el('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
    el('feGaussianBlur', { stdDeviation: '3', result: 'b' }, f);
    const fm = el('feMerge', {}, f);
    el('feMergeNode', { in: 'b' }, fm);
    el('feMergeNode', { in: 'SourceGraphic' }, fm);

    // micro:bit breakout
    const mb = el('g', { class: 'bb-mb' }, svg);
    el('rect', { x: 8, y: 14, width: 130, height: MBY(MB_PINS.length - 1) + 22, rx: 8, class: 'mb-board' }, mb);
    text(mb, 20, 30, 'micro:bit breakout', { class: 'mb-title' });
    const pinXY = {};
    MB_PINS.forEach((pin, i) => {
      const y = MBY(i) + 10;
      pinXY['mb.' + pin] = [128, y];
      el('rect', { x: 20, y: y - 7, width: 86, height: 14, rx: 3, class: 'mb-pin' + (pin === '3V' ? ' pwr' : pin === 'GND' ? ' gnd' : '') }, mb);
      text(mb, 26, y + 4, pin, { class: 'mb-pin-label' });
      el('circle', { cx: 128, cy: y, r: 4, class: 'term' }, mb);
    });

    // breadboard
    const bb = el('g', { class: 'bb-board' }, svg);
    el('rect', { x: BX, y: 10, width: BW, height: 310, rx: 8, class: 'board' }, bb);
    el('rect', { x: BX, y: 160, width: BW, height: 12, class: 'ravine' }, bb);
    [['T+', '#e53935'], ['T-', '#1e88e5'], ['B+', '#e53935'], ['B-', '#1e88e5']].forEach(([r, col]) => {
      const y = RAILY[r] + (r.endsWith('+') ? -9 : 9);
      el('line', { x1: BX + 12, y1: y, x2: BX + BW - 12, y2: y, stroke: col, 'stroke-width': 2 }, bb);
      text(bb, BX + 4, RAILY[r] + 4, r[1], { class: 'rail-label', fill: col });
    });
    for (let c = 1; c <= 30; c++) {
      if (c === 1 || c % 5 === 0) {
        text(bb, COLX(c), 70, String(c), { class: 'col-label', 'text-anchor': 'middle' });
        text(bb, COLX(c), 270, String(c), { class: 'col-label', 'text-anchor': 'middle' });
      }
      for (const r in ROWY) el('rect', { x: COLX(c) - 3, y: ROWY[r] - 3, width: 6, height: 6, rx: 1, class: 'hole' }, bb);
      for (const r in RAILY) el('rect', { x: COLX(c) - 3, y: RAILY[r] - 3, width: 6, height: 6, rx: 1, class: 'hole' }, bb);
    }
    for (const r in ROWY) {
      text(bb, BX + 8, ROWY[r] + 4, r, { class: 'row-label' });
      text(bb, BX + BW - 12, ROWY[r] + 4, r, { class: 'row-label' });
    }

    // off-board boxes
    const termXY = {};
    const offLayer = el('g', {}, svg);
    const partLayer = el('g', {}, svg);
    const wireLayer = el('g', {}, svg);
    const shown = steps.slice(0, stepIndex + 1);
    svg.classList.toggle('has-old', stepIndex > 0 && !opts.plain);
    const placed = new Set();
    shown.forEach((s) => (s.add || []).forEach((p) => { if (p.id) placed.add(p.id); }));
    for (const id in boxes) {
      const b = boxes[id];
      b.terms.forEach((t, i) => { termXY[id + '.' + t] = [b.x, b.y + 30 + i * 20]; });
    }

    const used = [];
    function pos(addr) {
      return holeXY(addr) || pinXY[addr] || termXY[addr] || boardTermXY[addr] || null;
    }
    const boardTermXY = {};
    steps.forEach((s) => (s.add || []).forEach((p) => {
      (BOARD_TERMS[p.type] || []).forEach((t) => { const xy = holeXY(p[t] || ''); if (xy) boardTermXY[p.id + '.' + t] = xy; });
    }));

    shown.forEach((s, si) => {
      const isNew = si === stepIndex && !opts.plain;
      (s.add || []).forEach((p) => {
        const cls = 'part' + (isNew ? ' new' : '');
        if (p.type === 'wire') {
          const a = pos(p.from), b = pos(p.to);
          if (!a || !b) return;
          used.push(a, b);
          const g = el('g', { class: cls }, wireLayer);
          el('title', {}, g).textContent = `${p.color || 'red'} wire: ${p.from} → ${p.to}`;
          const dx = b[0] - a[0], dy = b[1] - a[1];
          const dist = Math.hypot(dx, dy);
          const lift = Math.min(60, 12 + dist * 0.18);
          const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 - lift;
          let d = `M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`;
          if (a[0] >= OFF_X - 1 && b[0] >= OFF_X - 1) {
            // between two off-board parts: loop out to the left of the boxes
            const k = 22 + Math.abs(dy) * 0.12;
            d = `M${a[0]},${a[1]} C${a[0] - k},${a[1]} ${b[0] - k},${b[1]} ${b[0]},${b[1]}`;
          }
          el('path', { d, class: 'wire-shadow' }, g);
          el('path', { d, class: 'wire', stroke: WIRE[p.color] || WIRE.red }, g);
          el('circle', { cx: a[0], cy: a[1], r: 3.2, class: 'wire-end' }, g);
          el('circle', { cx: b[0], cy: b[1], r: 3.2, class: 'wire-end' }, g);
        } else if (BOARD_TERMS[p.type]) {
          BOARD_TERMS[p.type].forEach((t) => { const xy = holeXY(p[t] || ''); if (xy) used.push(xy); });
          drawBoardPart(partLayer, p, cls);
        } else if (boxes[p.id]) {
          const bx = boxes[p.id];
          used.push([bx.x, bx.y], [bx.x + 170, bx.y + bx.h]);
          drawBox(offLayer, boxes[p.id], cls);
        }
      });
    });
    if (opts.crop && used.length) {
      const xs = used.map((q) => q[0]), ys = used.map((q) => q[1]);
      let x0 = Math.min(...xs) - 34, x1 = Math.max(...xs) + 34, y0 = Math.min(...ys) - 44, y1 = Math.max(...ys) + 30;
      if (xs.some((x) => x < BX)) x0 = Math.min(x0, 4);            // include the micro:bit breakout labels
      if (x1 - x0 < 260) { const c = (x0 + x1) / 2; x0 = c - 130; x1 = c + 130; }
      if (y1 - y0 < 150) { const c = (y0 + y1) / 2; y0 = c - 75; y1 = c + 75; }
      svg.setAttribute('viewBox', `${Math.max(0, x0)} ${Math.max(0, y0)} ${x1 - Math.max(0, x0)} ${y1 - Math.max(0, y0)}`);
    }
    return svg;
  }

  function drawBoardPart(layer, p, cls) {
    const terms = BOARD_TERMS[p.type];
    const pts = terms.map((t) => holeXY(p[t] || '')).filter(Boolean);
    if (pts.length !== terms.length) return;
    const g = el('g', { class: cls + ' p-' + p.type }, layer);
    const label = {
      led: `${p.color || 'red'} LED (${p.id}): long leg ${p.anode}, short leg ${p.cathode}`,
      resistor: `${p.ohms || ''}Ω resistor (${p.id}): ${p.a} – ${p.b}`,
      potentiometer: `potentiometer (${p.id}): ${p.left} / wiper ${p.wiper} / ${p.right}`,
      transistor: `${p.label || 'transistor'} (${p.id}): C ${p.collector}, B ${p.base}, E ${p.emitter}`,
    }[p.type] || `${p.type} (${p.id}): ` + terms.map((t) => `${t} ${p[t]}`).join(', ');
    el('title', {}, g).textContent = label;
    const cx = pts.reduce((s, q) => s + q[0], 0) / pts.length;
    const cy0 = pts.reduce((s, q) => s + q[1], 0) / pts.length;
    const horizontal = Math.abs(pts[0][1] - pts[pts.length - 1][1]) < 4;
    const span = Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
    const lift = (p.type === 'resistor' || p.type === 'diode') && span > 30 ? 0 : 16;
    const bx = horizontal ? cx : cx - lift, by = horizontal ? cy0 - lift : cy0;
    pts.forEach((q) => el('line', { x1: q[0], y1: q[1], x2: bx, y2: by, class: 'leg' }, g));
    pts.forEach((q) => el('circle', { cx: q[0], cy: q[1], r: 2.4, class: 'leg-end' }, g));
    const ang = Math.atan2(pts[pts.length - 1][1] - pts[0][1], pts[pts.length - 1][0] - pts[0][0]) * 180 / Math.PI;
    switch (p.type) {
      case 'led': {
        el('circle', { cx: bx, cy: by, r: 9, fill: LEDC[p.color] || LEDC.red, class: 'led-body' }, g);
        el('circle', { cx: bx - 3, cy: by - 3, r: 2.5, fill: '#fff', opacity: 0.7 }, g);
        text(g, pts[0][0] - 9, pts[0][1] + 15, '+', { class: 'pol' });
        text(g, pts[1][0] + 3, pts[1][1] + 15, '–', { class: 'pol' });
        break;
      }
      case 'resistor': case 'diode': {
        const gg = el('g', { transform: `rotate(${ang} ${bx} ${by})` }, g);
        if (p.type === 'resistor') {
          el('rect', { x: bx - 14, y: by - 5, width: 28, height: 10, rx: 4, class: 'res-body' }, gg);
          ['#c62828', '#c62828', '#6d4c41'].forEach((c, i) => el('rect', { x: bx - 8 + i * 5, y: by - 5, width: 2.5, height: 10, fill: c }, gg));
        } else {
          el('rect', { x: bx - 12, y: by - 5, width: 24, height: 10, rx: 2, fill: '#212121' }, gg);
          el('rect', { x: bx + 6, y: by - 5, width: 3, height: 10, fill: '#e0e0e0' }, gg);
        }
        break;
      }
      case 'ldr':
        el('circle', { cx: bx, cy: by, r: 9, class: 'ldr-body' }, g);
        el('path', { d: `M${bx - 5},${by - 3} q2.5,-4 5,0 t5,0 M${bx - 5},${by + 3} q2.5,-4 5,0 t5,0`, class: 'ldr-squiggle' }, g);
        break;
      case 'button':
        el('rect', { x: bx - 10, y: by - 10, width: 20, height: 20, rx: 3, fill: '#37474f' }, g);
        el('circle', { cx: bx, cy: by, r: 6, fill: '#ef5350' }, g);
        break;
      case 'capacitor':
        el('rect', { x: bx - 7, y: by - 10, width: 14, height: 20, rx: 5, fill: '#1565c0' }, g);
        break;
      case 'buzzer':
        el('circle', { cx: bx, cy: by, r: 11, fill: '#212121' }, g);
        el('circle', { cx: bx, cy: by, r: 2, fill: '#888' }, g);
        text(g, pts[0][0] - 9, pts[0][1] + 15, '+', { class: 'pol' });
        break;
      case 'potentiometer':
        el('rect', { x: bx - 16, y: by - 10, width: 32, height: 20, rx: 4, fill: '#1e88e5' }, g);
        el('circle', { cx: bx, cy: by, r: 6, fill: '#eceff1' }, g);
        el('line', { x1: bx, y1: by, x2: bx, y2: by - 6, stroke: '#455a64', 'stroke-width': 2 }, g);
        break;
      case 'transistor':
        el('path', { d: `M${bx - 11},${by + 7} L${bx - 11},${by - 2} A11,11 0 0 1 ${bx + 11},${by - 2} L${bx + 11},${by + 7} Z`, fill: '#212121' }, g);
        text(g, bx, by + 4, p.label ? p.label.slice(0, 7) : 'NPN', { class: 'part-tiny', 'text-anchor': 'middle' });
        ['C', 'B', 'E'].forEach((L, i) => text(g, pts[i][0], pts[i][1] + 16, L, { class: 'pol', 'text-anchor': 'middle' }));
        break;
    }
  }

  function drawBox(layer, b, cls) {
    const p = b.part;
    const g = el('g', { class: cls + ' offboard' }, layer);
    const title = p.label || { servo: 'Servo motor', dcmotor: 'DC motor', battery: 'Battery pack' }[p.type] || p.type;
    el('title', {}, g).textContent = `${title} (${p.id})`;
    const fill = { servo: '#1565c0', dcmotor: '#ffb300', battery: '#424242', module: '#00796b' }[p.type];
    el('rect', { x: b.x, y: b.y, width: 170, height: b.h, rx: 8, fill, class: 'box' }, g);
    text(g, b.x + 12, b.y + 17, title, { class: 'box-title' });
    b.terms.forEach((t, i) => {
      const y = b.y + 30 + i * 20;
      el('circle', { cx: b.x, cy: y, r: 4.5, class: 'term' }, g);
      const nice = { sig: 'signal', vcc: '+ power', gnd: '– ground', plus: '+', minus: '–', a: 'A', b: 'B' }[t] || t;
      text(g, b.x + 12, y + 4, nice, { class: 'box-term' });
    });
  }

  window.Breadboard = { render };
})();

/* Visual aids for lesson cards, quiz questions and challenges.
 * Lesson YAML:  visual: {type: leds, image: HEART, caption: "..."}
 * Types: leds, part, circuit, flow, wave, scale, compare, bits, dial, graph
 * (validated by app/visuals.py — keep the two in sync; see docs/LESSON_FORMAT.md). */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const INK = '#17203a', MUTED = '#5d6680', TEAL = '#0fa3a3', YELLOW = '#ffd23f', RED = '#ef4444', LINE = '#c9cfdd';
  const svg = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" xmlns="${NS}">${body}</svg>`;
  // fill="..." on text becomes an inline style so it beats the .vz-* CSS colors
  const t = (x, y, s, o) => `<text x="${x}" y="${y}" ${(o || '').replace(/\bfill="([^"]+)"/, 'style="fill:$1"')}>${esc(s)}</text>`;

  // ---------------------------------------------------------------- leds
  const IMAGES = {
    HEART: '09090:99999:99999:09990:00900', HEART_SMALL: '00000:09090:09990:00900:00000',
    HAPPY: '00000:09090:00000:90009:09990', SMILE: '00000:00000:00000:90009:09990',
    SAD: '00000:09090:00000:09990:90009', YES: '00000:00009:00090:90900:09000',
    NO: '90009:09090:00900:09090:90009', SQUARE: '99999:90009:90009:90009:99999',
    DIAMOND: '00900:09090:90009:09090:00900', STICKFIGURE: '00900:99999:00900:09090:90009',
    ARROW_N: '00900:09990:90909:00900:00900', ARROW_E: '00900:00090:99999:00090:00900',
    ARROW_W: '00900:09000:99999:09000:00900', ARROW_S: '00900:00900:90909:09990:00900',
    SKULL: '09990:90909:99999:09990:09990', GHOST: '99999:90909:99999:99999:90909',
    TARGET: '00900:09990:99099:09990:00900', ALL: '99999:99999:99999:99999:99999', OFF: '00000:00000:00000:00000:00000',
  };
  function ledGrid(img, x0, y0, cell) {
    const rows = (IMAGES[img] || img).split(':');
    let o = '';
    rows.forEach((row, r) => row.split('').forEach((ch, c) => {
      const b = parseInt(ch, 10) / 9;
      o += `<rect x="${x0 + c * cell}" y="${y0 + r * cell}" width="${cell * 0.62}" height="${cell * 0.62}" rx="2" fill="${b ? RED : '#3b4366'}" opacity="${b ? 0.25 + 0.75 * b : 1}"${b > 0.5 ? ' filter="url(#ledglow)"' : ''}/>`;
    }));
    return o;
  }
  function leds(v) {
    const frames = v.frames || [v.image || 'OFF'];
    const cell = 22, W = frames.length > 1 ? 170 * Math.min(frames.length, 4) : 170, H = 170;
    let body = '<defs><filter id="ledglow"><feGaussianBlur stdDeviation="1.6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
    frames.slice(0, 4).forEach((f, i) => {
      const x = i * 170;
      body += `<rect x="${x + 10}" y="10" width="150" height="150" rx="18" fill="#1b2550"/>`;
      body += `<circle cx="${x + 26}" cy="85" r="7" fill="#2b3770"/><circle cx="${x + 144}" cy="85" r="7" fill="#2b3770"/>`;
      body += t(x + 26, 108, 'A', 'class="vz-mb" text-anchor="middle"') + t(x + 144, 108, 'B', 'class="vz-mb" text-anchor="middle"');
      body += ledGrid(f, x + 34, 34, cell);
      if (i < frames.length - 1) body += `<path d="M${x + 163} 85 l8 0" stroke="${MUTED}" stroke-width="2"/>`;
    });
    return svg(W, H, body, v.alt || `micro:bit display showing ${frames.join(', then ')}`);
  }

  // ---------------------------------------------------------------- part
  const BAND = ['#111', '#7b4a12', '#d32f2f', '#f57c00', '#fbc02d', '#2e7d32', '#1565c0', '#7b1fa2', '#9e9e9e', '#fafafa'];
  function bands(ohms) {
    const s = String(Math.round(ohms || 220));
    return [BAND[+s[0]], BAND[+(s[1] || 0)], BAND[Math.max(0, s.length - 2)]];
  }
  function callout(x1, y1, x2, y2, label, anchor) {
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${MUTED}" stroke-width="1.2" stroke-dasharray="3 3"/>` +
      t(x2 + (anchor === 'end' ? -4 : 4), y2 + 4, label, `class="vz-label" text-anchor="${anchor || 'start'}"`);
  }
  function part(v) {
    const L = v.labels || {};
    let b = '', W = 320, H = 190;
    switch (v.part) {

  // ---------------------------------------------------------------- circuit (mini breadboard)
  function circuit(v, el) {

  // ---------------------------------------------------------------- flow

    steps.forEach((s, i) => {
      const x = 10 + i * (bw + gap);
      b += `<rect x="${x}" y="14" width="${bw}" height="86" rx="14" fill="#fff" stroke="${s.color || TEAL}" stroke-width="2.5"/>`;
      b += t(x + bw / 2, 52, s.icon || '', 'class="vz-icon" text-anchor="middle"');

  function wrap(s, n) {

  // ---------------------------------------------------------------- wave (PWM)

      b += `<path d="${p}" fill="none" stroke="${TEAL}" stroke-width="3"/>`;
      b += t(256, y + 22, `${d}%`, 'class="vz-big"');

  // ---------------------------------------------------------------- scale (number line, zones, mapping)

    const X = (n) => x0 + (x1 - x0) * (n - min) / (max - min);

      b += `<line x1="${X(m.at)}" y1="44" x2="${X(m.at)}" y2="54" stroke="${INK}" stroke-width="2"/>` + t(X(m.at) + (anchor === 'start' ? -4 : anchor === 'end' ? 4 : 0), 68, m.label ?? m.at, `class="vz-label" text-anchor="${anchor}"`);

  // ---------------------------------------------------------------- bits
  function bits(v) {

  // ---------------------------------------------------------------- board (Keyestudio KS0360 shield / KS4033 motor board)

    };
    rows.V1.forEach((pin, i) => { b += header(pin, X0 + 30 + i * 30, Y0 + 40, 'V1'); });
    rows.V2.forEach((pin, i) => { b += header(pin, X0 + 30 + i * 30, Y0 + 120, 'V2'); });
    b += t(X0 + 14, Y0 + 104, 'G V S', 'class="vz-tiny" fill="#aaa"');
    // jumpers
    const J = v.jumpers || {};
    [['V1', X0 + BW - 150], ['V2', X0 + BW - 92]].forEach(([n, x]) => {
      if (!J[n]) return;
      const five = /5/.test(J[n]);
      b += `<rect x="${x}" y="${Y0 + 93}" width="52" height="20" rx="4" fill="${five ? '#e53935' : '#1e88e5'}"/>` + t(x + 26, Y0 + 107, `${n}: ${J[n]}`, 'class="vz-tiny" fill="#fff" text-anchor="middle"');
    });
    // power
    if (v.power) {
      b += `<rect x="${X0 - 30}" y="${Y0 + BH - 50}" width="34" height="26" rx="4" fill="#111" stroke="#666"/>` + t(X0 - 13, Y0 + BH - 32, 'DC', 'class="vz-tiny" fill="#ccc" text-anchor="middle"');
      b += t(X0 - 30, Y0 + BH + 22, '🔋 ' + v.power, 'class="vz-label"');
    }
    // devices plugged in
    plugs.forEach((p, i) => {
      const row = rows.V1.includes(p.pin) ? 'V1' : 'V2';
      const idx = rows[row].indexOf(p.pin);
      const hx = X0 + 30 + idx * 30, hy = row === 'V1' ? Y0 + 40 : Y0 + 166;
      const dx = 20 + i * (W - 40) / Math.max(plugs.length, 1) + ((W - 40) / Math.max(plugs.length, 1)) / 2;
      const dy = row === 'V1' ? 20 : H - 26;
      const [c1, c2, c3, icon] = KIND[p.kind] || KIND.sensor;
      [c1, c2, c3].forEach((c, k) => {
        b += `<path d="M${hx - 4 + k * 4} ${hy + (row === 'V1' ? 0 : 0)} C${hx - 4 + k * 4} ${(hy + dy) / 2} ${dx - 4 + k * 4} ${(hy + dy) / 2} ${dx - 4 + k * 4} ${dy + (row === 'V1' ? 12 : -12)}" fill="none" stroke="${c}" stroke-width="2.5"/>`;
      });
      b += `<rect x="${dx - 58}" y="${dy - 12}" width="116" height="24" rx="12" fill="#fff" stroke="${TEAL}" stroke-width="2"/>`;
      const label = `${icon} ${p.device} · P${p.pin}`;
      b += t(dx, dy + 5, label, `class="vz-label" text-anchor="middle"${label.length > 17 ? ' textLength="106" lengthAdjust="spacingAndGlyphs"' : ''}`);
    });
    return svg(W, H, b, v.alt || `sensor shield with ${plugs.map((p) => `${p.device} on pin ${p.pin}`).join(', ')}`);
  }
  function motorBoard(v) {
    const W = 520, H = 300, X0 = 150, Y0 = 56, BW = 230, BH = 170;
    let b = `<rect x="${X0}" y="${Y0}" width="${BW}" height="${BH}" rx="10" fill="#1b1b1b"/>`;
    b += `<rect x="${X0 - 16}" y="${Y0 + 20}" width="34" height="${BH - 40}" rx="4" fill="#3b4366"/>` + t(X0 - 26, Y0 + BH / 2, 'micro:bit', `class="vz-label" transform="rotate(-90 ${X0 - 26} ${Y0 + BH / 2})" text-anchor="middle"`);
    b += t(X0 + 30, Y0 + 24, 'Keyestudio motor board', 'class="vz-chip"');
    const terms = ['G', 'VM', 'A1', 'A2', 'B1', 'B2'];
    const tx = X0 + BW, ty = (i) => Y0 + 40 + i * 22;
    b += `<rect x="${tx - 6}" y="${Y0 + 30}" width="30" height="${terms.length * 22 + 4}" rx="3" fill="#1e88e5"/>`;
    terms.forEach((n, i) => { b += `<circle cx="${tx + 9}" cy="${ty(i) + 2}" r="5" fill="#cfd8dc"/>` + t(tx - 12, ty(i) + 6, n, 'class="vz-tiny" fill="#fff" text-anchor="end"'); });
    const motors = v.motors || [];
    motors.forEach((m) => {
      const a = m.port === 'B' ? 4 : 2, my = m.port === 'B' ? 190 : 40;
      b += `<rect x="440" y="${my}" width="70" height="46" rx="18" fill="#ffd54f" stroke="#c99a00"/>` + t(475, my + 28, m.device || ('motor ' + m.port), `class="vz-label" text-anchor="middle"${(m.device || '').length > 9 ? ' textLength="62" lengthAdjust="spacingAndGlyphs"' : ''}`);
      b += `<path d="M${tx + 9} ${ty(a) + 2} C420 ${ty(a)} 420 ${my + 14} 440 ${my + 14}" stroke="#e53935" stroke-width="3" fill="none"/>`;
      b += `<path d="M${tx + 9} ${ty(a + 1) + 2} C425 ${ty(a + 1)} 425 ${my + 32} 440 ${my + 32}" stroke="#263238" stroke-width="3" fill="none"/>`;
    });
    if (v.power) {
      const bx = X0 + 40, by = H - 40;
      b += `<rect x="${bx}" y="${by}" width="120" height="30" rx="5" fill="#424242"/>` + t(bx + 60, by + 20, '🔋 ' + v.power, 'class="vz-label" fill="#fff" text-anchor="middle"');
      b += `<path d="M${tx + 9} ${ty(1) + 2} C${tx + 60} ${ty(1)} ${tx + 40} ${by + 8} ${bx + 120} ${by + 8}" stroke="#e53935" stroke-width="3" fill="none"/>`;
      b += `<path d="M${tx + 9} ${ty(0) + 2} C${tx + 50} ${ty(0)} ${tx + 30} ${by + 22} ${bx + 120} ${by + 22}" stroke="#263238" stroke-width="3" fill="none"/>`;
    }
    b += t(10, 26, 'Motor A = P12 + P13', 'class="vz-label"') + t(10, 44, 'Motor B = P15 + P16', 'class="vz-label"');
    return svg(W, H, b, v.alt || 'motor driver board with motors and battery');
  }

  const R = { leds, part, circuit, flow, wave, scale, compare, bits, dial, graph, board };

  function render(el, v) {
    const fn = R[v.type];
    if (!fn) return;
    const box = document.createElement('div');
    box.className = 'vz-art vz-' + v.type;
    el.appendChild(box);
    const html = fn(v, box);
    if (html !== null && html !== undefined) box.innerHTML = html;
    if (v.caption) {
      const c = document.createElement('div');
      c.className = 'vz-caption';
      c.textContent = v.caption;
      el.appendChild(c);
    }
  }

  function renderAll(root) {
    (root || document).querySelectorAll('[data-visual]').forEach((el) => {
      if (el.dataset.rendered) return;
      el.dataset.rendered = '1';
      try { render(el, JSON.parse(el.dataset.visual)); } catch (e) { console.warn('visual failed', e); }
    });
  }

  window.Visuals = { render, renderAll, IMAGES };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => renderAll());
  else renderAll();
})();

window.__runMap = function () {
/* Skill-tree lesson map. Data comes from gamify.map_data(). */
(function () {
  'use strict';
  const M = window.MAP;
  const map = document.getElementById('map');
  const detail = document.getElementById('map-detail');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const COL = 150, ROW = 146, PADX = 90, PADY = 96;
  const byId = {};
  M.nodes.forEach((n) => { byId[n.id] = n; });
  const W = PADX * 2 + Math.max(4.2, ...M.nodes.map((n) => n.x)) * COL;
  const H = PADY * 2 + Math.max(...M.nodes.map((n) => n.y)) * ROW + 40;
  const px = (n) => [PADX + n.x * COL, PADY + n.y * ROW];
  map.style.aspectRatio = `${W} / ${H}`;

  // copper traces: straight runs with 45-degree corners, like a real circuit board
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.classList.add('map-trails');
  const LANE = 14, BEND = 10;
  const spread = (i, count) => (i - (count - 1) / 2) * LANE;   // fan traces out so they don't overlap
  const childrenOf = (n) => M.nodes.filter((c) => c.requires.includes(n.id)).sort((a, b) => a.x - b.x);

  function addPath(d, classes) {
    classes.forEach((cls) => {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', cls);
      svg.appendChild(path);
    });
  }
  function addVia(x, y) {
    const via = document.createElementNS(NS, 'circle');
    via.setAttribute('cx', x);
    via.setAttribute('cy', y);
    via.setAttribute('r', 5);
    via.setAttribute('class', 'trace-via');
    svg.appendChild(via);
  }
  function traceClasses(powered, target) {
    if (!powered) return ['trace-mask', 'trace-off'];
    return ['trace-mask', 'trace-glow', 'trace-on'].concat(target.state === 'complete' ? [] : ['trace-live']);
  }
  function route(x1, y1, x2, y2, jog) {
    const dx = x2 - x1, dir = Math.sign(dx), c = Math.min(BEND, Math.abs(dx) / 2);
    if (Math.abs(dx) < 2) return `M${x1},${y1} L${x2},${y2}`;
    return `M${x1},${y1} L${x1},${jog - c} L${x1 + dir * c},${jog} L${x2 - dir * c},${jog} L${x2},${jog + c} L${x2},${y2}`;
  }

  M.nodes.forEach((n) => {
    const [x2, y2] = px(n);
    if (!n.requires.length) {   // first lessons are fed straight from the power rail
      addPath(`M${x2},0 L${x2},${y2}`, traceClasses(true, n));
      return;
    }
    const parents = n.requires.map((id) => byId[id]).filter(Boolean).sort((a, b) => a.x - b.x);
    parents.forEach((p, entry) => {
      const [x1, y1] = px(p);
      const siblings = childrenOf(p);
      const lane = spread(siblings.indexOf(n), siblings.length);
      const startX = x1 + lane, endX = x2 + spread(entry, parents.length);
      const far = y2 - y1 > ROW * 1.7;      // long runs turn just above the lesson they feed
      const jog = far ? y2 - 54 + spread(entry, parents.length) : Math.min(y1 + 78 + lane / 2, y2 - 42);
      addPath(route(startX, y1, endX, y2, jog), traceClasses(p.state === 'complete', n));
      if (far) { addVia(startX, jog); addVia(endX, jog); }
    });
  });
  map.appendChild(svg);

  const STAR = (k) => '★★★'.slice(0, k) + '☆☆☆'.slice(0, 3 - k);
  const STAR_LIGHTS = (k) => [0, 1, 2].map((i) => `<i class="${i < k ? 'lit' : ''}"></i>`).join('');
  function nodeLabel(n) {
    if (n.state === 'complete') return '✓';
    if (n.state === 'locked') return '🔒';
    return n.number;
  }

  M.nodes.forEach((n) => {
    const [x, y] = px(n);
    const a = document.createElement('button');
    a.type = 'button';
    a.className = `map-node ${n.state} unit-${n.unit}` + (n.id === M.current ? ' current' : '');
    a.style.left = (100 * x / W) + '%';
    a.style.top = (100 * y / H) + '%';
    a.style.setProperty('--pct', n.pct);
    a.innerHTML = `<span class="chip"><span class="chip-led"></span><span class="chip-num">${nodeLabel(n)}</span>` +
      `<span class="chip-bar"><i></i></span><span class="chip-stars">${STAR_LIGHTS(n.state === 'locked' ? 0 : n.stars)}</span></span>` +
      `<span class="node-title">${n.assigned ? '📌 ' : ''}${esc(n.title)}</span>`;
    a.setAttribute('aria-label', `Lesson ${n.number}: ${n.title}, ${n.state === 'open' ? 'unlocked' : n.state}` +
      (n.state === 'locked' ? '' : `, ${n.stars} of 3 stars`));
    a.addEventListener('click', () => select(n));
    map.appendChild(a);
  });

  // silkscreen labels: the Sprint trunk, then its three branches
  [['sprint-servo-skills', 'ROBOT SPRINT · START ANY TIME', 60, 'right'], ['sprint-build-the-bot', 'ROBOTS', 0, 'center'],
    ['ai-rules-or-learning', 'AI', 0, 'center'], ['embedded-field-station', 'EMBEDDED', 0, 'center']].forEach(([id, text, shift, align]) => {
    const node = byId[id];
    if (!node) return;
    const [x, y] = px(node);
    const lab = document.createElement('div');
    lab.className = `map-unit-label ${align}`;
    lab.style.left = (100 * (x + shift) / W) + '%';
    lab.style.top = (100 * (y - 44) / H) + '%';
    lab.textContent = text;
    map.appendChild(lab);
  });

  // the student's robot stands on the current lesson
  if (window.ME && M.current && byId[M.current]) {
    const [x, y] = px(byId[M.current]);
    const me = document.createElement('div');
    me.className = 'map-me';
    me.style.left = (100 * x / W) + '%';
    me.style.top = (100 * y / H) + '%';
    me.innerHTML = window.RobotAvatar.svg(window.ME, 56) + '<span>You</span>';
    map.appendChild(me);
  }

  const stamp = document.createElement('div');
  stamp.className = 'map-stamp';
  stamp.textContent = 'MAKER LAB · REV 1.0';
  map.appendChild(stamp);

  function select(n) {
    map.querySelectorAll('.map-node.selected').forEach((e) => e.classList.remove('selected'));
    const idx = M.nodes.indexOf(n);
    map.querySelectorAll('.map-node')[idx].classList.add('selected');
    const url = window.LESSON_URL.replace('__ID__', encodeURIComponent(n.id));
    const unit = M.units[n.unit] || {};
    const action = { complete: 'Review lesson', progress: `Continue (${n.pct}%)`, open: 'Start lesson', locked: 'Peek anyway' }[n.state];
    let body = `<div class="eyebrow">Lesson ${n.number} · Unit ${n.unit}: ${esc(unit.title || '')}</div><h2>${esc(n.title)}</h2>`;
    if (n.state === 'locked') {
      body += `<p class="lock-note">🔒 Finish <b>${n.requires_titles.map(esc).join('</b> and <b>')}</b> to unlock this path.${n.or_titles.length ? ` Or finish <b>${n.or_titles.map(esc).join('</b> or <b>')}</b>.` : ''}</p>`;
    } else {
      body += `<p class="stars-big">${STAR(n.stars)}</p><div class="meter wide"><i style="width:${n.pct}%"></i></div><p class="muted small">${n.pct}% complete · up to ${n.xp_possible} XP</p>`;
    }
    if (n.assigned) body += '<p>📌 Your teacher assigned this lesson.</p>';
    body += `<a class="btn ${n.state === 'locked' ? 'ghost' : ''} wide" href="${url}">${action}</a>`;
    detail.innerHTML = body;
  }
  select(byId[M.current] || M.nodes[0]);
  const cur = map.querySelector('.map-node.current');
  if (cur) {
    const box = map.parentElement;  // horizontal scroller on small screens
    box.scrollLeft = cur.offsetLeft - box.clientWidth / 2;
    if (cur.getBoundingClientRect().top > window.innerHeight) cur.scrollIntoView({ block: 'center', inline: 'nearest' });
  }
})();

};
window.__runProfile = function () {
/* Avatar builder. */
(function () {
  'use strict';
  const C = window.CATALOG;
  const state = Object.assign({}, window.AVATAR);
  const $ = (id) => document.getElementById(id);
  const csrf = document.querySelector('meta[name=csrf-token]').content;
  let part = document.querySelector('.part-tab').dataset.part;

  function preview() {
    state.name = $('avatar-name').value;
    $('avatar-preview').innerHTML = RobotAvatar.svg(state, 220);
  }

  function options() {
    const box = $('part-options');
    box.innerHTML = '';
    C[part].forEach((opt) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'part-opt' + (state[part] === opt.id ? ' chosen' : '') + (opt.unlocked ? '' : ' locked');
      const look = Object.assign({}, state, { [part]: opt.id });
      b.innerHTML = RobotAvatar.svg(look, 64) + `<span>${opt.unlocked ? '' : '🔒 '}${opt.label}</span>` +
        (opt.unlocked ? '' : `<small>${opt.how}</small>`);
      b.title = opt.unlocked ? opt.label : `${opt.label} — ${opt.how}`;
      b.setAttribute('aria-pressed', state[part] === opt.id);
      b.disabled = !opt.unlocked;
      b.addEventListener('click', () => { state[part] = opt.id; preview(); options(); dirty(); });
      box.appendChild(b);
    });
  }

  function dirty() { $('avatar-status').textContent = 'Not saved yet'; $('avatar-status').className = 'save-status small'; }

  document.querySelectorAll('.part-tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.part-tab').forEach((x) => x.classList.toggle('active', x === t));
    part = t.dataset.part;
    options();
  }));
  $('avatar-name').addEventListener('input', () => { preview(); dirty(); });
  $('avatar-random').addEventListener('click', () => {
    Object.keys(C).forEach((k) => {
      const open = C[k].filter((o) => o.unlocked);
      state[k] = open[Math.floor(Math.random() * open.length)].id;
    });
    preview(); options(); dirty();
  });
  $('avatar-save').addEventListener('click', async () => {
    preview();
    const r = await fetch('/api/avatar', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify(state),
    });
    const d = await r.json().catch(() => ({}));
    $('avatar-status').textContent = d.ok ? 'Saved ✓' : (d.error || 'Could not save.');
    $('avatar-status').className = 'save-status small ' + (d.ok ? 'ok' : 'bad');
    if (d.ok) {
      document.querySelectorAll('.nav-avatar').forEach((el) => { el.dataset.avatar = JSON.stringify(d.avatar); });
      RobotAvatar.renderAll();
      if (window.showRewards) showRewards(d.rewards);
    }
  });
  preview();
  options();
})();

  pages.google = function () {
    var c = d.cls, h = ['<a class="muted small" href="/teacher/classes/' + E(c.id) + '">← ' + E(c.name) + '</a><h1>Send grades to Google Classroom</h1>' +
      '<div class="card"><p>This copies grades for the <b>Maker Lab to Google Classroom</b> sender (<code>maker-lab-classroom.gs</code>, see docs/GOOGLE_CLASSROOM.md). ' +
      'Paste them there to save draft grades.</p><h3>1. Pick lessons</h3>'];
    if (!d.cols.length) h.push('<p class="muted">Assign some lessons first.</p>');
    d.cols.forEach(function (a) { h.push('<label class="check"><input type="checkbox" class="gc-l" value="' + E(a.lesson_id) + '" checked> ' + E(a.number) + '. ' + E(a.title) + '</label>'); });
    h.push('<h3>2. How to score</h3><select id="gc-how"><option value="both">Average of % complete and quiz</option><option value="complete">% complete</option><option value="quiz">Best quiz score</option></select>' +
      '<div class="row"><button class="btn" id="gc-go" type="button">Copy grades</button><span class="save-status small" id="gc-msg"></span></div>' +
      '<textarea id="gc-out" rows="4" readonly hidden aria-label="Grades package"></textarea><p class="muted small">The copied grades include student names. Paste them only into the sender.</p></div>');
    main.innerHTML = h.join('');
    document.getElementById('gc-go').addEventListener('click', function () {
      var ids = Array.prototype.map.call(document.querySelectorAll('.gc-l:checked'), function (x) { return x.value; });
      act(this, 'classroomPackage', [c.id, document.getElementById('gc-how').value, ids], function (pkg) {
        var out = document.getElementById('gc-out'), text = JSON.stringify(pkg);
        out.value = text; out.hidden = false; out.select();
        document.getElementById('gc-go').disabled = false;
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
          function () { document.getElementById('gc-msg').textContent = 'Copied ✓ Paste it into the sender.'; },
          function () { document.getElementById('gc-msg').textContent = 'Select the text below and copy it.'; });
      });
    });
  };

  window.MLStart = function () {
    if (pages[ML.page]) pages[ML.page]();
    if (window.RobotAvatar) window.RobotAvatar.renderAll();
    if (window.Visuals) window.Visuals.renderAll();
    ML.fixLinks(document);
  };
})();

</script>
