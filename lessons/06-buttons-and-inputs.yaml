id: buttons-and-inputs
unit: 2
order: 6
title: Buttons and Inputs
subtitle: Read a pushbutton on pin 1 and make decisions with if/else
duration_minutes: 35
level: Beginner
big_idea: >-
  A pin can listen as well as talk: your code reads a button as 1 or 0 and
  uses if/else to decide what to do.
essential_question: "How does a computer notice what a person does, and decide what to do about it?"
objectives:
  - Read button A with is_pressed and was_pressed
  - Wire a pushbutton from pin 1 to GND
  - Explain why a pressed button reads 0
  - Use if/else to light an LED while pressed
vocabulary:
  - term: Digital input
    definition: A pin your code reads. It is either HIGH (1, about 3 volts) or LOW (0, 0 volts).
  - term: if / else
    definition: Python's way to make a choice. If something is True, do one thing; else, do another.
  - term: Pull-up resistor
    definition: A resistor (built into the micro:bit) that gently pulls a pin up to 1 when nothing else is connected.
  - term: "=="
    definition: Python's "is equal to?" question. One = stores a value; two == compares.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 1 pushbutton (4-leg tactile switch)
  - 5 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 4}
  - {key: circuit, name: Build the circuit, minutes: 9}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 4}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Reading a pushbutton
  note: Watch how the button straddles the gap in the middle of the breadboard.
warmup:
  prompt: >-
    Think of three things at home that do something only when you press a
    button. What does each one "decide" to do when you press it - and when you
    let go?
learn:
  - text: |
      ### Inputs vs. outputs
      * An **output** pin *tells*: the code turns it on or off.
      * An **input** pin *listens*: the code asks what is happening.

      Today pin 1 is an input. `pin1.read_digital()` answers **1** (about 3 volts) or **0** (0 volts).
    visual:
      type: flow
      loop: true
      loop_label: again and again
      steps:
        - {icon: "🔘", label: "Sense: read pin 1"}
        - {icon: "🤔", label: "Decide: if / else"}
        - {icon: "💡", label: "Act: LED on pin 0"}
    check:
      question: Pin 0 lights the LED when your code says so. Is pin 0 an input or an output?
      choices: ["An input", "An output"]
      answer: 1
      why: Pin 0 tells the LED what to do, and a pin that tells is an output.
      hint: Does pin 0 tell something, or listen for something?
  - text: |
      ### Making choices with if / else
      ```python
      if button_a.is_pressed():
          display.show(Image.HAPPY)
      else:
          display.clear()
      ```
      * The `if` line ends with a **colon** `:`.
      * The lines inside are **indented**.
      * `else` runs when the `if` is not true. Hold the button to try it.
    visual:
      type: try
      kind: button
      button: "A"
      pressed: "HAPPY"
      released: "OFF"
      then: "True: the if part runs and shows HAPPY."
      else: "False: the else part runs and clears the screen."
    check:
      question: You let go of button A. Which part of the code runs?
      choices: ["The else part", "The if part", "Both parts"]
      answer: 0
      why: Letting go makes is_pressed() False, so Python skips the if part and runs else.
      hint: Is the button pressed now? What does is_pressed() answer?
  - text: |
      ### is_pressed vs. was_pressed
      * `button_a.is_pressed()` is **True the whole time** you hold it. Good for "hold to light".
      * `button_a.was_pressed()` is **True once** for each press. Good for counting presses.
    visual:
      type: compare
      items:
        - {icon: "✋", title: "is_pressed()", text: "True while you hold it down"}
        - {icon: "👆", title: "was_pressed()", text: "True once for each press"}
    check:
      question: You want to **count** how many times someone clicks A. Which one do you use?
      choices: ["is_pressed()", "Either one, they're the same", "was_pressed()"]
      answer: 2
      why: was_pressed() is True once per press, so each click adds exactly 1.
      hint: If someone holds the button for a while, should that count as one click or many?
  - text: |
      ### The button and the pull-up
      The button joins **pin 1** to **GND**. A pin touching nothing reads **random junk**!

      So turn on the micro:bit's built-in **pull-up resistor**: `pin1.set_pull(pin1.PULL_UP)`.

      * **Not pressed:** the pull-up holds pin 1 at **1**.
      * **Pressed:** pin 1 touches GND, so it reads **0**.

      It feels backwards, but most buttons work this way!
    more: |
      **Tug-of-war:** the pull-up resistor only *gently* pulls pin 1 up to 1 (3 volts). Pressing the button
      connects pin 1 straight to GND, which is stronger, so it pulls pin 1 **down to 0**.
    visual:
      type: compare
      items:
        - {icon: "⬆️", title: "Not pressed: 1", text: "The pull-up holds pin 1 at 3 volts"}
        - {icon: "⬇️", title: "Pressed: 0", text: "The button connects pin 1 to GND"}
    check:
      question: The pull-up is on. What does pin 1 read while you **press** the button?
      choices: ["1", "0", "Random junk"]
      answer: 1
      why: Pressing connects pin 1 to GND, which is 0 volts, so it reads 0.
      hint: When you press, what does the button connect pin 1 to?
circuit:
  intro: >-
    You'll rebuild the LED on pin 0 from Lesson 3, then add a pushbutton
    between pin 1 and GND. If your traffic light from Lesson 4 is still on the
    board, take out the LEDs and wires for P1 and P2 first. Unplug the USB
    cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - The button goes between P1 and GND - never between 3V and GND, or pressing it makes a short circuit.
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to the top **blue (–)
        rail** at **T-1**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Resistor and LED
      instruction: >-
        Put the 220 Ω resistor in row **c**, from **c10** to **c14**. Put the
        LED's **long leg (+)** in **e14** and its **short leg (–)** in **e15**.
      check: Is the long leg of the LED in the same column (14) as the resistor's right leg?
      tip: Same layout as Lesson 3 - if you still have it built, just check it matches.
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
        - {type: led, id: led1, anode: e14, cathode: e15, color: red}
    - title: LED wires
      instruction: >-
        Add a **yellow** wire from **P0** to **a10**. Add a **black** wire from
        **a15** to the **blue (–) rail** at **T-15**.
      check: Can you trace P0 → resistor → LED → ground with your finger?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
    - title: Pushbutton
      instruction: >-
        Press the button so it **straddles the center gap**: two legs go in
        **e20** and **e22** (top half), and the other two legs go in **f20**
        and **f22** (bottom half). Push until it clicks flat.
      check: Is the button sitting across the middle gap, with legs in columns 20 and 22?
      tip: If it won't fit, turn it a quarter turn so the wider-apart legs cross the gap.
      add:
        - {type: button, id: btn1, a: e20, b: e22}
    - title: Button wires
      instruction: >-
        Add a **green** wire from **P1** to **a20**. Add a **black** wire from
        **a22** to the **blue (–) rail** at **T-22**.
      check: Does one side of the button go to P1 and the other side go to GND?
      add:
        - {type: wire, from: mb.P1, to: a20, color: green}
        - {type: wire, from: a22, to: T-22, color: black}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
      - [mb.P1, btn1.a]
      - [btn1.b, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
      - [btn1.a, btn1.b]
      - [mb.P1, mb.P0]
code:
  intro: >-
    Hold the breadboard button and the LED lights. Press button A on the
    micro:bit and it counts your presses.
  remember:
    - text: |
        **One = or two ==?** One `=` **stores** a value: `x = 0`. Two `==` **asks a question**: is x
        equal to 0? Use `==` inside an `if`.
      visual:
        type: compare
        items:
          - {icon: "📦", title: "x = 0", text: "Store 0 in x"}
          - {icon: "❓", title: "x == 0", text: "Ask: is x equal to 0?"}
    - text: |
        **Adding 1:** `presses = presses + 1` isn't math. It means: take the old value, add 1, and store it back.
  starter: |
    from microbit import *

    pin1.set_pull(pin1.PULL_UP)   # not pressed = 1, pressed = 0
    presses = 0

    while True:
        if pin1.read_digital() == 0:    # 0 means pressed
            pin0.write_digital(1)       # LED on
        else:
            pin0.write_digital(0)       # LED off

        if button_a.was_pressed():
            presses = presses + 1
            display.show(presses)

        sleep(20)
  predict: {"question": "You hold button A down for 5 seconds. How much does `presses` go up?", "choices": ["By 1", "By 5", "It keeps climbing"], "answer": 0, "explain": "was_pressed() counts one for each press, however long you hold it."}
  walkthrough:
    - lines: "3"
      explain: Turns on the built-in **pull-up resistor** once. Now pin 1 reads 1 until you press.
    - lines: "7-10"
      explain: "`==` asks: is pin 1 equal to 0? Yes means pressed, so LED on. `else`: LED off."
    - lines: "12-14"
      explain: Adds 1 to `presses` for each click of A. Holding A down still counts only 1.
    - lines: "16"
      explain: A tiny 20 ms pause, so the loop isn't running flat out.
  try_it:
    - Make the LED stay ON normally and turn OFF while you press the button.
    - Add button B with is_pressed() to show Image.HEART while you hold it.
    - Delete the set_pull line and press nothing. Does the LED act strangely? Put it back!
practice:
  level: "write"
  prompt: "Your turn to write the logic. The LED on pin 0 should light only while button B is held. Follow the comments."
  starter: "from microbit import *\n\nwhile True:\n    # if button B is held down, turn pin 0 on\n    # otherwise, turn pin 0 off\n    sleep(20)\n"
  solution: "from microbit import *\n\nwhile True:\n    if button_b.is_pressed():\n        pin0.write_digital(1)\n    else:\n        pin0.write_digital(0)\n    sleep(20)\n"
  hints: ["is_pressed() is true the whole time a button is held.", "Indent the lines inside if and else."]
  checks:
    - {"type": "syntax"}
    - {"type": "contains", "pattern": "if\\s+button_b\\.is_pressed\\(\\)\\s*:", "message": "Start with an if that checks whether button B is held."}
    - {"type": "contains", "pattern": "else\\s*:", "message": "What should happen when it isn't held?"}
    - {"type": "contains", "pattern": "pin0\\.write_digital\\(\\s*1\\s*\\)", "message": "Turn pin 0 on inside the if."}
    - {"type": "contains", "pattern": "pin0\\.write_digital\\(\\s*0\\s*\\)", "message": "Turn pin 0 off in the else."}
debug:
  story: >-
    Sam wired the button perfectly, but the code won't even run. Once it runs,
    the LED will be **stuck on**. There are **two** bugs. Fix them and press
    **Check my fix**.
  buggy_code: |
    from microbit import *

    while True:
        if pin1.read_digital() = 0:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)
        sleep(20)
  hints:
    - Is the if line storing a value, or asking a question? Which needs two equals signs?
    - The button connects pin 1 to GND. When it isn't pressed, what is pulling pin 1 up to 1?
  checks:
    - {type: syntax}
    - {type: contains, pattern: "pin1\\.set_pull\\(\\s*pin1\\.PULL_UP\\s*\\)", message: "Turn on the pull-up resistor with pin1.set_pull(pin1.PULL_UP) - otherwise pin 1 doesn't read 1 when the button is up."}
    - {type: contains, pattern: "pin1\\.read_digital\\(\\s*\\)", message: "Keep reading the button with pin1.read_digital()."}
    - {type: contains, pattern: "pin0\\.write_digital\\(\\s*1\\s*\\)", message: "The LED on pin 0 still needs to turn on."}
  solution: |
    from microbit import *

    pin1.set_pull(pin1.PULL_UP)

    while True:
        if pin1.read_digital() == 0:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)
        sleep(20)
  reflection_prompt: Why would the LED stay on without set_pull, even when nobody touches the button?
quiz:
  - question: With pin1.set_pull(pin1.PULL_UP), what does pin1.read_digital() give while the button is pressed?
    visual:
      type: circuit
      caption: "The breadboard button sits between P1 and GND."
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: button, id: btn1, a: e20, b: e22}
        - {type: wire, from: mb.P1, to: a20, color: green}
        - {type: wire, from: a22, to: T-22, color: black}
    choices:
      - "1"
      - "0"
      - "1023"
      - It changes randomly
    answer: 1
    explain: Pressing connects pin 1 to GND (0 volts), so it reads 0. The pull-up makes it 1 when not pressed.
  - question: Which line correctly checks whether x is equal to 0?
    choices:
      - "if x = 0:"
      - "if x == 0:"
      - "if x == 0"
      - "if (x = 0)"
    answer: 1
    explain: Comparing uses == and the if line must end with a colon.
  - question: You want to count how many times button A is clicked, even if someone holds it down. Which should you use?
    choices:
      - button_a.is_pressed()
      - button_a.was_pressed()
      - pin1.read_digital()
    answer: 1
    explain: was_pressed() is True once per press. is_pressed() stays True the whole time you hold it, so it would count many times.
  - question: What does the pull-up resistor do?
    choices:
      - It makes the LED brighter
      - It holds the pin at 1 when not pressed
      - It protects the button from breaking
      - It makes the button read 1023
    answer: 1
    explain: Without it, a pin connected to nothing "floats" and reads random values.
  - question: Why does the button go between P1 and GND, not between 3V and GND?
    visual:
      type: part
      part: button
      caption: "A pressed button is just a wire between its two sides."
    choices:
      - Between 3V and GND, pressing makes a short circuit
      - GND is faster than 3V
      - It doesn't matter at all
    answer: 0
    explain: A pressed button is just a wire. A wire from 3V to GND is a short circuit - never do that!
  - {"question": "`x = 0`, then `x = x + 1`, then `x = x + 1`. What is `x`?", "choices": ["0", "1", "2"], "answer": 2, "explain": "Each line adds 1 to the old value."}
  - {"question": "From Lesson 5: what does `pin0.write_analog(0)` do?", "choices": ["Full brightness", "Always off", "Half brightness"], "answer": 1, "explain": "0 means the pin is on none of the time."}
challenge:
  title: Reaction Time Game
  prompt: >-
    Turn your button and LED into a game! Use if/else to decide who wins,
    who's out, or what happens next. Test it on a friend.
  levels:
    - "Bronze: The LED stays on. Pressing the breadboard button turns it off and shows a happy face."
    - "Silver: Wait 3 seconds, then light the LED. If the button is already down, show a frown. If not, smile."
    - "Gold: Two-player race! Player 1 uses the breadboard button, player 2 uses button B. First to press wins. Keep score."
  hints:
    Bronze:
      - "Turn the LED on before the loop starts. Then watch for the button inside the loop."
      - "Pressed means `pin1.read_digital() == 0`. Then turn off pin 0 and show `Image.HAPPY`."
    Silver:
      - "Inside `while True`: `sleep(3000)`, LED on, then your `if`."
      - "Down means `pin1.read_digital() == 0`. Use `Image.SAD` for the frown."
    Gold:
      - "Check both players in one loop: `pin1.read_digital() == 0` and `button_b.was_pressed()`."
      - "Use two score variables. After a win, show the score, wait, then start a new round."
  submit_prompt: Explain your game's rules and point to the if/else that decides what happens.
teacher_notes: |
  * **LED always on, even without pressing?** Almost always a missing `pin1.set_pull(pin1.PULL_UP)`.
    In micro:bit MicroPython, `read_digital()` defaults to a *pull-down*, so a button to GND reads 0 all the time.
  * **Nothing happens when pressing?** The button is probably rotated so the always-connected legs
    are in the same column, or it isn't straddling the gap. Rotate it 90° and try again.
    If the LED is on all the time *with* set_pull, the button is rotated so its legs are always connected.
  * **Quick button test with the display:** `display.show(pin1.read_digital())` inside the loop
    shows 1 or 0 live.
  * `SyntaxError` on the if line usually means `=` instead of `==` or a missing colon.
  * Leftover traffic-light LEDs on P1 or P2 will confuse the button reading - make sure only the button is on P1.
  * Early finishers: introduce `and`/`or` (`if button_a.is_pressed() and pin1.read_digital() == 0:`).
  * `import random` is needed for the Medium challenge (`random.randint(1000, 4000)`).

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.a.4
    how: A pushbutton is a sensor input; the program decides whether to turn on the LED output.
  - code: 6-8.CT.b.1
    how: if/else, inside a loop, decides what to do based on whether a button is pressed.
  - code: 6-8.CT.b.2
    how: Predict the output for each input, including why a pressed button with a pull-up reads 0.
  - code: 6-8.CT.d.6
    how: Debug = vs == and a missing set_pull by testing and changing one thing at a time.
