id: radio-remote
unit: 4
order: 16
title: Radio Remote Control
subtitle: Tilt one micro:bit to drive your robot with the other
duration_minutes: 35
level: Intermediate
big_idea: >-
  Two micro:bits can talk by radio: one sends short command messages, the
  other listens and drives - and stops by itself if the messages stop coming.
objectives:
  - Send and receive messages by radio
  - Use a radio group so teams stay apart
  - Turn tilt into the commands F, L, R and S
  - Add a fail-safe stop after 500 ms of silence
vocabulary:
  - term: Radio
    definition: The micro:bit's built-in wireless chip. It sends short messages through the air to other micro:bits nearby.
  - term: Group
    definition: A channel number (0-255). micro:bits only hear messages from others in the same group.
  - term: Controller / receiver
    definition: The controller is the micro:bit in your hand that sends commands. The receiver is the micro:bit on the robot that listens and acts.
  - term: Fail-safe
    definition: A design that makes a machine go to a safe state (like stopping) when something goes wrong, such as losing contact.
  - term: Accelerometer
    definition: The sensor that measures tilt and movement. get_x() is left/right tilt, get_y() is forward/back tilt.
materials:
  - 2 micro:bit V2 boards + USB cable
  - 2 battery holders (2×AAA)
  - Your robot from lesson 14
  - A sticky note for your group number
  - Cups, cones or tape for a course
agenda:
  - {key: warmup, name: Warm-up, minutes: 3}
  - {key: learn, name: Learn, minutes: 6}
  - {key: circuit, name: Check the robot wiring, minutes: 3}
  - {key: code, name: Code it, minutes: 9}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 2}
  - {key: challenge, name: Open-ended challenge, minutes: 7}
video:
  title: micro:bit radio basics
  note: Notice that both micro:bits set the same group number. What happens to a message sent in a different group?
warmup:
  prompt: >-
    Think of a remote-controlled toy, a drone, or a TV remote. What should
    happen if the remote's batteries die while the toy is moving? Why?
learn:
  - text: |
      ### Two micro:bits, two programs
      Today you need **two** programs:

      * The **controller** (in your hand) reads **tilt**. It sends a one-letter command with `radio.send()`.
      * The **robot** listens with `radio.receive()` and calls `drive()`.

      | message | meaning |
      |---|---|
      | `'F'` | forward |
      | `'L'` | spin left |
      | `'R'` | spin right |
      | `'S'` | stop |
    visual:
      type: flow
      steps:
        - {icon: "🎮", label: "controller reads tilt"}
        - {icon: "📡", label: "radio.send('F')"}
        - {icon: "🤖", label: "robot: radio.receive()"}
        - {icon: "🚗", label: "drive(700, 700)"}
  - text: |
      ### Groups keep teams apart
      Every micro:bit in the room can hear every other one!

      * `radio.config(group=12)` puts your pair on **channel 12**.
      * A micro:bit only hears its **own group**.
      * **Both** micro:bits must use the same number.

      Your teacher gives each team a number. Write it on a sticky note on your controller.
    visual:
      type: compare
      items:
        - {icon: "✅", title: "Group 12 → group 12", text: "Same channel. The robot hears you."}
        - {icon: "🔇", title: "Group 12 → group 8", text: "Different channels. The robot hears nothing."}
  - text: |
      ### What if the messages stop?
      The controller's batteries die while the robot drives forward.
      The last command was `'F'`... so it would drive **forever**!

      A **fail-safe** fixes this. It makes a machine go to a **safe** state when something goes wrong.
      Real robots, drones and lawnmowers all have one.
    visual:
      type: compare
      items:
        - {icon: "😱", title: "No fail-safe", text: "Keeps doing the last command. Drives away!"}
        - {icon: "🛑", title: "With a fail-safe", text: "No messages? It stops by itself."}
  - text: |
      ### The 500 ms safety timer
      * The controller sends a command **every 100 ms**.
      * The robot notes **when** it last heard one with `running_time()` (milliseconds since it started).
      * No message for more than **500 ms**? The robot **stops**.
    visual:
      type: scale
      label: ms since the last message
      min: 0
      max: 1000
      zones:
        - {from: 0, to: 500, label: "keep driving", color: "#dff4f4"}
        - {from: 500, to: 1000, label: "STOP", color: "#fde2e2"}
      marks:
        - {at: 0, label: "message heard", pointer: true}
        - {at: 500, label: "500"}
        - {at: 1000, label: "1000"}
  - |
    ### The robot's program
    Flash this onto the **robot's** micro:bit. Change the group to your team's number.

    ```python
    from microbit import *
    import radio

    radio.config(group=12)   # must match the controller!
    radio.on()

    def set_motor(pin_a, pin_b, speed):
        if speed > 0:
            pin_a.write_analog(speed)
            pin_b.write_digital(0)
        elif speed < 0:
            pin_a.write_digital(0)
            pin_b.write_analog(-speed)
        else:
            pin_a.write_digital(0)
            pin_b.write_digital(0)

    def drive(left, right):
        set_motor(pin13, pin14, left)
        set_motor(pin15, pin16, right)

    last_heard = running_time()
    while True:
        msg = radio.receive()          # a string, or None if nothing arrived
        if msg:
            last_heard = running_time()
            if msg == 'F':
                drive(700, 700)
            elif msg == 'L':
                drive(-500, 500)
            elif msg == 'R':
                drive(500, -500)
            else:
                drive(0, 0)
            display.show(msg)
        if running_time() - last_heard > 500:
            drive(0, 0)                # fail-safe: lost contact
            display.show(Image.NO)
        sleep(20)
    ```
  - text: |
      ### Wired or wireless?
      A **network** connects devices so they can send each other messages.

      Messages travel through a **cable** or through the **air**.
      Wireless lets you move around.
    visual:
      type: compare
      items:
        - {icon: "🔌", title: "Wired", text: "Through a cable (Ethernet, USB). Fast and reliable, but you're tied down."}
        - {icon: "📡", title: "Wireless", text: "Radio waves (Wi-Fi, Bluetooth, micro:bit radio). Short range, shared airwaves."}
  - text: |
      ### Small and big networks
      Networks also come in different **sizes**.

      Your two micro:bits make a tiny **wireless local network**, with no router.
      Every micro:bit in the same group hears every message. That's a **broadcast**.
      So each team needs its own group number.
    visual:
      type: compare
      items:
        - {icon: "🏫", title: "LAN (local area network)", text: "Devices in one place, like your school's Wi-Fi."}
        - {icon: "🌍", title: "WAN (wide area network)", text: "Networks joined across cities and countries. The internet is the biggest."}
        - {icon: "📱", title: "Mobile", text: "Phones talk to cell towers that hand you on as you move."}
circuit:
  intro: >-
    The robot's wiring is the same as lesson 14. No new parts! Check every
    connection before you drive. The controller needs no wiring, just its
    2×AAA battery holder.
  safety:
    - Check wiring with the micro:bit unplugged and the 4×AA pack switched off.
    - Battery pack red (+) goes ONLY to the driver's VM. Never to the micro:bit's 3V.
    - The first time, test with the wheels in the air.
  steps:
    - title: Shared ground
      instruction: |
        Check these wires:

        * **black**: breakout **GND** → **T-1**
        * **black**: driver **GND** → **T-5**
        * **black**: 4×AA pack **black (–)** → **T-3**
        * **red**: battery **red (+)** → driver **VM**
      check: Do all three grounds meet in the blue rail, and is battery + only on VM?
      add:
        - {type: module, id: drv1, label: "DRV8833 motor driver", terminals: [VM, GND, AIN1, AIN2, BIN1, BIN2, AOUT1, AOUT2, BOUT1, BOUT2]}
        - {type: battery, id: bat1, label: "4×AA 6V"}
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: wire, from: drv1.GND, to: T-5, color: black}
        - {type: wire, from: bat1.minus, to: T-3, color: black}
        - {type: wire, from: bat1.plus, to: drv1.VM, color: red}
    - title: Control wires
      instruction: |
        Check:

        * **P13 → AIN1** and **P14 → AIN2** (left motor)
        * **P15 → BIN1** and **P16 → BIN2** (right motor)
      check: Are all four control wires on the right pins?
      add:
        - {type: wire, from: mb.P13, to: drv1.AIN1, color: yellow}
        - {type: wire, from: mb.P14, to: drv1.AIN2, color: green}
        - {type: wire, from: mb.P15, to: drv1.BIN1, color: blue}
        - {type: wire, from: mb.P16, to: drv1.BIN2, color: purple}
    - title: Motors and micro:bit power
      instruction: |
        * Check: left motor on **AOUT1/AOUT2**, right motor on **BOUT1/BOUT2**.
        * Plug a **2×AAA holder** into the robot micro:bit's battery socket.
        * Plug another into the controller micro:bit.
      check: Did both wheels go forward with the lesson 14 code?
      tip: If one went backward, swap that motor's two wires.
      add:
        - {type: dcmotor, id: motor_l}
        - {type: dcmotor, id: motor_r}
        - {type: wire, from: drv1.AOUT1, to: motor_l.a, color: orange}
        - {type: wire, from: drv1.AOUT2, to: motor_l.b, color: white}
        - {type: wire, from: drv1.BOUT1, to: motor_r.a, color: orange}
        - {type: wire, from: drv1.BOUT2, to: motor_r.b, color: white}
  verify:
    connected:
      - [mb.GND, drv1.GND, bat1.minus]
      - [bat1.plus, drv1.VM]
      - [mb.P13, drv1.AIN1]
      - [mb.P14, drv1.AIN2]
      - [mb.P15, drv1.BIN1]
      - [mb.P16, drv1.BIN2]
      - [drv1.AOUT1, motor_l.a]
      - [drv1.AOUT2, motor_l.b]
      - [drv1.BOUT1, motor_r.a]
      - [drv1.BOUT2, motor_r.b]
    not_connected:
      - [bat1.plus, mb.3V]
      - [bat1.plus, mb.GND]
      - [motor_l.a, motor_l.b]
      - [motor_r.a, motor_r.b]
code:
  intro: >-
    This is the **controller** program - flash it onto the micro:bit you'll
    hold. Flash the **robot** program from the Learn section onto the robot.
    Change group=12 in BOTH programs to your team's number. Hold the
    controller flat with the logo pointing away from you, then tilt to drive.
  starter: |
    from microbit import *
    import radio

    radio.config(group=12)   # your team's number, 0-255 - same on the robot!
    radio.on()

    TILT = 300   # how far you must tilt before it counts

    while True:
        x = accelerometer.get_x()   # left / right tilt
        y = accelerometer.get_y()   # forward / back tilt

        if x < -TILT:
            command = 'L'
        elif x > TILT:
            command = 'R'
        elif y > TILT:
            command = 'F'
        else:
            command = 'S'

        radio.send(command)
        display.show(command)
        sleep(100)               # send 10 times a second
  walkthrough:
    - lines: "4-5"
      explain: "**config(group=12)** picks your team's channel. **on()** switches the radio on. Without it, nothing is sent."
    - lines: "7"
      explain: A **dead zone**. Small wobbles (under 300) don't count, so holding it flat means stop.
    - lines: "10-20"
      explain: "Tilt right: x is positive. Tip the logo edge down: y is positive. Turns are checked first."
    - lines: "22-24"
      explain: Send the letter 10 times a second. Steady messages keep the fail-safe from stopping the robot.
  try_it:
    - Add a 'B' command to go back (tilt toward you, y < -TILT). Add it to the robot program too.
    - Press button A to send a turbo command 'T'. The robot drives at 1023.
    - Switch off the controller while the robot drives (wheels up!). Does the fail-safe stop it?
debug:
  story: >-
    Ana flashed this onto her robot. At first it ignores the controller. After
    she fixed that, the robot only twitches. And when she turned the controller
    off, it drove across the room! There are **two** bugs. Fix them and press **Check my fix**.
  buggy_code: |
    from microbit import *
    import radio

    radio.config(group=12)
    radio.on

    def set_motor(pin_a, pin_b, speed):
        if speed > 0:
            pin_a.write_analog(speed)
            pin_b.write_digital(0)
        elif speed < 0:
            pin_a.write_digital(0)
            pin_b.write_analog(-speed)
        else:
            pin_a.write_digital(0)
            pin_b.write_digital(0)

    def drive(left, right):
        set_motor(pin13, pin14, left)
        set_motor(pin15, pin16, right)

    last_heard = running_time()
    while True:
        msg = radio.receive()
        if msg:
            last_heard = running_time()
            if msg == 'F':
                drive(700, 700)
            elif msg == 'L':
                drive(-500, 500)
            elif msg == 'R':
                drive(500, -500)
            else:
                drive(0, 0)
        if running_time() - last_heard < 500:
            drive(0, 0)
        sleep(20)
  hints:
    - Functions only run when you call them with (). Is every function call complete?
    - The fail-safe should stop the robot when it has NOT heard anything for a while. Read the if line out loud - when does it stop the robot?
    - running_time() - last_heard is "how long since the last message". Should that be bigger or smaller than 500 to stop?
  checks:
    - {type: syntax}
    - {type: contains, pattern: "radio\\.on\\(\\s*\\)", message: "radio.on needs () or the radio never switches on."}
    - {type: not_contains, pattern: "running_time\\(\\)\\s*-\\s*last_heard\\s*<=?\\s*\\d+\\s*:\\s*\\n\\s*drive\\(\\s*0\\s*,\\s*0\\s*\\)", message: "The fail-safe stops the robot when it HAS heard a message recently. It should stop when it hasn't."}
    - {type: contains, pattern: "running_time\\(\\)\\s*-\\s*last_heard\\s*>=?\\s*\\d+|\\d+\\s*<=?\\s*running_time\\(\\)\\s*-\\s*last_heard|running_time\\(\\)\\s*>=?\\s*last_heard\\s*\\+\\s*\\d+", message: "Add a fail-safe that stops the robot when more than 500 ms have passed since last_heard."}
  solution: |
    from microbit import *
    import radio

    radio.config(group=12)
    radio.on()

    def set_motor(pin_a, pin_b, speed):
        if speed > 0:
            pin_a.write_analog(speed)
            pin_b.write_digital(0)
        elif speed < 0:
            pin_a.write_digital(0)
            pin_b.write_analog(-speed)
        else:
            pin_a.write_digital(0)
            pin_b.write_digital(0)

    def drive(left, right):
        set_motor(pin13, pin14, left)
        set_motor(pin15, pin16, right)

    last_heard = running_time()
    while True:
        msg = radio.receive()
        if msg:
            last_heard = running_time()
            if msg == 'F':
                drive(700, 700)
            elif msg == 'L':
                drive(-500, 500)
            elif msg == 'R':
                drive(500, -500)
            else:
                drive(0, 0)
        if running_time() - last_heard > 500:
            drive(0, 0)
        sleep(20)
  reflection_prompt: Why is a fail-safe that only works "backwards" more dangerous than having no robot code at all?
quiz:
  - question: Your controller uses group 7 and your robot uses group 8. What happens?
    choices:
      - The robot works normally
      - The robot never hears the controller
      - The robot goes twice as fast
      - Both micro:bits switch to group 15
    answer: 1
    explain: micro:bits only hear messages from their own group. Both programs must use the same number.
  - question: What does radio.receive() give you when no message has arrived?
    choices:
      - The last message again
      - The letter 'S'
      - None
      - An error
    answer: 2
    explain: It returns None when the message queue is empty, which is why the robot checks `if msg:` before using it.
  - question: Why does the controller send a command every 100 ms, even when the command hasn't changed?
    choices:
      - The radio switches off if you don't use it
      - So the robot knows the controller is still there
      - To make the batteries last longer
      - Python requires a sleep(100)
    answer: 1
    explain: The robot stops if it hears nothing for 500 ms. Regular messages are like a heartbeat saying "I'm still here".
  - question: "In the robot's code, what does running_time() - last_heard measure?"
    visual:
      type: flow
      steps:
        - {icon: "📩", label: "last message at 2000 ms"}
        - {icon: "⏱️", label: "now: 2300 ms"}
        - {icon: "🧮", label: "2300 - 2000 = ?"}
    choices:
      - How fast the robot is going
      - How many messages arrived
      - How many milliseconds since the last message
      - The radio group number
    answer: 2
    explain: running_time() is "now" in milliseconds. Subtracting the time of the last message gives how long it has been quiet.
  - question: The controller is flat on the table. Which command does it send?
    visual:
      type: scale
      label: x and y tilt
      min: -1000
      max: 1000
      zones:
        - {from: -300, to: 300, label: "dead zone", color: "#dff4f4"}
      marks:
        - {at: -300, label: "-300"}
        - {at: 0, label: "flat", pointer: true}
        - {at: 300, label: "300"}
    choices:
      - "'F'"
      - "'L'"
      - "'R'"
      - "'S'"
    answer: 3
    explain: Flat means x and y are both close to 0 - inside the dead zone - so the else branch sends 'S' for stop.
  - question: Your two micro:bits talk by radio. What kind of network is that?
    choices:
      - A wired network
      - A wireless local network
      - A wide area network, like the internet
      - A mobile phone network
    answer: 1
    explain: The messages travel through the air (wireless) over a short distance in one room (local). There's no cable, router or cell tower.
challenge:
  title: Robot Grand Prix
  prompt: >-
    Set up a course with cups, cones or tape. Race your remote-control robot!
    Improve both programs so you can drive faster and steer better than
    everyone else.
  levels:
    - "Bronze: Add a backward 'B' command. Drive through a slalom of 3 cups without knocking any over."
    - "Silver: Tilt more to go faster. Send a letter and a number, like 'F8'. On the robot, use int() to read the number."
    - "Gold: Robot soccer! Use a ping-pong ball and two goals. Add a button \"kick\" (a quick burst forward) and a horn with `music.pitch()`."
  hints:
    Bronze:
      - "On the remote, add `elif y < -TILT:` and set `command = 'B'`."
      - "On the robot, add a check for 'B' that drives both wheels backward."
    Silver:
      - "Scale the tilt on the remote: `level = min(9, abs(y) // 100)`."
      - "Send `'F' + str(level)`. On the robot, `msg[0]` is the letter and `int(msg[1])` is the number."
    Gold:
      - "A kick is a short burst: full speed for about 200 ms, then back to normal."
      - "Send one new letter for the kick and one for the horn. Use the remote's buttons."
  submit_prompt: What did you add to your controller or robot, and how did it help on the course?
teacher_notes: |
  * **Give every team a different radio group** (for example their table number plus 10) and write it on the board. Most "my robot is possessed" problems are two teams on the same group. Groups go from 0 to 255.
  * **Robot ignores the controller:** check radio.on() is called in both programs, that both use the same group, and that the robot is running the robot program (it's easy to flash the same file twice). The controller's display shows what it's sending.
  * **Forward and back feel swapped:** students may be holding the controller the other way round. Have them scroll accelerometer.get_y() while tilting to see which way is positive, then adjust the comparison.
  * **A wheel spins backward** or the robot turns the wrong way: swap that motor's wires on the driver (same fix as lesson 14).
  * **Robot stutters or stops randomly:** the controller may be too far away or sending too slowly, or the batteries are low (the 4×AA pack, the robot's 2×AAA or the controller's 2×AAA). The fail-safe makes low batteries show up as "stops by itself" - that's the safe way to fail.
  * The robot program lives in the Learn section because the starter box holds one program. Students can copy it into a second editor tab.
  * Radio is not private: any micro:bit in the same group can listen. Good discussion starter about security - a Gold extension is a "secret password" letter at the start of each message.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.c.3
    how: Tilt is turned into one-letter messages (F, L, R, S) and sent by radio between two micro:bits.
  - code: 6-8.CT.b.3
    how: 'The system is split into two programs: the controller (sensing and sending) and the robot (receiving and driving).'
  - code: 6-8.CT.b.5
    how: A safety stop handles the case where messages stop arriving, using a 500 ms time limit.
  - code: 6-8.CS.a.5
    how: Teams show a remote-controlled robot completing a course.
  - code: 6-8.CS.c.1
    how: "Two Learn cards compare wired, wireless, local, wide area and mobile networks, and students classify their own micro:bit radio link."
