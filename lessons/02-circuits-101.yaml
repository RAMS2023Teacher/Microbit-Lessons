id: circuits-101
unit: 1
order: 2
title: Circuits 101
subtitle: Light an LED and use Ohm's law to see why it needs a resistor
duration_minutes: 35
level: Beginner
big_idea: >-
  Electricity only flows around a complete loop, and a resistor controls how
  much current flows so an LED glows safely instead of burning out.
objectives:
  - Explain voltage, current and resistance with water pipes
  - Light an LED from the 3V pin
  - Calculate current with Ohm's law (I = V / R)
  - Do math with numbers stored in Python variables
vocabulary:
  - term: Circuit
    definition: A complete loop that electricity can flow around, from + back to -.
  - term: Voltage (V)
    definition: The push that moves electricity, measured in volts. Like water pressure.
  - term: Current (I)
    definition: How much electricity is flowing, measured in amps (A) or milliamps (mA). Like how much water flows.
  - term: Resistance (R)
    definition: How much something slows the current down, measured in ohms (Ω). Like a narrow pipe.
  - term: Ohm's law
    definition: I = V / R. Current equals voltage divided by resistance.
  - term: Polarity
    definition: Which way round a part goes. An LED only works one way - long leg to +.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 4 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Build the circuit, minutes: 8}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 4}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Voltage, current and resistance
  note: Watch how the water-pipe picture matches each part of a real circuit.
warmup:
  prompt: >-
    When you flip a light switch, the light comes on instantly. What do you
    think is actually happening inside the wires? Draw or describe your guess.
learn:
  - text: |
      ### A circuit is a loop
      Electricity needs a **complete loop**, called a **circuit**.

      It flows out of the **+** side (the 3V pin), through the parts, and back to **GND** (–).

      A gap **anywhere** means nothing flows. Try it: make a gap and watch the LED.
    visual:
      type: try
      kind: loop
      steps: ["3V (+)", "resistor", "LED", "GND (–)"]
    check:
      question: One wire pops out of your loop. What happens to the LED?
      choices: ["It stays on", "It goes out", "It gets brighter"]
      answer: 1
      why: A gap anywhere breaks the loop, so no electricity flows.
      hint: Think about the loop. Can electricity get all the way around with a gap?
  - text: |
      ### Push, flow and squeeze
      Think of water in pipes:

      * **Voltage** is the **push**, like water pressure.
      * **Current** is **how much flows**, measured in **milliamps (mA)**.
      * **Resistance** **slows the flow**, like a skinny pipe, measured in **ohms (Ω)**.
    more: |
      **Every model leaves things out.** Cut a water pipe and water spills, but cut a wire and
      nothing leaks: it just stops. Wires are already full of tiny charges, so a light turns on
      **instantly**. Models help us think, but check them against real life.
    visual:
      type: compare
      items:
        - {icon: "💪", title: "Voltage (V)", text: "The push, like water pressure"}
        - {icon: "🌊", title: "Current (I)", text: "How much flows"}
        - {icon: "🚰", title: "Resistance (R)", text: "Slows the flow, like a skinny pipe"}
    check:
      question: Which one is the **push**?
      choices: ["Voltage", "Current", "Resistance"]
      answer: 0
      why: Voltage is the push. Current is the flow it causes.
      hint: Water pressure pushes water through a pipe. Which word matches pressure?
  - text: |
      ### Ohm's law
      One tiny formula links all three:

      **I = V / R** (current = voltage ÷ resistance)

      * **Bigger** resistor → **less** current.
      * **Smaller** resistor → **more** current.

      Most LEDs are happiest **under 20 mA**.
    more: |
      **The math for your circuit:** the 3V pin gives about **3.3 V** and the LED uses about **2 V**,
      so the resistor gets **1.3 V**. With 220 Ω: 1.3 ÷ 220 ≈ 0.006 A = **6 mA**. Safe and happy.
    visual:
      type: scale
      min: 0
      max: 30
      label: "current (mA) with 1.3 V across the resistor"
      caption: "Smaller resistor, more current. 47 Ω is too much!"
      zones:
        - {from: 0, to: 20, label: "safe for the LED", color: "#dff4e4"}
        - {from: 20, to: 30, label: "too much", color: "#fde0dc"}
      marks:
        - {at: 1.3, label: "1 kΩ"}
        - {at: 6, label: "220 Ω", pointer: true}
        - {at: 13, label: "100 Ω"}
        - {at: 28, label: "47 Ω"}
    check:
      question: You swap the 220 Ω resistor for a 1000 Ω one. The current…
      choices: ["goes up", "goes down", "stays the same"]
      answer: 1
      why: A bigger resistor squeezes the flow more, so less current flows.
      hint: Look at the scale. Is 1 kΩ on the high-current or low-current end?
  - text: |
      ### The resistor is a bodyguard
      Without a **resistor**, nothing slows the current. The LED can pull too much and **burn out**.

      So every LED in this course gets a resistor in its loop.
    visual:
      type: compare
      items:
        - {icon: "😊", title: "With a 220 Ω resistor", text: "About 6 mA: a safe glow"}
        - {icon: "🔥", title: "No resistor", text: "Too much current: the LED can burn out"}
    check:
      question: Why does the LED need a resistor?
      choices: ["To make it brighter", "To limit the current so it doesn't burn out", "To give it a + and – side"]
      answer: 1
      why: The resistor keeps the current low enough for the LED to survive.
      hint: What did the card say happens with no resistor?
circuit:
  intro: >-
    You'll build the loop 3V → resistor → LED → GND. There's no code
    controlling this LED - it's on whenever the micro:bit has power. Build with
    the USB cable unplugged.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect 3V straight to GND with a wire - that's a short circuit and it can damage the micro:bit.
    - Always put a resistor in the loop with an LED.
  remember:
    - text: |
        **Breadboard secret wiring:** holes **a–e** in one column are joined, and so are **f–j**.
        The long **+** and **–** rails run the whole board (**T+1** = top + rail, spot 1).
        Two legs in the **same column** are connected.
    - text: |
        **LED legs:** the **long leg (+)** goes toward the power. The **short leg (–)** goes toward GND;
        its side of the rim is flat. Backwards = no light (but no damage).
      visual: {type: part, part: led, color: red}
  steps:
    - title: Power and ground rails
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **red** wire from the breakout's **3V** pin to the top **red (+) rail**
        at **T+1**. Run a **black** wire from the breakout's **GND** pin to the
        top **blue (–) rail** at **T-1**.
      check: Is the red wire in the + rail and the black wire in the – rail (not both in the same rail)?
      tip: "Mixing up the two separate rails is the #1 way to make a short circuit."
      add:
        - {type: wire, from: mb.3V, to: T+1, color: red}
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Resistor
      instruction: >-
        Put the 220 Ω resistor in row **c**, from column **10** to column **14**
        (holes **c10** and **c14**). Resistors have no direction - either way works.
      tip: "The color bands give the value. Red-red-brown means 2, 2, and one zero: 220 Ω."
      check: Is each resistor leg in a different column?
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
    - title: LED
      instruction: >-
        Put the LED's **long leg (+, anode)** in **e14**, the same column as the
        resistor's right leg. Put the **short leg (–, cathode)** in **e15**.
      check: Is the long leg in column 14 and the short leg in column 15?
      tip: The flat edge on the LED's rim marks the short (–) leg.
      add:
        - {type: led, id: led1, anode: e14, cathode: e15, color: red}
    - title: Close the loop
      instruction: >-
        Add a **red** wire from the **red (+) rail** at **T+10** to **a10**
        (the resistor's column). Add a **black** wire from **a15** (the LED's
        short leg) to the **blue (–) rail** at **T-15**. Plug in the USB cable.
        The LED should light!
      check: "Can you trace a full loop: 3V, resistor, LED, GND?"
      add:
        - {type: wire, from: T+10, to: a10, color: red}
        - {type: wire, from: a15, to: T-15, color: black}
  verify:
    connected:
      - [mb.3V, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
      - [mb.3V, mb.GND]
      - [r1.a, r1.b]
code:
  intro: >-
    Your LED doesn't need code to glow - but Python makes a great calculator!
    This program uses **variables** and Ohm's law to work out how much current
    flows through your LED, then scrolls the answer.
  remember:
    - text: |
        **Ohm's law in Python:** `amps = volts / ohms`. The resistor gets the volts the LED
        doesn't use: 3.3 − 2 = **1.3 V**. Multiply amps by 1000 to get **milliamps**.
  starter: |
    from microbit import *

    supply_volts = 3.3    # the 3V pin gives about 3.3 volts
    led_volts = 2.0       # an LED uses up about 2 volts
    resistor_ohms = 220

    resistor_volts = supply_volts - led_volts
    amps = resistor_volts / resistor_ohms    # Ohm's law: I = V / R
    milliamps = amps * 1000

    while True:
        display.scroll("mA: " + str(round(milliamps, 1)))
        sleep(1000)
  predict: {"question": "You change `resistor_ohms` from 220 to 1000. What happens to the number on the screen?", "choices": ["It goes up", "It goes down", "It stays the same"], "answer": 1, "explain": "More resistance means less current."}
  walkthrough:
    - lines: "3-5"
      explain: Three **variables** store numbers. Their names explain what they mean.
    - lines: "7"
      explain: The resistor gets the voltage the LED doesn't use. Python does the subtraction.
    - lines: "8-9"
      explain: "Ohm's law! `/` divides, giving about 0.0059 A. `*` 1000 turns that into 5.9 mA."
    - lines: "11-13"
      explain: >-
        `round(milliamps, 1)` keeps one decimal. `str()` turns the number into
        text so `+` can join it to "mA: ".
  try_it:
    - Change resistor_ohms to 1000 (brown-black-red). Does the current go up or down?
    - Try 100 Ω, then 47 Ω. LEDs like under 20 mA. Which values are safe?
    - Swap a 1 kΩ resistor into your circuit. Does the LED get dimmer, like your math said?
practice:
  level: "fill"
  prompt: "Fill in the blanks to work out the current through a 1000 Ω resistor."
  starter: "from microbit import *\n\nsupply = 3.3\nled = 2.0\nresistor = 1000\n\nvolts = supply - ___\namps = volts / ___\ndisplay.scroll(str(amps * 1000))\n"
  solution: "from microbit import *\n\nsupply = 3.3\nled = 2.0\nresistor = 1000\n\nvolts = supply - led\namps = volts / resistor\ndisplay.scroll(str(amps * 1000))\n"
  hints: ["What uses up some of the voltage before the resistor?", "Which variable holds the resistance?"]
  checks:
    - {"type": "syntax"}
    - {"type": "not_contains", "pattern": "___", "message": "Fill in every blank first."}
    - {"type": "contains", "pattern": "volts\\s*=\\s*supply\\s*-\\s*led", "message": "The resistor gets what the LED doesn't use."}
    - {"type": "contains", "pattern": "amps\\s*=\\s*volts\\s*/\\s*resistor", "message": "Ohm's law: current = volts ÷ resistance."}
debug:
  story: >-
    Sam's current calculator crashes with a **TypeError**. After that's fixed,
    it says the current is **0.0** mA. That's way too small! Find the **two**
    bugs, then press **Check my fix**.
  buggy_code: |
    from microbit import *

    supply_volts = 3.3
    led_volts = 2.0
    resistor_ohms = 220

    resistor_volts = supply_volts - led_volts
    amps = resistor_volts / resistor_ohms
    milliamps = amps / 1000

    while True:
        display.scroll("mA: " + milliamps)
        sleep(1000)
  hints:
    - Python can't glue text and a number together with +. How do you turn a number into text?
    - To change amps into milliamps, should the number get bigger or smaller? Which math operator does that?
  checks:
    - {type: syntax}
    - {type: not_contains, pattern: "\\+\\s*milliamps\\s*\\)", message: "You can't join a string and a number with +. Wrap the number in str()."}
    - {type: contains, pattern: "str\\(|f[\"']", message: "Use str() to turn the number into text before joining it to \"mA: \"."}
    - {type: not_contains, pattern: "amps\\s*/\\s*1000", message: "Dividing by 1000 makes the number smaller. 1 A = 1000 mA, so multiply."}
    - {type: contains, pattern: "milliamps\\s*=\\s*amps\\s*\\*\\s*1000|milliamps\\s*=\\s*1000\\s*\\*\\s*amps", message: "Turn amps into milliamps by multiplying by 1000."}
  solution: |
    from microbit import *

    supply_volts = 3.3
    led_volts = 2.0
    resistor_ohms = 220

    resistor_volts = supply_volts - led_volts
    amps = resistor_volts / resistor_ohms
    milliamps = amps * 1000

    while True:
        display.scroll("mA: " + str(milliamps))
        sleep(1000)
  reflection_prompt: How did you know the answer 0.0 mA was wrong? Why is it useful to guess the answer before the computer calculates it?
quiz:
  - question: In the water-pipe analogy, what is voltage like?
    choices:
      - The pressure pushing the water
      - How much water flows
      - A skinny section of pipe
      - The color of the pipe
    answer: 0
    explain: Voltage is the push. Current is how much flows. Resistance is the skinny pipe.
  - question: Using I = V / R, what current flows when 2 V is across a 100 Ω resistor?
    choices:
      - 200 A
      - 0.02 A (20 mA)
      - 50 A
      - 0.2 A
    answer: 1
    explain: 2 ÷ 100 = 0.02 amps, which is 20 milliamps.
  - question: If you swap the 220 Ω resistor for a 1000 Ω resistor, what happens to the LED?
    choices:
      - It gets brighter
      - It gets dimmer
      - Nothing changes
      - It changes color
    answer: 1
    explain: More resistance means less current, so the LED glows more dimly.
  - question: Which LED leg should connect toward the + side (3V)?
    visual:
      type: part
      part: led
      color: red
      labels: {anode: "long leg", cathode: "short leg", flat: "flat edge"}
    choices:
      - The short leg (cathode)
      - The long leg (anode)
      - Either one works
    answer: 1
    explain: Long leg = anode = +. Put it in backwards and the LED won't light.
  - question: 'Why does display.scroll("mA: " + 5.9) cause an error?'
    choices:
      - The micro:bit can't show decimals
      - "Text and numbers can't join with +. Use str(5.9)"
      - scroll() only works with pictures
    answer: 1
    explain: Python won't glue a string and a number together. str() turns the number into text first.
  - {"question": "`a = 6` and then `b = a / 2`. What is `b`?", "choices": ["2", "6", "3.0"], "answer": 2, "explain": "One slash divides and gives a decimal: 3.0."}
  - {"question": "From Lesson 1: what does `sleep(1000)` do?", "choices": ["Waits 1 second", "Waits 1000 seconds", "Turns off the screen"], "answer": 0, "explain": "sleep counts in milliseconds, and 1000 ms is 1 second."}
challenge:
  title: Resistor Detective
  prompt: >-
    Engineers use math to guess what a circuit will do *before* they build
    it. Be a resistor detective. Predict, then test, then explain!
  levels:
    - "Bronze: Find the current for 100, 220 and 1000 Ω. Predict each one: brighter or dimmer?"
    - "Silver: Work backwards. Pick a target, like 10 mA. Find the resistor you need with R = V / I."
    - "Gold: Two resistors in a row add up. Use one more variable, add 1000 Ω to your 220 Ω, and scroll the new current."
  hints:
    Bronze:
      - "Use the starter code. Change `resistor_ohms` to one value at a time and run it."
      - "More resistance means less current. Less current means a dimmer LED."
    Silver:
      - "Change 10 mA into amps first: divide by 1000."
      - "The resistor gets 3.3 - 2.0 = 1.3 volts. Divide those volts by your amps."
    Gold:
      - "Make `second_ohms = 1000`. Then use `resistor_ohms + second_ohms` in Ohm's law."
      - "Should the current go up or down? Predict first, then run it."
  submit_prompt: Which resistor values did you test, what did your math predict, and did the real LED agree?
  visual:
    type: part
    part: resistor
    ohms: 1000
    labels: {note: "1 kΩ = 1000 Ω: brown-black-red"}
teacher_notes: |
  * **LED won't light?** In order: (1) is the LED backwards? swap its legs; (2) is the resistor in different columns, not both legs in one column? (3) are both wires in the correct rails? (4) is the USB plugged in?
  * Students often put the red and black wires in the same rail. This is a direct 3V-to-GND short - check every board before they plug in.
  * The 3V pin measures about 3.0-3.3 V depending on USB vs battery. The ~2 V LED drop varies by color (red ~1.8 V, blue/white ~3 V). A **blue or white LED may glow very dimly or not at all** from 3V - red, yellow or green work best today.
  * The `round()` function and `str()` are new - it's fine if students treat them as "magic" for now.
  * Extension: if you have a multimeter, let early finishers measure the real voltage across the resistor and compare with their calculation.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CT.e.1
    how: 'The water-in-pipes model of voltage, current and resistance, plus a card on where the model breaks (cut wires do not leak; the flow starts instantly).'
  - code: 6-8.CT.b.2
    how: Predict how the current changes when the resistor changes, then check the prediction with Ohm's law in code.
  - code: 6-8.CT.c.2
    how: Python stores the current as a decimal number; str() turns it into text before it can be joined to a label.
  - code: 6-8.CS.a.7
    how: 'Diagnose a circuit that won''t light: a broken loop, a backwards LED, a loose connection.'
