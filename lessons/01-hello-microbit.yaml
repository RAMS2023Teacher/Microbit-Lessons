id: hello-microbit
unit: 1
order: 1
title: Hello, micro:bit!
subtitle: Meet your tiny computer and make it say hello
duration_minutes: 35
level: Beginner
big_idea: >-
  A micro:bit is a tiny computer that follows your Python instructions one
  line at a time, from top to bottom.
objectives:
  - Name the main parts of the micro:bit
  - Show words and pictures on the LEDs
  - Repeat an animation forever with a loop
  - Flash a program onto a real micro:bit
vocabulary:
  - term: Program
    definition: A list of instructions a computer follows in order.
  - term: String
    definition: Text inside quote marks, like "Hello". Python needs the quotes to know it's text.
  - term: Image
    definition: A built-in 5×5 picture, like Image.HEART or Image.HAPPY.
  - term: Loop
    definition: Code that repeats. while True repeats the indented lines forever.
  - term: Flashing
    definition: Copying your program from the computer onto the micro:bit so it can run.
materials:
  - micro:bit V2 + USB cable
  - A computer with a web browser
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 7}
  - {key: code, name: Code it, minutes: 6}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 6}
  - {key: quiz, name: Check for understanding, minutes: 4}
  - {key: challenge, name: Open-ended challenge, minutes: 7}
video:
  title: Meet the micro:bit
  note: Look for the 25 red LEDs, buttons A and B, and the gold pins along the bottom edge.
warmup:
  prompt: >-
    Computers hide everywhere, not just in laptops and phones. List as many
    things as you can that have a tiny computer inside. Which one surprised
    you most?
learn:
  - text: |
      ### Meet the micro:bit
      It's a **tiny computer**, about the size of a credit card.

      On the front:
      * **25 red LEDs** in a 5×5 grid: the **display**
      * **Button A** and **Button B**
      * Gold **pins** along the bottom edge

      On the back: a **USB port**, a **speaker**, a **microphone**, and sensors for motion and temperature.
    visual:
      type: leds
      image: HAPPY
      caption: "The 5×5 LED display sits between buttons A and B."
  - text: |
      ### Code is a list of steps
      A **program** is a list of instructions. The micro:bit runs them **in order, top to bottom**.

      The first line is always `from microbit import *`. It loads the micro:bit toolbox, so Python knows `display`, `Image` and `sleep`.
    visual:
      type: flow
      caption: "Python runs one line at a time, top to bottom."
      steps:
        - {icon: "📦", label: "from microbit import *"}
        - {icon: "💬", label: "display.scroll(\"Hi!\")"}
        - {icon: "❤️", label: "display.show(Image.HEART)"}
  - text: |
      ### Words and pictures
      * `display.scroll("Hi!")` slides text across the LEDs. Text is called a **string**. It needs **quote marks**.
      * `display.show(Image.HEART)` shows a picture.
      * Image names are in **CAPITAL LETTERS**.
    visual:
      type: leds
      caption: "scroll shows letters one by one. show draws a picture."
      frames: ["90009:90009:99999:90009:90009", "00900:00000:00900:00900:00900", "HEART"]
  - text: |
      ### Waiting with sleep()
      `sleep()` pauses the program. It counts in **milliseconds** (ms).

      * `sleep(500)` waits half a second.
      * `sleep(1000)` waits **1 second**.
      * `sleep(2000)` waits 2 seconds.
    visual:
      type: scale
      min: 0
      max: 2000
      caption: "1000 milliseconds = 1 second."
      marks:
        - {at: 0, label: "0"}
        - {at: 500, label: "500 = ½ s"}
        - {at: 1000, label: "1000 = 1 s", pointer: true}
        - {at: 2000, label: "2000 = 2 s"}
  - text: |
      ### Forever loops
      `while True:` means **repeat forever**.

      * Lines inside the loop are **indented**. That means pushed in by 4 spaces.
      * Python uses the spaces to know what's inside the loop.
      * End the `while` line with a **colon** `:`.
    visual:
      type: flow
      loop: true
      loop_label: repeat forever
      steps:
        - {icon: "❤️", label: "show big heart"}
        - {icon: "⏱️", label: "sleep(500)"}
        - {icon: "💗", label: "show small heart"}
        - {icon: "⏱️", label: "sleep(500)"}
  - text: |
      ### Flashing your code
      **Flashing** copies your program onto the micro:bit.

      * Click **Send to micro:bit** under the editor.
      * **First time only:** click **Download .hex**. Drag the file onto the **MICROBIT** drive. This puts Python on it.
      * The yellow light on the back blinks while it copies. Then your code runs!
    visual:
      type: flow
      steps:
        - {icon: "⌨️", label: "write your code"}
        - {icon: "📤", label: "Send to micro:bit"}
        - {icon: "🟡", label: "yellow light blinks"}
        - {icon: "▶️", label: "your code runs"}
  - text: |
      ### When Python finds a mistake
      Everyone's code breaks. An **error message** helps you fix it.

      * It names the **line number**. Look there first, then the line above.
      * `SyntaxError`: Python can't read it. Check colons and quotes.
      * `NameError`: Python doesn't know a word. Check spelling and capitals.
      * `TypeError`: the wrong kind of value, like text + a number.
  - text: |
      ### Free code you can look inside
      **MicroPython** is **open source**. Anyone can read, change and share its code. They just follow its **license**. Its MIT License mostly asks you to keep the credit.

      **Proprietary** code is kept secret. You can *use* it, but not change or share it.

      Check the license before you copy code, pictures or music!
    visual:
      type: compare
      items:
        - {icon: "🔓", title: "Open source", text: "MicroPython, Firefox, Linux"}
        - {icon: "🔒", title: "Proprietary", text: "Microsoft Word, most video games"}
code:
  intro: >-
    This program says hello once, then animates a beating heart forever.
    Type it in (or use the starter), flash it, and watch your micro:bit come alive.
  starter: |
    from microbit import *

    display.scroll("Hello!")

    while True:
        display.show(Image.HEART)
        sleep(500)
        display.show(Image.HEART_SMALL)
        sleep(500)
  predict: {"question": "Right after it scrolls Hello!, what will the micro:bit do?", "choices": ["Scroll Hello! again, forever", "Flash a big heart and a small heart, forever", "Show one heart and stop"], "answer": 1, "explain": "The scroll is before the loop, so it runs once. Only the indented lines repeat."}
  walkthrough:
    - lines: "1"
      explain: Loads the micro:bit toolbox so Python knows display, Image and sleep.
    - lines: "3"
      explain: Scrolls the **string** "Hello!" across the display once. The quotes tell Python it's text.
    - lines: "5"
      explain: "`while True:` starts a loop that repeats forever. Don't forget the colon `:` at the end."
    - lines: "6-9"
      explain: >-
        These lines are **indented**, so they're inside the loop. Big heart,
        wait, small heart, wait. That's a heartbeat!
  try_it:
    - Change "Hello!" to your own name.
    - Make the heart beat faster. Change both 500s to 200.
    - Delete one of the sleep() lines. What happens to the animation? Why?
practice:
  level: "fill"
  prompt: "Fill in the blanks. Scroll your name once. Then flash a happy face forever."
  starter: "from microbit import *\n\ndisplay.___(\"Your name\")\n\nwhile ___:\n    display.show(Image.HAPPY)\n    sleep(___)\n    display.show(Image.ASLEEP)\n    sleep(500)\n"
  solution: "from microbit import *\n\ndisplay.scroll(\"Sam\")\n\nwhile True:\n    display.show(Image.HAPPY)\n    sleep(500)\n    display.show(Image.ASLEEP)\n    sleep(500)\n"
  hints: ["The word after display. makes text scroll.", "A forever loop is written while True:"]
  checks:
    - {"type": "syntax"}
    - {"type": "not_contains", "pattern": "___", "message": "Fill in every blank first."}
    - {"type": "contains", "pattern": "display\\.scroll\\(", "message": "Which word makes text slide across the LEDs?"}
    - {"type": "contains", "pattern": "while\\s+True\\s*:", "message": "Which word means repeat forever?"}
    - {"type": "contains", "pattern": "sleep\\(\\s*\\d+\\s*\\)", "message": "Give sleep() a number of milliseconds."}
debug:
  story: >-
    Maya wanted her micro:bit to scroll "Hi" and then flash a heart and a smiley
    forever. Instead, Python won't even run it! There are **three** bugs. Find
    them, fix them, and press **Check my fix**.
  buggy_code: |
    from microbit import *

    display.scroll(Hi)

    while True:
        display.show(Image.heart)
        sleep(500)
      display.show(Image.HAPPY)
        sleep(500)
  hints:
    - Text that should appear on the screen needs something around it. What?
    - Image names are written in a special way. Look at Image.HAPPY - how is it different from the heart?
    - Every line inside the loop must be pushed in by the same amount. Does one line stick out?
  checks:
    - {type: syntax, message: "Python can't read this yet - check that every line in the loop is indented by the same amount (4 spaces)."}
    - {type: contains, pattern: "display\\.scroll\\(\\s*(\"[^\"]*\"|'[^']*')\\s*\\)", message: "Text needs quote marks around it: display.scroll(\"Hi\")."}
    - {type: not_contains, pattern: "Image\\.heart\\b", message: "Image names are in CAPITAL letters: Image.HEART."}
    - {type: contains, pattern: "Image\\.HEART\\b", message: "Keep the heart picture - it should be Image.HEART."}
  solution: |
    from microbit import *

    display.scroll("Hi")

    while True:
        display.show(Image.HEART)
        sleep(500)
        display.show(Image.HAPPY)
        sleep(500)
  reflection_prompt: Which bug was hardest to spot? What clue (an error message, a color, the shape of the code) helped you find it?
quiz:
  - question: What does display.scroll("Go!") do?
    choices:
      - Shows a picture of the word Go
      - Slides the text Go! across the LED display
      - Waits for you to press a button
      - Makes the micro:bit go faster
    answer: 1
    explain: scroll() slides text across the 5×5 LEDs, one letter at a time.
  - question: How long does sleep(2000) wait?
    choices:
      - 2 seconds
      - 2000 seconds
      - 20 seconds
      - 0.2 seconds
    answer: 0
    explain: sleep() counts in milliseconds. 1000 ms = 1 second, so 2000 ms = 2 seconds.
  - question: Which line shows this face?
    visual:
      type: leds
      image: HAPPY
    choices:
      - "`display.show(image.happy)`"
      - "`display.show(Image.happy)`"
      - "`display.show(Image.HAPPY)`"
    answer: 2
    explain: Python is case-sensitive. It's Image with a capital I and the picture name in CAPITALS.
  - question: How does Python know which lines are inside a while True loop?
    choices:
      - They are written in capital letters
      - They are indented (pushed in) under the loop
      - They have a # at the start
      - They are all on one line
    answer: 1
    explain: Indented lines after the colon belong to the loop. Lines that line up with "while" are outside it.
  - question: MicroPython is open source. What does that mean?
    choices:
      - Anyone can read, change and share its code
      - It costs money every time you use it
      - Only the company that made it can see the code
      - It only works on laptops with the lid open
    answer: 0
    explain: Open-source software shares its code with everyone under a license. Proprietary software keeps its code private.
  - {"question": "`display.scroll(\"Go\")` comes **before** `while True:`. How many times does it scroll?", "choices": ["Once", "Twice", "Forever"], "answer": 0, "explain": "Code before the loop runs one time."}
challenge:
  title: Name Badge Animation
  prompt: >-
    Turn your micro:bit into a name badge that shows who you are. Mix
    scrolling words, pictures and timing. There's no single right answer!
  levels:
    - "Bronze: Scroll your name, then show a picture you like, inside a while True loop."
    - "Silver: Make a 3-picture animation that tells a tiny story, like a wink or a beating heart."
    - "Gold: Design your own picture with Image(\"09090:99999:99999:09990:00900\"). Each number 0-9 is one LED's brightness."
  hints:
    Bronze:
      - "Put `display.scroll()` and `display.show()` inside the loop. Indent both lines."
      - "Need a picture name? Look in the Code library."
    Silver:
      - "Pick three pictures and show them in order. Add a `sleep()` after each one."
      - "A wink needs two pictures that differ a little. Try changing the `sleep()` times too."
    Gold:
      - "The five groups of numbers are the five rows, from top to bottom."
      - "Save it in a variable: `boat = Image(\"...\")`. Then use `display.show(boat)`."
  submit_prompt: What does your badge show, and which line of code are you most proud of?
  visual:
    type: leds
    caption: "Gold: this pattern of numbers draws a heart."
    image: "09090:99999:99999:09990:00900"
teacher_notes: |
  * **Flashing problems:** make sure the micro:bit shows up as a **MICROBIT** drive. Some USB cables are charge-only - swap the cable if the drive never appears.
  * If the display shows a **scrolling error message** (like "SyntaxError line 6"), the code reached the micro:bit but has a bug. Read the line number with the class - this is a great teaching moment.
  * The three most common bugs today: missing quotes, lowercase image names, and mixed indentation. Encourage students to use the Tab key or 4 spaces consistently.
  * Point out that `display.scroll("Hello!")` is *outside* the loop, so it runs only once. Ask: "How could you make it scroll every time?"
  * Early finishers: show `button_a.is_pressed()` with an `if` inside the loop as a preview, or let them browse the built-in Image list (Image.GIRAFFE, Image.GHOST, Image.PACMAN...).

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CT.b.1
    how: A while True loop repeats a scroll-and-picture animation forever.
  - code: 6-8.CT.d.3
    how: 'Name Badge Animation challenge: students write a program that meets a goal they choose.'
  - code: 6-8.CT.d.6
    how: Debug challenge with three bugs (missing quotes, Image.heart, bad indentation), fixed by testing and retrying.
  - code: 6-8.CS.a.7
    how: 'Troubleshoot getting code onto the device: the MICROBIT drive, USB cables (some are charge-only) and re-flashing.'
  - code: 6-8.CAS.b.5
    how: "A Learn card contrasts open-source licenses (MicroPython, MIT License) with proprietary software, with examples of each."
