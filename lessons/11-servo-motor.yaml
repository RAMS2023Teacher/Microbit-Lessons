id: servo-motor
unit: 3
order: 11
title: Servo Motor Control
subtitle: Point a micro servo to any angle with PWM pulses and its own battery pack
duration_minutes: 35
level: Intermediate
big_idea: >-
  A servo turns to an exact angle based on how long each electrical pulse is,
  so code can point it anywhere from 0° to 180°.
essential_question: "How can a pulse of electricity tell a motor exactly where to point?"
objectives:
  - Explain how pulse length sets a servo's angle
  - Power a servo from batteries with a shared ground
  - Send servo pulses with write_analog()
  - Write an angle-to-number function
vocabulary:
  - term: Servo motor
    definition: A motor with a built-in controller that turns to a chosen angle and holds it there.
  - term: Pulse width
    definition: How long each ON part of the signal lasts. For a servo, a longer pulse means a bigger angle.
  - term: Period
    definition: The time for one full ON + OFF cycle. Servos expect one pulse every 20 ms.
  - term: Shared ground
    definition: Connecting the GND of two power sources together so they agree on what "0 volts" means. Also called a common ground.
  - term: Function
    definition: A named block of code that takes an input and can return an answer, like angle_to_value(90).
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 SG90 micro servo with its plastic arm
  - "1 battery pack with switch: 4×AA (6 V) or 3×AA"
  - 5 male-to-male jumpers
  - Paper and tape (optional)
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Build the circuit, minutes: 8}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 4}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: How a servo motor works
  note: Watch the servo hold its position even when someone gently pushes the arm.
warmup:
  prompt: >-
    A normal motor just spins and spins. Can you think of a machine that needs
    a motor to turn to an exact spot and stop there? What is it pointing or moving?
learn:
  - text: |
      ### What's inside a servo?
      A **servo** has a motor, gears and a tiny circuit that **knows its own angle**.
      Tell it an angle. It turns there and **holds**.

      The SG90 has three wires:
      * **Orange** (or yellow): **signal**
      * **Red**: **power** (+)
      * **Brown** (or black): **ground** (–)
    visual:
      type: part
      part: servo
      caption: The SG90's three wire colors.
    check:
      question: You tell a servo to go to 45°. What does it do when it gets there?
      choices: ["Holds that angle", "Keeps spinning like a wheel", "Springs back to 0°"]
      answer: 0
      why: A servo knows its own angle, so it turns there and holds.
      hint: The servo has a tiny circuit that knows its angle. Why would it need to know that?
  - text: |
      ### Pulses set the angle
      Every **20 ms** the servo looks for a short ON **pulse**.
      How long the pulse lasts tells it where to point.

      * **0.5 ms** → 0°
      * **1.5 ms** → 90° (the middle)
      * **2.5 ms** → 180°
    visual:
      type: dial
      caption: Longer pulse, bigger angle.
      marks:
        - {angle: 0, label: "0° · 0.5 ms"}
        - {angle: 90, label: "90° · 1.5 ms", pointer: true}
        - {angle: 180, label: "180° · 2.5 ms"}
    check:
      question: Which pulse points the arm to the **middle** (90°)?
      choices: ["0.5 ms", "1.5 ms", "2.5 ms"]
      answer: 1
      why: 1.5 ms is halfway between 0.5 ms (0°) and 2.5 ms (180°).
      hint: The middle angle needs a pulse length in the middle. Which one is halfway?
  - text: |
      ### It's PWM again
      This is **PWM**, just like dimming an LED!

      * `pin0.set_analog_period(20)` makes each cycle **20 ms** long.
      * `write_analog()` sets how much of each cycle is ON, from **0 to 1023**. 1023 means ON the whole 20 ms.

      A servo only needs a **thin** slice: about **26** (0°) to **128** (180°). Drag the slider.
    visual:
      type: try
      kind: servo
      code: "pin0.write_analog({value})"
      map: [26, 128]
      start: 90
    more: |
      **The math:** the pulse is a fraction of the 20 ms cycle, times 1023.

      * 0.5 ÷ 20 × 1023 ≈ **26** (0°)
      * 1.5 ÷ 20 × 1023 ≈ **77** (90°)
      * 2.5 ÷ 20 × 1023 ≈ **128** (180°)
    check:
      question: Why does a servo only use `write_analog()` values from about 26 to 128?
      choices: ["Bigger numbers would break the pin", "The servo can only count to 128", "Its pulse is only a thin slice of each 20 ms cycle"]
      answer: 2
      why: Even a 2.5 ms pulse is a small part of 20 ms, so the numbers stay small.
      hint: What does 1023 mean for the ON time? How much of the cycle does a servo pulse need?
  - text: |
      ### Functions with inputs and answers
      ```python
      def double(n):
          return n * 2
      ```
      * `n` is an **input**. You fill it in when you call it: `double(4)`.
      * `return` sends an **answer** back. `double(4)` gives **8**.

      Our `angle_to_value()` function does the servo math: `angle_to_value(90)` gives **77**.
    check:
      question: "`def triple(n): return n * 3`. What does `triple(5)` give?"
      choices: ["8", "15", "53"]
      answer: 1
      why: n is filled in with 5, and return sends back 5 × 3, which is 15.
      hint: Put the number you passed in where n is. Then do what the return line says.
circuit:
  intro: >-
    The micro:bit uses the **top** rails. The battery uses the **bottom**
    rails. One wire joins the two grounds.
  safety:
    - Build with USB unplugged and the battery pack off until the last step.
    - Battery + goes only on the bottom red (B+) rail. Never to 3V or a pin.
    - Never power the servo from the 3V pin. It can reset or damage the board.
    - Keep fingers clear of the moving arm. Don't force it by hand.
  steps:
    - title: micro:bit ground on the top rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to **T-1** on the top
        **blue (–) rail**. We won't use the micro:bit's 3V pin today.
      check: Is the black wire in the top rail next to the blue line?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Battery pack on the bottom rails
      instruction: >-
        With the battery pack **switched OFF**, connect its **red** wire to
        **B+1** on the bottom **red (+) rail** and its **black** wire to **B-1**
        on the bottom **blue (–) rail**.
      check: Is battery + in the BOTTOM red rail, away from the micro:bit?
      tip: Bare wires? Ask your teacher to twist them onto jumper pins.
      add:
        - {type: battery, id: bat1, label: "4×AA 6V"}
        - {type: wire, from: bat1.plus, to: B+1, color: red}
        - {type: wire, from: bat1.minus, to: B-1, color: black}
    - title: Share the ground
      instruction: >-
        Add a **black** wire from **T-30** (top blue rail) to **B-30** (bottom
        blue rail). Now the micro:bit and the battery share one ground.
      check: Does this wire join the two BLUE rails - never a red one?
      add:
        - {type: wire, from: T-30, to: B-30, color: black}
    - title: Servo power
      instruction: >-
        Plug a **red** jumper into the servo's **red** wire socket and push the
        other end into **B+10**. Plug a **black** jumper into the servo's
        **brown** wire socket and push the other end into **B-10**.
      check: Is the servo's red wire on the bottom red rail and its brown wire on the bottom blue rail?
      add:
        - {type: servo, id: servo1}
        - {type: wire, from: servo1.vcc, to: B+10, color: red}
        - {type: wire, from: servo1.gnd, to: B-10, color: black}
    - title: Signal from pin 0
      instruction: >-
        Plug a **yellow** jumper into the servo's **orange** signal socket and
        connect the other end to **P0** on the breakout. Now plug in USB, then
        switch the battery pack ON.
      check: Is the orange servo wire going to P0, and nothing else touching P0?
      add:
        - {type: wire, from: servo1.sig, to: mb.P0, color: yellow}
  remember:
    - text: |
        **Why a separate battery?** A moving servo can suddenly gulp a lot of **current**, more than the
        micro:bit can give. That can make the micro:bit **reset**. So the servo gets its **own battery
        pack**. Battery **+** must **never** touch the micro:bit's 3V.
      visual:
        type: compare
        items:
          - {icon: "🔌", title: "micro:bit 3V pin", text: "Too little current. A servo can make it reset."}
          - {icon: "🔋", title: "Battery pack", text: "Gives the servo its big bursts of current."}
    - text: |
        **Share the ground:** the signal only makes sense if both sides agree on "0 volts". So battery
        **–** joins micro:bit **GND**. That's a **shared ground**. Battery + stays on its own rail.
  verify:
    connected:
      - [mb.P0, servo1.sig]
      - [servo1.vcc, bat1.plus]
      - [servo1.gnd, bat1.minus, mb.GND]
    not_connected:
      - [bat1.plus, mb.3V]
      - [bat1.plus, mb.GND]
      - [bat1.plus, mb.P0]
      - [servo1.sig, servo1.vcc]
code:
  intro: >-
    This program starts the servo in the middle (90°). Press **A** to turn it
    one way and **B** to turn it the other, 10° at a time.
  starter: |
    from microbit import *

    pin0.set_analog_period(20)    # one pulse every 20 ms

    def angle_to_value(deg):
        # 0 degrees = 0.5 ms pulse, 180 degrees = 2.5 ms pulse
        pulse_ms = 0.5 + deg / 180 * 2.0
        return round(pulse_ms / 20 * 1023)

    def set_angle(deg):
        pin0.write_analog(angle_to_value(deg))

    angle = 90
    set_angle(angle)

    while True:
        if button_a.is_pressed():
            angle = angle - 10
        if button_b.is_pressed():
            angle = angle + 10
        angle = max(0, min(180, angle))   # stay between 0 and 180
        set_angle(angle)
        sleep(150)
  predict: {"question": "The servo starts at 90°. Each check while A is held takes off 10. Where is it after 3 checks?", "choices": ["60°", "80°", "120°"], "answer": 0, "explain": "90 - 10 - 10 - 10 is 60."}
  walkthrough:
    - lines: "3"
      explain: Servos want one pulse every 20 ms, so we set the PWM period to 20 ms.
    - lines: "5-11"
      explain: "`angle_to_value` turns an angle into a number and `return`s it: 0° → 26, 90° → 77, 180° → 128."
    - lines: "13-14"
      explain: Start in the middle (90°) so the servo doesn't slam to one end.
    - lines: "16-23"
      explain: Hold A or B to move 10°. `max()` and `min()` keep the angle from 0 to 180.
  try_it:
    - Change the step from 10 to 1. Then to 45. Which is easier to control?
    - "Make it sweep: `for a in range(0, 181, 10):` then `set_angle(a)` and `sleep(100)`."
    - Tape a paper dial behind the arm. Mark 0°, 90° and 180°. Is your servo accurate?
practice:
  level: "write"
  prompt: "Write a function called pulse. It takes an angle called deg and returns 26 + deg * 102 // 180."
  starter: "from microbit import *\n\n# define pulse here\n\npin0.set_analog_period(20)\npin0.write_analog(pulse(90))\n"
  solution: "from microbit import *\n\ndef pulse(deg):\n    return 26 + deg * 102 // 180\n\npin0.set_analog_period(20)\npin0.write_analog(pulse(90))\n"
  hints: ["Indent the return line.", "return sends the answer back to whoever called the function."]
  checks:
    - {"type": "syntax"}
    - {"type": "contains", "pattern": "def\\s+pulse\\(\\s*deg\\s*\\)\\s*:", "message": "Start with def pulse(deg):"}
    - {"type": "contains", "pattern": "(?m)^\\s+return\\s+26\\s*\\+\\s*deg\\s*\\*\\s*102\\s*//\\s*180", "message": "Return the math, using deg."}
debug:
  story: >-
    Maya wants button A to point her servo to 0° and button B to 180°. A gives
    an error. B makes the servo buzz and push against its end. Find the **two**
    bugs, fix them, and press **Check my fix**.
  buggy_code: |
    from microbit import *

    pin0.set_analog_period(20)

    def angle_to_value(angle):
        pulse_ms = 0.5 + angle / 180 * 2.0
        value = round(pulse_ms / 20 * 1023)

    while True:
        if button_a.was_pressed():
            pin0.write_analog(angle_to_value(0))
        if button_b.was_pressed():
            pin0.write_analog(180)
        sleep(50)
  hints:
    - The function works out `value` - but does it ever give that answer back to the code that called it?
    - write_analog() wants a number from about 26 to 128 for a servo. Is 180 an angle or a write_analog value?
  checks:
    - {type: syntax}
    - {type: contains, pattern: '^\s+return\s+\S', message: "The function needs to return its answer (for example: return value)."}
    - {type: not_contains, pattern: 'write_analog\(\s*180\s*\)', message: "180 is an angle, not a write_analog value - convert it, e.g. write_analog(angle_to_value(180))."}
  solution: |
    from microbit import *

    pin0.set_analog_period(20)

    def angle_to_value(angle):
        pulse_ms = 0.5 + angle / 180 * 2.0
        value = round(pulse_ms / 20 * 1023)
        return value

    while True:
        if button_a.was_pressed():
            pin0.write_analog(angle_to_value(0))
        if button_b.was_pressed():
            pin0.write_analog(angle_to_value(180))
        sleep(50)
  reflection_prompt: Why does a function need `return`? What did write_analog() get when the return was missing?
quiz:
  - question: What tells a servo which angle to turn to?
    choices:
      - How much voltage the battery has
      - How long each pulse lasts
      - How many wires are connected
      - How fast the code runs
    answer: 1
    explain: A short pulse (0.5 ms) means 0°, a long pulse (2.5 ms) means 180°, and 1.5 ms is the middle.
  - question: Why does the servo get its own battery pack?
    choices:
      - The 3V pin can't safely give a servo enough current
      - Servos only work with AA batteries
      - It makes the servo spin forever
    answer: 0
    explain: Servos can draw big bursts of current. Taking that from the micro:bit can reset or damage it.
  - question: Which wire must connect the battery pack to the micro:bit?
    choices:
      - Battery + to the micro:bit 3V
      - Battery – to the micro:bit GND (shared ground)
      - No wires at all
    answer: 1
    explain: A shared ground lets the micro:bit's signal make sense to the servo. Battery + must never touch 3V.
  - question: What does pin0.set_analog_period(20) do?
    choices:
      - Turns the servo 20 degrees
      - Makes each PWM cycle 20 ms long
      - Waits 20 seconds
    answer: 1
    explain: Servos look for one pulse every 20 ms, so we make the PWM cycle exactly that long.
  - question: About what write_analog value points the servo to the middle (90°)?
    choices:
      - "512"
      - "90"
      - "77"
      - "1023"
    answer: 2
    explain: 90° is a 1.5 ms pulse. 1.5 ÷ 20 × 1023 ≈ 77.
    visual:
      type: dial
      caption: "The middle: a 1.5 ms pulse every 20 ms."
      marks:
        - {angle: 0}
        - {angle: 90, pointer: true}
        - {angle: 180}
  - {"question": "`def double(n): return n * 2`. What is `double(3) + 1`?", "choices": ["7", "6", "8"], "answer": 0, "explain": "double(3) gives 6, then add 1."}
  - {"question": "From Lesson 10: which line checks for a shake?", "choices": ["accelerometer.was_gesture('shake')", "button_a.was_pressed('shake')", "music.play('shake')"], "answer": 0, "explain": "Gestures are named in quotes."}
challenge:
  title: Servo Gadget
  prompt: >-
    Build a gadget that **points, waves or moves something**. Try a mood
    meter, a waving robot hand, or a flag that pops up when you win.
    Cardboard and tape welcome!
  levels:
    - "Bronze: Make a dial with 3 labeled spots. Use buttons A and B to point to each one."
    - "Silver: Put a potentiometer or photoresistor on P1. Turn the knob, and the servo follows."
    - "Gold: Make a hand that waves when you shake the micro:bit, or a gauge that shows temperature() as an angle."
  hints:
    Bronze:
      - "Pick three angles, like 30, 90 and 150. Put them in a list."
      - "Keep `spot = 1`. Button A takes away 1 and button B adds 1. Use `set_angle(angles[spot])`."
    Silver:
      - "Read the part with `pin1.read_analog()`. It gives 0 to 1023."
      - "Scale it to an angle: `angle = value * 180 // 1023`. Then call `set_angle(angle)`."
    Gold:
      - "Check `accelerometer.was_gesture('shake')`. Inside, use a `for` loop to swing between two angles."
      - "For a gauge from 15 to 35 degrees, try `angle = (temperature() - 15) * 9`. Stay within 0-180."
  visual:
    type: dial
    caption: A mood meter needs just three angles.
    marks:
      - {angle: 20, label: "sad"}
      - {angle: 90, label: "meh"}
      - {angle: 160, label: "happy", pointer: true}
  submit_prompt: What does your servo gadget do, and how does your code decide which angle to send?
teacher_notes: |
  **Common problems**
  * **Servo doesn't move:** check the shared ground first (T-30 to B-30). Without it the servo can't read the signal. Then check the battery pack is ON and the batteries are fresh.
  * **micro:bit keeps resetting:** the servo is probably powered from 3V. Move servo red to the battery rail.
  * **Servo buzzes or strains at 0° or 180°:** many SG90s only reach about 1.0-2.0 ms reliably. Limit the angle to 10-170, or change 0.5/2.0 in the formula to 1.0/1.0.
  * **Jittery servo:** weak batteries, or loose rail wires. A 100-470 µF capacitor across B+ and B- (stripe to B-) can help.
  * **Split rails:** some half-size boards have rails that break in the middle (look for a gap in the red/blue line). If so, bridge them or keep everything on one half.
  * **TypeError / ValueError from write_analog:** usually a missing `return` (the function gave back None) or a value over 1023.

  **Battery choice**
  * The SG90 is rated about 4.8-6 V. A 4×AA alkaline pack (about 6 V) works; fresh alkalines can read up to 6.4 V. 4×AA rechargeable NiMH (4.8 V) or 3×AA (4.5 V) are gentler options. Never use a 9 V battery.

  **Safety**
  * Students switch the battery pack OFF before changing any wiring and switch it ON last.
  * Check every board for battery + on the top rail or near 3V before batteries go in.
  * Don't let the servo push against something solid for a long time - it heats up.

  **Extensions**
  * Two servos on P0 and P1 make a pan-tilt head. Both run from the same battery rail.
  * Talk about how a servo uses **feedback**: it measures its own position and corrects it.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.a.4
    how: A servo is an actuator controlled by pulse length; students use it in a control system.
  - code: 6-8.CT.a.2
    how: "An angle-to-value function turns 'point to 90\xB0' into a reusable command."
  - code: 6-8.CT.b.5
    how: "Servo pulses only work within a range (about 0-180\xB0), so students keep inputs inside it."
  - code: 6-8.CS.a.7
    how: 'Diagnose power problems: a separate battery pack, a shared ground, jitter from low batteries.'
