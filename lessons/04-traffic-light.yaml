id: traffic-light
unit: 1
order: 4
title: Traffic Light
subtitle: Control three LEDs and organize your code with functions
duration_minutes: 35
level: Beginner
big_idea: >-
  A function is a named recipe of instructions - define it once with def, then
  run it any time just by calling its name.
objectives:
  - Wire three LEDs, each with its own pin and resistor
  - Define functions with def and call them by name
  - Time a light sequence with sleep()
  - Find and fix bugs in functions
vocabulary:
  - term: Function
    definition: A named block of code that does one job. You create it with def.
  - term: Define
    definition: "To create a function with def name(): and its indented lines. Defining doesn't run it."
  - term: Call
    definition: To run a function by writing its name with parentheses, like red().
  - term: Sequence
    definition: Steps that happen in a set order, like green → yellow → red.
  - term: Ground rail
    definition: The long – strip on the breadboard that many parts can share as GND.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 3 LEDs - red, yellow and green
  - 3 resistors, 220 Ω (red-red-brown)
  - 7 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 4}
  - {key: circuit, name: Build the circuit, minutes: 9}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 4}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Building a traffic light
  note: Notice that every LED gets its own resistor, but they all share one ground rail.
warmup:
  prompt: >-
    Think about a traffic light near your school. What order do the colors go
    in? About how long does each one stay on? Why is yellow the shortest?
learn:
  - text: |
      ### Three LEDs, three pins
      Last lesson, one LED was on **P0**. Today each LED gets its **own pin**:

      * **Red** on **P0**
      * **Yellow** on **P1**
      * **Green** on **P2**

      Each LED also needs its **own 220 Ω resistor**.
    visual:
      type: compare
      items:
        - {icon: "🔴", title: "Red", text: "P0 + its own resistor"}
        - {icon: "🟡", title: "Yellow", text: "P1 + its own resistor"}
        - {icon: "🟢", title: "Green", text: "P2 + its own resistor"}
  - text: |
      ### One shared ground rail
      All three short legs (**cathodes**) go to the same **ground rail**. That's the long **–** strip on the breadboard.

      Sharing ground is fine. Every loop still ends at **GND**.
    visual:
      type: circuit
      caption: "Three black wires join each short leg to the blue (–) rail."
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: led, id: led_red, anode: e9, cathode: e10, color: red}
        - {type: led, id: led_yellow, anode: e17, cathode: e18, color: yellow}
        - {type: led, id: led_green, anode: e25, cathode: e26, color: green}
        - {type: wire, from: a10, to: T-10, color: black}
        - {type: wire, from: a18, to: T-18, color: black}
        - {type: wire, from: a26, to: T-26, color: black}
  - text: |
      ### Functions: name your recipes
      Turning on red takes two steps: turn the others off, then turn red on. Wrap those lines in a **function**:

      ```python
      def red():
          all_off()
          pin0.write_digital(1)
      ```

      `def` **defines** the function. The indented lines are its recipe. End the `def` line with a **colon** `:`.
    visual:
      type: compare
      items:
        - {icon: "😩", title: "No function", text: "Type the same lines every time"}
        - {icon: "😎", title: "With a function", text: "Write red() and it's done"}
  - text: |
      ### Defining isn't doing
      Defining a function is like writing a recipe card. Nothing gets cooked yet.

      To run it, you must **call** it: `red()`.

      The **parentheses** `()` matter!
    visual:
      type: compare
      items:
        - {icon: "📝", title: "red", text: "Only names the recipe. Nothing happens."}
        - {icon: "▶️", title: "red()", text: "Calls the function. The red LED turns on!"}
  - text: |
      ### A sequence in a loop
      A **sequence** is steps in a set order. The main loop calls the functions one after another.

      * `sleep()` sets how long each light stays on.
      * Then the loop starts over.
    visual:
      type: flow
      loop: true
      loop_label: repeat forever
      steps:
        - {icon: "🟢", label: "green() for 3 s"}
        - {icon: "🟡", label: "yellow() for 1 s"}
        - {icon: "🔴", label: "red() for 3 s"}
circuit:
  intro: >-
    You'll build three copies of the LED loop from last time, side by side:
    pin → resistor → LED → ground rail. Build with the USB cable unplugged.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect 3V straight to GND with a wire - that's a short circuit.
    - Every LED gets its own resistor.
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to the top **blue (–)
        rail** at **T-1**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Three resistors
      instruction: >-
        Put the three 220 Ω resistors in row **c**. Use **c5** to **c9**,
        **c13** to **c17**, and **c21** to **c25**.
      check: Is each resistor across two columns, with no column shared?
      add:
        - {type: resistor, id: r1, a: c5, b: c9, ohms: 220}
        - {type: resistor, id: r2, a: c13, b: c17, ohms: 220}
        - {type: resistor, id: r3, a: c21, b: c25, ohms: 220}
    - title: Red LED
      instruction: >-
        Put the **red** LED's **long leg (+)** in **e9** (same column as the
        first resistor's right leg) and its **short leg (–)** in **e10**.
      check: Is the red LED's long leg in column 9 and short leg in column 10?
      tip: Flat edge on the rim = short leg = minus.
      add:
        - {type: led, id: led_red, anode: e9, cathode: e10, color: red}
    - title: Yellow and green LEDs
      instruction: >-
        Put the **yellow** LED's long leg in **e17** and short leg in **e18**.
        Put the **green** LED's long leg in **e25** and short leg in **e26**.
      check: Are all three long legs touching a resistor's column, and all three short legs in a column of their own?
      add:
        - {type: led, id: led_yellow, anode: e17, cathode: e18, color: yellow}
        - {type: led, id: led_green, anode: e25, cathode: e26, color: green}
    - title: Ground wires
      instruction: >-
        Add three **black** wires from each LED's short-leg column to the
        **blue (–) rail**: **a10** to **T-10**, **a18** to **T-18**, and
        **a26** to **T-26**.
      check: Does every LED's short leg now have a path to the blue rail?
      add:
        - {type: wire, from: a10, to: T-10, color: black}
        - {type: wire, from: a18, to: T-18, color: black}
        - {type: wire, from: a26, to: T-26, color: black}
    - title: Signal wires
      instruction: >-
        Wire each resistor's left column to a pin. Run a **red** wire from
        **P0** to **a5**. Run a **yellow** wire from **P1** to **a13**. Run a
        **green** wire from **P2** to **a21**.
      check: Is each loop (pin, resistor, LED, ground rail) complete and separate?
      tip: Matching wire colors to LED colors makes a wrong pin easy to spot.
      add:
        - {type: wire, from: mb.P0, to: a5, color: red}
        - {type: wire, from: mb.P1, to: a13, color: yellow}
        - {type: wire, from: mb.P2, to: a21, color: green}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led_red.anode]
      - [mb.P1, r2.a]
      - [r2.b, led_yellow.anode]
      - [mb.P2, r3.a]
      - [r3.b, led_green.anode]
      - [led_red.cathode, led_yellow.cathode, led_green.cathode, mb.GND]
    not_connected:
      - [led_red.anode, led_red.cathode]
      - [led_yellow.anode, led_yellow.cathode]
      - [led_green.anode, led_green.cathode]
      - [mb.P0, mb.P1]
      - [mb.P1, mb.P2]
      - [mb.P0, mb.P2]
code:
  intro: >-
    Each light gets its own function. The loop calls them in order, just
    like a real traffic light.
  starter: |
    from microbit import *

    def all_off():
        pin0.write_digital(0)
        pin1.write_digital(0)
        pin2.write_digital(0)

    def red():
        all_off()
        pin0.write_digital(1)

    def yellow():
        all_off()
        pin1.write_digital(1)

    def green():
        all_off()
        pin2.write_digital(1)

    while True:
        green()
        sleep(3000)
        yellow()
        sleep(1000)
        red()
        sleep(3000)
  predict: {"question": "When Python first reaches `def green():`, what happens to the green LED?", "choices": ["It turns on", "It blinks", "Nothing yet, Python just saves the recipe"], "answer": 2, "explain": "Defining isn't doing. The LED changes when green() is called."}
  walkthrough:
    - lines: "3-6"
      explain: "`all_off()` turns every LED off. The other functions use it so only one light is on."
    - lines: "8-10"
      explain: >-
        `red()` turns everything off, then turns on pin 0. It's only
        **defined** here, so nothing happens yet.
    - lines: "12-18"
      explain: Same recipe for yellow (pin 1) and green (pin 2).
    - lines: "20-26"
      explain: >-
        The functions are **called** here. Green for 3 seconds, yellow for 1,
        red for 3. Then the loop repeats.
  try_it:
    - Change the timing so green stays on for 5 seconds.
    - Add a `red_yellow()` function that lights red and yellow together.
    - Make yellow blink 3 times before going to red.
practice:
  level: "fill"
  prompt: "Fill in the blanks. Finish a function that lights yellow and green together, then call it in the loop."
  starter: "from microbit import *\n\ndef all_off():\n    pin0.write_digital(0)\n    pin1.write_digital(0)\n    pin2.write_digital(0)\n\ndef yellow_green():\n    all_off()\n    pin1.___(1)\n    pin2.write_digital(___)\n\nwhile True:\n    ___()\n    sleep(500)\n    all_off()\n    sleep(500)\n"
  solution: "from microbit import *\n\ndef all_off():\n    pin0.write_digital(0)\n    pin1.write_digital(0)\n    pin2.write_digital(0)\n\ndef yellow_green():\n    all_off()\n    pin1.write_digital(1)\n    pin2.write_digital(1)\n\nwhile True:\n    yellow_green()\n    sleep(500)\n    all_off()\n    sleep(500)\n"
  hints: ["To call a function, write its name and ()."]
  checks:
    - {"type": "syntax"}
    - {"type": "not_contains", "pattern": "___", "message": "Fill in every blank first."}
    - {"type": "contains", "pattern": "pin1\\.write_digital\\(\\s*1\\s*\\)", "message": "Turn on pin 1 with write_digital."}
    - {"type": "contains", "pattern": "pin2\\.write_digital\\(\\s*1\\s*\\)", "message": "Pin 2 needs a 1 to turn on."}
    - {"type": "contains", "pattern": "(?m)^\\s+yellow_green\\(\\)", "message": "Call your function inside the loop."}
debug:
  story: >-
    Alex built a traffic light, but Python won't run the code. After that's
    fixed, yellow **never** turns on, and green stays on too long. Find the
    **three** bugs, then press **Check my fix**.
  buggy_code: |
    from microbit import *

    def all_off()
        pin0.write_digital(0)
        pin1.write_digital(0)
        pin2.write_digital(0)

    def red():
        all_off()
        pin0.write_digital(1)

    def yellow():
        all_off()
        pin2.write_digital(1)

    def green():
        all_off()
        pin2.write_digital(1)

    while True:
        green()
        sleep(3000)
        yellow
        sleep(1000)
        red()
        sleep(3000)
  hints:
    - Every def line needs to end with a special punctuation mark. Do they all have it?
    - The yellow LED is wired to P1. Which pin does the yellow() function turn on?
    - Defining a function doesn't run it. Look closely at how yellow is called in the loop - compare it with green() and red().
  checks:
    - {type: syntax, message: "Python can't read this yet - every def line needs a colon at the end."}
    - {type: contains, pattern: "def\\s+yellow\\s*\\(\\s*\\)\\s*:[^\\n]*\\n(?:[ \\t]*\\n|[ \\t]+[^\\n]*\\n)*?[ \\t]+pin1\\.write_digital\\(\\s*1\\s*\\)", message: "The yellow LED is on P1 - yellow() should turn on pin1."}
    - {type: not_contains, pattern: "^\\s*yellow\\s*$", message: "Writing just yellow names the function but doesn't run it. Call it with parentheses: yellow()."}
    - {type: contains, pattern: "^[ \\t]+yellow\\(\\s*\\)", message: "Call yellow() inside the loop."}
  solution: |
    from microbit import *

    def all_off():
        pin0.write_digital(0)
        pin1.write_digital(0)
        pin2.write_digital(0)

    def red():
        all_off()
        pin0.write_digital(1)

    def yellow():
        all_off()
        pin1.write_digital(1)

    def green():
        all_off()
        pin2.write_digital(1)

    while True:
        green()
        sleep(3000)
        yellow()
        sleep(1000)
        red()
        sleep(3000)
  reflection_prompt: Why didn't Python give an error for the line that just said yellow? How did you figure out it wasn't running?
quiz:
  - question: What does def do in Python?
    choices:
      - Runs a function right away
      - Defines (creates) a function so you can use it later
      - Deletes a function
      - Turns on an LED
    answer: 1
    explain: def creates the recipe. The code inside only runs when you call the function.
  - question: Which line actually runs the green function?
    choices:
      - "def green():"
      - green
      - green()
      - Green()
    answer: 2
    explain: You call a function with its exact name plus parentheses. green with no () does nothing, and Green() is a different (unknown) name.
  - question: The green LED is wired to P2. Which line turns it on?
    visual:
      type: circuit
      caption: "The green LED's loop starts at P2."
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: resistor, id: r3, a: c21, b: c25, ohms: 220}
        - {type: led, id: led_green, anode: e25, cathode: e26, color: green}
        - {type: wire, from: a26, to: T-26, color: black}
        - {type: wire, from: mb.P2, to: a21, color: green}
    choices:
      - pin0.write_digital(1)
      - pin2.write_digital(1)
      - pin2.write_digital(0)
    answer: 1
    explain: Match the pin number in your code to the pin your wire goes to. 1 means on.
  - question: Why does each LED need its own resistor?
    choices:
      - To limit each LED's current, whichever ones are on
      - Because resistors make LEDs change color
      - It doesn't - one resistor is always enough
    answer: 0
    explain: Each LED is its own loop from its own pin, so each loop needs its own current limiter.
  - {"question": "A program defines `hi()`, but never writes `hi()` anywhere else. What does `hi` do?", "choices": ["It runs once", "Nothing, it was never called", "It runs forever"], "answer": 1, "explain": "A function only runs when it's called."}
  - {"question": "From Lesson 3: what does `pin0.write_digital(0)` do?", "choices": ["Turns pin 0 off", "Turns pin 0 on", "Reads pin 0"], "answer": 0, "explain": "0 sends 0 volts, so the pin is off."}
challenge:
  title: Light Show Remix
  prompt: >-
    Your three LEDs can do more than a traffic light! Use functions to invent
    a new pattern: a crosswalk, a party light, a race start, or your own idea.
  levels:
    - "Bronze: Make a race start. Red, then red + yellow, then all three. Then all off, and show Image.YES for GO!"
    - "Silver: Add a walk signal. Show `Image.STICKFIGURE` during red and `Image.NO` during green."
    - "Gold: Write your own function, like `party()`, that calls your other functions. Use it to build a whole light show."
  hints:
    Bronze:
      - "The `red()` function turns the others off first. For red + yellow, use the pin lines instead."
      - "Red is `pin0`, yellow is `pin1` and green is `pin2`. Use `all_off()` before GO."
    Silver:
      - "Put `display.show()` right after `red()` in the loop."
      - "Keep the order: call the light, show the picture, then `sleep()`."
    Gold:
      - "Inside `party()`, call `red()`, `sleep()`, `green()` and so on. Indent every line."
      - "Define `party()` above the loop. Then call it inside the loop with `party()`."
  submit_prompt: What pattern did you make, and which function are you proudest of? Why did using functions help?
  visual:
    type: flow
    caption: "Bronze: a race start, one step at a time."
    steps:
      - {icon: "🔴", label: "red"}
      - {icon: "🟡", label: "red + yellow"}
      - {icon: "🟢", label: "all three"}
      - {icon: "✅", label: "all off, show GO!"}
teacher_notes: |
  * **One LED won't light?** Swap it into a working spot to test it, check its polarity, then check that its resistor is in the right column. Matching wire colors to LED colors makes wrong-pin mistakes obvious.
  * **Two LEDs light together?** Usually a resistor or LED leg is in the wrong column, joining two loops. Check that columns 5-10, 13-18 and 21-26 don't touch each other.
  * **None light?** Check the black GND wire from the breakout reaches the blue rail. On some half-size breadboards the rails are split in the middle - if so, add a jumper across the gap.
  * The "yellow without parentheses" bug is sneaky: it's valid Python, so there's no error. Use it to discuss the difference between naming a function and calling it.
  * P0, P1 and P2 are also touch pins, but they work fine as digital outputs.
  * Extension: introduce parameters with `def light(r, y, g):` that sets all three pins at once.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CT.a.2
    how: Define red(), yellow(), green() and all_off(), then reuse them to build any light sequence.
  - code: 6-8.CT.d.2
    how: The main loop calls functions by name, so the pin details stay hidden inside them.
  - code: 6-8.CT.b.3
    how: Break a traffic signal down into separate light states and the timing between them.
  - code: 6-8.CT.e.1
    how: Model a real traffic light, deciding which real-world details to copy (order, timing) and which to ignore.
