id: motion-and-sound
unit: 3
order: 10
title: Shake, Tilt and Play
subtitle: Use the accelerometer and the music module to build a shake alarm and a tilt theremin
duration_minutes: 35
level: Intermediate
big_idea: >-
  The accelerometer senses how the micro:bit moves and tilts, and the music
  module turns numbers into sound - so motion can control music.
objectives:
  - Read tilt and shakes with the accelerometer
  - Wire a piezo buzzer to pin 0
  - Play tunes and notes with the music module
  - Turn tilt into pitch to make a theremin
vocabulary:
  - term: Accelerometer
    definition: A sensor that measures pushes and pulls (like gravity) in three directions - x, y and z.
  - term: Gesture
    definition: A movement the micro:bit recognizes for you, like 'shake', 'face up' or 'left'.
  - term: Frequency (pitch)
    definition: How many times per second a sound vibrates, measured in hertz (Hz). Higher frequency = higher note.
  - term: Piezo buzzer
    definition: A thin disc that clicks back and forth when the voltage changes fast, making sound.
  - term: Theremin
    definition: A musical instrument you play without touching it - the pitch changes as you move.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 passive piezo buzzer (2 legs)
  - 3 jumper wires
  - Optional - headphones with alligator clips, or just the V2 built-in speaker
agenda:
  - {key: warmup, name: Warm-up, minutes: 3}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Wire the buzzer, minutes: 5}
  - {key: code, name: Code it, minutes: 10}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 2}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Motion and sound with the micro:bit
  note: Listen for how the pitch slides up and down as the micro:bit tilts left and right.
warmup:
  prompt: >-
    Your phone knows when you turn it sideways and flips the screen. How do you
    think it can tell which way is down? What could a game do with that?
learn:
  - text: |
      ### The accelerometer feels tilt
      The **accelerometer** is a sensor that feels gravity. It measures
      **x** (left-right), **y** (forward-back) and **z** (up-down).

      `accelerometer.get_x()` gives a number:
      * Flat on the table: about **0**
      * Tilted all the way **right**: about **1024**
      * Tilted all the way **left**: about **-1024**

      A hard shake can go even bigger!
    visual:
      type: scale
      min: -1024
      max: 1024
      caption: What get_x() says as you tilt left and right.
      zones:
        - {from: -1024, to: -300, label: "tilted left"}
        - {from: -300, to: 300, label: "flat"}
        - {from: 300, to: 1024, label: "tilted right"}
      marks:
        - {at: -1024, label: "-1024"}
        - {at: 0, label: "0", pointer: true}
        - {at: 1024, label: "1024"}
  - text: |
      ### Gestures do the math for you
      A **gesture** is a move the micro:bit knows by name.

      ```python
      if accelerometer.was_gesture('shake'):
          display.show(Image.SURPRISED)
      ```

      * Others: `'up'`, `'down'`, `'left'`, `'right'`, `'face up'`, `'face down'`, `'freefall'`
      * The name goes in **quotes**. It's text.
    visual:
      type: leds
      caption: "Show an arrow for each gesture: 'left', 'right', 'up', 'down'."
      frames: [ARROW_W, ARROW_E, ARROW_N, ARROW_S]
  - text: |
      ### The music module
      Sound lives in its own module. Put **`import music`** at the top.

      * Play a **built-in tune**, like `music.BIRTHDAY` or `music.NYAN`.
      * Play your **own notes** from a list.
      * Play **one pitch** for a set time.
    visual:
      type: compare
      items:
        - {icon: "🎂", title: "music.play(music.BIRTHDAY)", text: "a built-in tune"}
        - {icon: "🎼", title: "music.play(['C4:4', 'E4:4'])", text: "your own notes"}
        - {icon: "🔔", title: "music.pitch(440, 200)", text: "440 Hz for 200 ms"}
  - text: |
      ### Wire a piezo buzzer
      A **piezo buzzer** is a thin disc that clicks fast to make sound.

      * Its **+ leg** goes to **P0**.
      * Its other leg goes to **GND**.

      Music sent to pin 0 now plays on the buzzer.
    visual:
      type: part
      part: buzzer
      labels: {plus: "+ → P0", minus: "– → GND"}
  - text: |
      ### Where does the sound come out?
      On a V2, music plays on **pin 0** *and* the **built-in speaker** at the same time.

      * `speaker.off()`: only the buzzer on pin 0 plays.
      * `speaker.on()`: the built-in speaker plays again.
    visual:
      type: compare
      items:
        - {icon: "🔊", title: "speaker.on()", text: "pin 0 and the built-in speaker"}
        - {icon: "🔈", title: "speaker.off()", text: "only the buzzer on pin 0"}
  - text: |
      ### Turning tilt into a note
      **Frequency** is how fast a sound shakes, in **hertz (Hz)**. Higher Hz = higher note.

      A **theremin** changes pitch as you move:
      `freq = 600 + x * 400 // 1024`

      * Left: x is **negative**, so it drops to **200 Hz**
      * Flat (x = 0) → **600 Hz**
      * Right (x = 1024) → **1000 Hz**
    visual:
      type: scale
      min: -1024
      max: 1024
      map: [2, 10]
      map_label: pitch (× 100 Hz)
      caption: More tilt to the right means a higher note.
      marks:
        - {at: -1024, label: "-1024"}
        - {at: 0, label: "0"}
        - {at: 1024, label: "1024"}
circuit:
  intro: >-
    You'll wire a piezo buzzer between pin 0 and ground. It's a short circuit
    to build - most of today is about the code. Unplug the USB cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - Use a passive piezo buzzer. A big magnetic buzzer can pull too much current from a pin.
    - Keep the volume kind to your neighbors - cover the buzzer with a finger to make it quieter.
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to hole **T-1** on the top
        **blue (–) rail**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Piezo buzzer
      instruction: >-
        Push the buzzer's **+ leg** (often the longer leg, or marked **+**) into
        **e10** and the other leg into **e13**. If your buzzer's legs are closer
        together, use **e10** and **e12** and move the black wire in the next step to column 12.
      check: Are the two buzzer legs in two different columns?
      tip: Many piezo buzzers work either way round, but following the + mark is a good habit.
      add:
        - {type: buzzer, id: bz1, plus: e10, minus: e13}
    - title: Connect pin 0 and ground
      instruction: >-
        Add a **yellow** wire from **P0** to **a10** (the + leg's column). Add a
        **black** wire from **a13** (the other leg's column) to **T-13** on the
        blue (–) rail.
      check: Trace it - P0, buzzer, ground. Is the loop complete?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a13, to: T-13, color: black}
  verify:
    connected:
      - [mb.P0, bz1.plus]
      - [bz1.minus, mb.GND]
    not_connected:
      - [bz1.plus, bz1.minus]
      - [mb.P0, mb.GND]
code:
  intro: >-
    This program is two instruments in one. **Shake** it to set off an alarm.
    **Hold button A** and tilt left and right to play the theremin.
  starter: |
    from microbit import *
    import music

    display.show(Image.MUSIC_CROTCHET)

    while True:
        if accelerometer.was_gesture('shake'):
            display.show(Image.SURPRISED)
            music.play(music.POWER_UP)
            display.show(Image.MUSIC_CROTCHET)

        if button_a.is_pressed():
            x = accelerometer.get_x()
            freq = 600 + x * 400 // 1024
            freq = max(100, min(2000, freq))   # keep it in a safe range
            music.pitch(freq, 50)

        if button_b.was_pressed():
            speaker.off()      # buzzer only
            display.show("B")
            sleep(500)
            display.show(Image.MUSIC_CROTCHET)
  walkthrough:
    - lines: "1-2"
      explain: "`from microbit import *` gets the buttons and sensors. `import music` adds sound."
    - lines: "7-10"
      explain: If it was shaken since the last check, show a face and play a tune.
    - lines: "12-16"
      explain: While A is held, tilt sets the pitch. Keep it 100-2000 Hz. Play it for 50 ms.
    - lines: "18-22"
      explain: Button B turns off the built-in speaker. Now only the buzzer on pin 0 plays.
  try_it:
    - Swap `music.POWER_UP` for another tune, like `music.NYAN`.
    - Change 400 to 800 in the freq line. How does the range change?
    - Use `get_y()` instead of `get_x()`. Now tilt forward and back.
debug:
  story: >-
    Leo built a "don't touch my stuff" alarm. It should scream when somebody
    shakes it - but it crashes the moment it starts. There are **two** bugs.
    Find them, fix them, and press **Check my fix**.
  buggy_code: |
    from microbit import *

    display.show(Image.ASLEEP)

    while True:
        if accelerometer.was_gesture(shake):
            display.show(Image.ANGRY)
            music.play(music.BADDY)
            display.show(Image.ASLEEP)
        sleep(100)
  hints:
    - "Is 'shake' a variable, or is it the name of a gesture? How do you write text in Python?"
    - "`from microbit import *` doesn't include music. What line do you need at the top?"
  checks:
    - {type: syntax}
    - {type: contains, pattern: '^\s*import\s+music|^\s*from\s+music\s+import', message: "Add import music at the top - the music module isn't part of from microbit import *."}
    - {type: contains, pattern: 'was_gesture\(\s*[''"]shake[''"]\s*\)', message: "Gesture names are text - put shake in quotes: was_gesture('shake')."}
  solution: |
    from microbit import *
    import music

    display.show(Image.ASLEEP)

    while True:
        if accelerometer.was_gesture('shake'):
            display.show(Image.ANGRY)
            music.play(music.BADDY)
            display.show(Image.ASLEEP)
        sleep(100)
  reflection_prompt: Both bugs gave a NameError. What does a NameError tell you, and how did it help you find the problem?
quiz:
  - question: The micro:bit is lying flat on the table. About what does accelerometer.get_x() return?
    choices:
      - About 0
      - About 1024
      - About -1024
      - It returns 'flat'
    answer: 0
    explain: Flat means no tilt left or right, so x is close to 0. Tilting right goes toward 1024, left toward -1024.
    visual:
      type: scale
      min: -1024
      max: 1024
      caption: The get_x() number line.
      zones:
        - {from: -1024, to: -300, label: "left"}
        - {from: 300, to: 1024, label: "right"}
      marks:
        - {at: -1024, label: "-1024"}
        - {at: 1024, label: "1024"}
  - question: Which line correctly checks for a shake?
    choices:
      - "`if accelerometer.was_gesture(shake)`"
      - "`if accelerometer.was_gesture('shake'):`"
      - "`if accelerometer.shake == True:`"
    answer: 1
    explain: The gesture name is text, so it needs quotes, and an if line ends with a colon.
  - question: What happens to the sound if you make the frequency number bigger?
    choices:
      - The note gets louder
      - The note gets higher
      - The note gets longer
    answer: 1
    explain: Frequency is how fast the sound vibrates. More vibrations per second = a higher pitch.
  - question: On a micro:bit V2, where does music.play() send sound by default?
    choices:
      - Only the built-in speaker
      - Only pin 0
      - Both pin 0 and the built-in speaker
    answer: 2
    explain: Sound goes to pin 0 and the V2 speaker together. Use speaker.off() to hear only the buzzer.
  - question: In music.pitch(440, 200), what is 200?
    choices:
      - The frequency in Hz
      - How long to play, in milliseconds
      - The volume
    answer: 1
    explain: The first number is the frequency (440 Hz) and the second is the duration (200 ms).
challenge:
  title: Motion-Powered Music Machine
  prompt: >-
    Invent a gadget where **movement makes sound**. Try a backpack bike-bell,
    a game that beeps when you tilt too far, or a "magic wand" with sound
    effects. Make it surprising!
  levels:
    - "Bronze: Give 'left', 'right', 'face down' and 'shake' each their own melody."
    - "Silver: Make a steady-hand game. Tilt past 300 either way and the buzzer buzzes. You lose a life. Show lives on the display."
    - "Gold: Make the theremin play only real notes from a scale, or use get_y() to set how long each note lasts."
  hints:
    Bronze:
      - "Use `accelerometer.was_gesture('left')`, and the same for 'right', 'face down' and 'shake'."
      - "Give each gesture its own `if`, with a different tune inside. Try `music.NYAN`."
    Silver:
      - "Read `x = accelerometer.get_x()`. Test both sides: `if x > 300 or x < -300:`."
      - "Start with `lives = 3`. Take away 1 for each buzz. Add `sleep(1000)` so one tilt counts once."
    Gold:
      - "Put a scale in a list: `notes = [262, 294, 330, 392, 440]`. These are in hertz."
      - "Turn the tilt into a list spot from 0 to 4. Then use `music.pitch(notes[i], 200)`."
      - "For note length, read `get_y()` the same way. Use it as the second number in `music.pitch()`."
  submit_prompt: What does your gadget do, which motions does it react to, and how did you turn motion into sound?
teacher_notes: |
  **Common problems**
  * **NameError: music** - `import music` is missing. `from microbit import *` does not include it.
  * **No sound from the buzzer:** make sure it's a *passive* piezo. An active buzzer only beeps one tone and can't play melodies. Check that the legs are in two different columns.
  * **Buzzer is quiet:** piezos are quieter than the V2 speaker - that's normal. Pressing B (speaker.off()) makes it easier to hear which is playing. `speaker.on()` brings the speaker back; it also comes back after a reset.
  * **Shake doesn't trigger:** use a firm shake. `was_gesture()` remembers a gesture since the last check, so short loops catch it reliably.
  * **Theremin sounds choppy:** that's the 50 ms notes. Try 20 ms, or remove other sleeps from the loop.
  * `music.play()` waits until the tune finishes (`wait=True`), so the program pauses during the alarm. Add `wait=False` to play in the background.

  **Noise management**
  * Thirty buzzers at once is a lot! Agree on a "quiet signal", let students use a finger over the buzzer, or use headphones with alligator clips on P0 and GND.

  **Safety**
  * Shake gently enough that the micro:bit doesn't fly out of hands or pull wires out. Hold the breadboard and micro:bit together while shaking, or unplug the buzzer and use the built-in speaker for the shake tests.

  **Extensions**
  * `accelerometer.get_values()` returns (x, y, z) together.
  * Use `radio` so shaking one micro:bit sets off the alarm on another.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.a.4
    how: The accelerometer (sensor) and the buzzer or speaker (actuators) make a shake alarm and a tilt theremin.
  - code: 6-8.CT.b.1
    how: Gesture conditionals and a forever loop choose which sound to play.
  - code: 6-8.CT.b.2
    how: Predict the pitch that a given amount of tilt will produce once it is mapped to a frequency.
  - code: 6-8.CT.d.3
    how: 'Motion-Powered Music Machine challenge: design a program that reacts to motion in a planned way.'
