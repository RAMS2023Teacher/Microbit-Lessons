id: potentiometer
unit: 2
order: 8
title: Knobs and Potentiometers
subtitle: Read a knob, scale the numbers, and draw a bar graph
duration_minutes: 35
level: Beginner
big_idea: >-
  Scaling turns one range of numbers into another, so a knob reading of
  0-1023 can become 0-5 bars on the display or any brightness you like.
essential_question: "How do we turn one kind of number into another that's more useful?"
objectives:
  - Wire a knob and read it on pin 2
  - Scale 0-1023 down to 0-5 with //
  - Draw a bar graph on the 5×5 display
  - Control an LED's brightness by turning the knob
vocabulary:
  - term: Potentiometer
    definition: A knob with three legs. Turning it slides the middle leg (the wiper) between the two outer legs.
  - term: Wiper
    definition: The middle leg of a potentiometer. Its voltage changes as you turn the knob.
  - term: Scaling (mapping)
    definition: Changing a number from one range to another, like 0-1023 into 0-5.
  - term: Integer division //
    definition: Division that throws away the remainder and gives a whole number. 7 // 2 is 3.
  - term: Pixel
    definition: One of the 25 LEDs on the display. set_pixel(x, y, brightness) sets one, with brightness 0-9.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 1 potentiometer, 10 kΩ (breadboard-friendly knob)
  - 7 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Build the circuit, minutes: 7}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: How a potentiometer works
  note: Look inside the knob to see the wiper sliding along the track.
warmup:
  prompt: >-
    Name some knobs and sliders you've used - on a speaker, a stove, a game
    controller, anything. What does turning each one change, and from what to
    what?
learn:
  - text: |
      ### What's inside a knob?
      A **potentiometer** ("pot") has a strip of resistance inside.

      * The two **outer legs** go to **3V** and **GND**.
      * The **wiper** (middle leg) slides along the strip as you turn.

      `pin2.read_analog()` turns the wiper's voltage into **0 to 1023**. Your code sends that number straight to the LED. Drag the slider like a knob.
    visual:
      type: try
      kind: pwm
      code: "pin0.write_analog({value})"
      max: 1023
      start: 512
    more: |
      **A voltage divider you can turn.** Last lesson, **light** changed the resistances. Now **your hand** does.
      Same idea: two resistances share 3 volts, and the pin reads the middle. As you turn, the wiper's
      voltage goes smoothly from 0 to 3 volts.
    check:
      question: You turn the knob all the way. What is the biggest number `read_analog()` can give?
      choices: ["3", "100", "1023"]
      answer: 2
      why: read_analog turns 0 to 3 volts into a number from 0 to 1023.
      hint: The wiper gives up to 3 volts, but the pin doesn't report volts. What range does the card give?
  - text: |
      ### One / or two //?
      * One `/` gives a decimal: `7 / 2` is `3.5`.
      * Two `//` **drops the remainder**: `7 // 2` is `3`.

      You can't light 3.5 rows! So use `//` to get a whole number.
    visual:
      type: compare
      items:
        - {icon: "🔢", title: "7 / 2", text: "3.5, a decimal"}
        - {icon: "✅", title: "7 // 2", text: "3, a whole number"}
    check:
      question: What is `9 // 2` in Python?
      choices: ["4", "4.5", "5"]
      answer: 0
      why: 9 / 2 is 4.5, and // drops the remainder, leaving 4.
      hint: First work out 9 / 2. Then remember that // doesn't round, it just throws away the leftover part.
  - text: |
      ### Scaling numbers
      The knob gives **0-1023**. But the display has only **5** rows. A bar can be **6 heights**: empty, or 1 to 5 rows.

      * **Multiply** by the number of heights (6).
      * **Integer-divide** by the number of readings (1024).

      ```python
      bars = value * 6 // 1024     # 0, 1, 2, 3, 4 or 5
      ```
    visual:
      type: scale
      min: 0
      max: 1023
      marks:
        - {at: 0, label: "0"}
        - {at: 1023, label: "1023"}
      map: [0, 5]
      map_label: bars
      caption: "The whole knob range squeezes into 0 to 5 bars."
    check:
      question: Why do we multiply by **6**, when the display only has 5 rows?
      choices: ["1024 divides evenly by 6", "A bar has 6 heights: empty, or 1 to 5 rows", "The display really has 6 rows"]
      answer: 1
      why: An empty bar counts as a height too, so there are 6 possible heights.
      hint: Count every bar height you could show, including the smallest one of all.
  - text: |
      ### The display's grid
      `display.set_pixel(x, y, brightness)` lights one LED.

      * **x** goes 0-4, left to right.
      * **y** goes 0-4, **top to bottom**.
      * **brightness** goes 0-9.

      So the bottom row is **y = 4**.
    visual:
      type: leds
      image: "00000:00000:00000:00000:99999"
      caption: "The bottom row is y = 4."
    check:
      question: You want to light an LED in the **bottom** row. Which y do you use?
      choices: ["y = 0", "y = 5", "y = 4"]
      answer: 2
      why: y counts from 0 at the top down to 4 at the bottom.
      hint: Does y count up from the bottom, or down from the top? And where does it start?
circuit:
  intro: >-
    Keep the LED on pin 0 and add a knob on pin 2. You'll use both rails: red
    (+) for 3V and blue (–) for GND. Unplug the USB cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - The wiper (middle leg) goes to P2 - never wire the middle leg to 3V or GND.
    - Never connect the red (+) rail straight to the blue (–) rail.
  steps:
    - title: Power rails
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from **GND** to the top **blue (–) rail** at **T-1**.
        Run a **red** wire from **3V** to the top **red (+) rail** at **T+1**.
      check: Is red in the + rail and black in the – rail?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: wire, from: mb.3V, to: T+1, color: red}
    - title: Resistor and LED
      instruction: >-
        Put the 220 Ω resistor from **c10** to **c14**. Put the LED's **long leg
        (+)** in **e14** and its **short leg (–)** in **e15**.
      check: Is the LED's long leg in column 14, next to the resistor?
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
        - {type: led, id: led1, anode: e14, cathode: e15, color: green}
    - title: LED wires
      instruction: >-
        Add a **yellow** wire from **P0** to **a10**. Add a **black** wire from
        **a15** to the **blue (–) rail** at **T-15**.
      check: Can you trace P0 → resistor → LED → ground?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
    - title: Potentiometer
      instruction: >-
        With the knob facing you, push the potentiometer's three legs into
        **e24** (left), **e25** (middle, the wiper) and **e26** (right).
      check: Is each of the three legs in its own column - 24, 25 and 26?
      tip: If the legs are spread wider, use e24, e26 and e28 and move the wires to match.
      add:
        - {type: potentiometer, id: pot1, left: e24, wiper: e25, right: e26}
    - title: Potentiometer wires
      instruction: >-
        Add a **red** wire from the **red (+) rail** at **T+24** to **a24**
        (left leg). Add a **green** wire from **P2** to **a25** (the wiper).
        Add a **black** wire from **a26** (right leg) to the **blue (–) rail**
        at **T-26**.
      check: "Outer legs go to 3V and GND, and the middle leg goes to P2?"
      add:
        - {type: wire, from: T+24, to: a24, color: red}
        - {type: wire, from: mb.P2, to: a25, color: green}
        - {type: wire, from: a26, to: T-26, color: black}
  remember:
    - text: |
        **Pot legs:** the two **outer legs** go to **3V** and **GND**. The **wiper** (middle leg)
        goes to **P2**. Never wire the wiper to 3V or GND.
      visual:
        type: part
        part: potentiometer
        labels: {left: "3V", wiper: "wiper → P2", right: "GND"}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
      - [mb.3V, pot1.left]
      - [mb.P2, pot1.wiper]
      - [mb.GND, pot1.right]
    not_connected:
      - [led1.anode, led1.cathode]
      - [pot1.wiper, mb.3V]
      - [pot1.wiper, mb.GND]
      - [pot1.left, pot1.right]
code:
  intro: >-
    Turn the knob: the LED dims and brightens, and a bar graph rises and falls
    on the display.
  starter: |
    from microbit import *

    while True:
        value = pin2.read_analog()      # 0 to 1023
        pin0.write_analog(value)        # knob = LED brightness

        bars = value * 6 // 1024        # scale 0-1023 down to 0-5

        for row in range(5):            # row 0 is the bottom
            if row < bars:
                brightness = 9
            else:
                brightness = 0
            for x in range(5):
                display.set_pixel(x, 4 - row, brightness)

        sleep(50)
  predict: {"question": "The knob is near the middle, at 512. How many rows light up?", "choices": ["1", "3", "5"], "answer": 1, "explain": "512 × 6 // 1024 is 3."}
  walkthrough:
    - lines: "4-5"
      explain: Reads the knob (0-1023). write_analog also uses 0-1023, so it goes straight to the LED.
    - lines: "7"
      explain: "**Scaling.** 6 bar heights (0 to 5): times 6, integer-divide by 1024. Always a whole number."
    - lines: "9-13"
      explain: Row 0 is the bottom. If `row < bars`, that row lights up (9). Otherwise it's dark (0).
    - lines: "14-15"
      explain: A loop **inside** a loop lights the whole row. `4 - row` puts row 0 at the bottom.
  remember:
    - text: |
        **Drawing a bar graph:** `range(5)` with one number counts **0, 1, 2, 3, 4**. The outer loop goes
        through the 5 rows, and each row lights up if it's **part of the bar**. A second loop **inside** it
        lights all 5 LEDs across that row. Bigger number = taller bar.
      visual:
        type: leds
        frames: ["00000:00000:00000:00000:99999", "00000:00000:99999:99999:99999", "99999:99999:99999:99999:99999"]
        caption: "bars = 1, then 3, then 5"
  try_it:
    - Which way makes the bar go up? Swap the red and black pot wires. What changes?
    - Show the knob as a single digit with display.show(value * 10 // 1024) instead.
    - Make the LED do the opposite of the bar. Hint - 1023 - value.
practice:
  level: "write"
  prompt: "Write the scaling line. Turn the knob reading into one digit from 0 to 9, then show it."
  starter: "from microbit import *\n\nwhile True:\n    value = pin2.read_analog()\n    # make digit: scale value down to 0-9\n    # show digit\n    sleep(50)\n"
  solution: "from microbit import *\n\nwhile True:\n    value = pin2.read_analog()\n    digit = value * 10 // 1024\n    display.show(digit)\n    sleep(50)\n"
  hints: ["There are 10 digits from 0 to 9.", "Use the same pattern as bars = value * 6 // 1024."]
  checks:
    - {"type": "syntax"}
    - {"type": "contains", "pattern": "value\\s*\\*\\s*10\\s*//\\s*1024", "message": "Multiply by how many digits there are, then // by 1024."}
    - {"type": "contains", "pattern": "display\\.show\\(", "message": "Show your digit on the display."}
debug:
  story: >-
    Riley wants a row of lights that grows as the knob turns. Instead the
    micro:bit scrolls an error about a **float**, and the knob does nothing.
    There are **two** bugs. Fix them and press **Check my fix**.
  buggy_code: |
    from microbit import *

    while True:
        value = pin1.read_analog()
        bars = value * 6 / 1024
        display.clear()
        for x in range(bars):
            display.set_pixel(x, 2, 9)
        sleep(50)
  hints:
    - Check the circuit. Which pin is the knob's middle leg wired to?
    - range() needs a whole number. Which kind of division always gives a whole number?
  checks:
    - {type: syntax}
    - {type: contains, pattern: "pin2\\.read_analog\\(\\s*\\)", message: "The knob's wiper is wired to P2 - read it with pin2.read_analog()."}
    - {type: not_contains, pattern: "pin1\\.", message: "Nothing is plugged into pin 1 in this circuit."}
    - {type: contains, pattern: "//|int\\(", message: "range() can't use a decimal number. Use integer division // to get a whole number."}
  solution: |
    from microbit import *

    while True:
        value = pin2.read_analog()
        bars = value * 6 // 1024
        display.clear()
        for x in range(bars):
            display.set_pixel(x, 2, 9)
        sleep(50)
  reflection_prompt: What's the difference between / and // in Python, and why did it matter here?
quiz:
  - question: What is 17 // 5 in Python?
    choices:
      - "3.4"
      - "3"
      - "4"
      - "2"
    answer: 1
    explain: Integer division drops the remainder. 5 goes into 17 three whole times.
  - question: The knob reads 512. What is 512 * 6 // 1024?
    choices:
      - "3"
      - "2"
      - "6"
      - "512"
    answer: 0
    explain: 512 × 6 = 3072, and 3072 // 1024 = 3. Halfway on the knob = 3 bars.
  - question: Which leg of the potentiometer goes to the micro:bit pin?
    choices:
      - The left leg
      - The middle leg (wiper)
      - The right leg
      - Any leg
    answer: 1
    explain: The outer legs go to 3V and GND. The wiper in the middle is the one whose voltage changes.
  - question: Which line lights the LED shown in the bottom-left corner?
    visual:
      type: leds
      image: "00000:00000:00000:00000:90000"
    choices:
      - set_pixel(0, 0, 9)
      - set_pixel(4, 4, 9)
      - set_pixel(0, 4, 9)
      - set_pixel(4, 0, 9)
    answer: 2
    explain: x = 0 is the left column and y = 4 is the bottom row (y counts down from the top).
  - question: Why can the knob reading go straight into pin0.write_analog(value) without scaling?
    choices:
      - Both use the same range, 0 to 1023
      - write_analog scales numbers itself
      - The LED ignores big numbers
    answer: 0
    explain: read_analog gives 0-1023 and write_analog takes 0-1023, so they already match.
  - {"question": "What numbers does `range(4)` make?", "choices": ["1, 2, 3, 4", "0, 1, 2, 3", "0, 1, 2, 3, 4"], "answer": 1, "explain": "With one number, it starts at 0 and stops before that number."}
  - {"question": "From Lesson 7: what is a threshold?", "choices": ["A cut-off number", "A type of resistor", "A kind of loop"], "answer": 0, "explain": "Readings on each side of it trigger different actions."}
challenge:
  title: Knob-Controlled Gadget
  prompt: >-
    Use the knob to control something fun: a volume meter, a game controller, a
    mood dial, or a timer. Turning the knob should change what happens.
  levels:
    - "Bronze: Make the knob pick a picture. Scale it to 0-3 and show a different Image for each number."
    - "Silver: Make the knob set the LED's blink speed. Scale 0-1023 to a sleep time from 50 to 1000 ms."
    - "Gold: Paddle game! The knob moves a dot along the bottom row to catch a falling pixel. Keep score!"
  hints:
    Bronze:
      - "Scale it with `pick = value * 4 // 1024`. That gives 0, 1, 2 or 3."
      - "Use `if pick == 0:`, then `elif` for the other numbers. Show a different `Image` in each."
    Silver:
      - "The range is 950 wide. Try `wait = 50 + value * 950 // 1023`."
      - "Then blink: pin on, `sleep(wait)`, pin off, `sleep(wait)`. Use `write_digital` for this."
    Gold:
      - "Find the paddle spot with `x = value * 5 // 1024`. Light it with `display.set_pixel(x, 4, 9)`."
      - "Track the falling pixel with `fx` and `fy`. When `fy == 4`, compare `fx` with `x`."
      - "Call `display.clear()` at the start of each frame, or old dots stay lit."
  visual:
    type: leds
    image: "00900:00000:00000:00000:09000"
    caption: "Gold idea: move your paddle to catch the falling pixel."
  submit_prompt: What does your knob control, and what scaling math did you use to turn 0-1023 into the numbers you needed?
teacher_notes: |
  * **Reading stuck at 0 or 1023:** the wiper wire is on an outer leg, or one outer leg isn't connected
    (check T+24 → a24 and a26 → T-26).
  * **Reading jumps around randomly:** the P2 wire isn't in the wiper's column (25), so P2 is floating.
  * **Pot feels loose / readings flicker:** many pots don't sit snugly in a breadboard. Press it in firmly or
    use a pot with breadboard pins. Some have legs 0.2" apart - use e24, e26, e28 and shift the wires.
  * **"can't convert float to int":** a single `/` was used before `range()`. Use `//`.
  * The bar may never quite reach 5 if the pot tops out around 1015 - that's normal. `value * 6 // 1024` still
    reaches 5 for any reading of 854 or more.
  * Nested loops are new for many students - trace the bar code on the board for bars = 2 before running it.
  * Extension: write a reusable function `def scale(value, new_max): return value * (new_max + 1) // 1024`.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CT.d.4
    how: Variables, expressions (value * 6 // 1024), loops and conditionals together turn a knob reading into a bar graph.
  - code: 6-8.CT.b.2
    how: Predict the scaled value and the bar graph for different knob positions.
  - code: 6-8.CT.b.5
    how: Scaling 0-1023 down to 0-5 with integer division keeps the result inside the display's rows.
  - code: 6-8.CS.a.4
    how: A knob (sensor input) sets an LED's brightness (actuator output).
