id: dimmer-pwm
unit: 1
order: 5
title: Dimmer Switch with PWM
subtitle: Fade an LED up and down with write_analog and for loops
duration_minutes: 35
level: Beginner
big_idea: >-
  A pin can only be on or off, but by flicking it on and off super fast we can
  make an LED look any brightness we want.
objectives:
  - Explain PWM as switching a pin on and off fast
  - Set LED brightness with write_analog (0 to 1023)
  - Count up and down with for loops and range()
  - Make an LED fade up and down forever
vocabulary:
  - term: PWM (Pulse Width Modulation)
    definition: Turning a pin on and off so fast that your eye only sees the average - a dimmer light.
  - term: Duty cycle
    definition: The fraction of time the pin is ON. 50% duty cycle looks about half bright.
  - term: write_analog
    definition: A micro:bit command that makes PWM on a pin. 0 = always off, 1023 = always on.
  - term: for loop
    definition: A loop that runs once for every number (or item) in a list, like every number from range().
  - term: range(start, stop, step)
    definition: Makes the numbers start, start+step, ... and stops BEFORE it reaches stop.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 3 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 3}
  - {key: learn, name: Learn, minutes: 6}
  - {key: circuit, name: Build the circuit, minutes: 6}
  - {key: code, name: Code it, minutes: 8}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 2}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: How PWM dims an LED
  note: Watch the slow-motion part where the LED is really blinking on and off.
warmup:
  prompt: >-
    A light switch is only ON or OFF. But a dimmer knob lets you pick
    "a little bit on." How could a dimmer work if a pin can only be on or off?
learn:
  - text: |
      ### On, off... and in between?
      `write_digital` only knows **1** (on) and **0** (off).

      But what if you blink an LED **so fast** your eyes can't keep up? Your brain sees the **average**.

      * On half the time looks **half bright**.
      * On a tenth of the time looks **dim**.

      This trick is called **PWM** (Pulse Width Modulation).
    visual:
      type: wave
      duty: [10, 50, 100]
      caption: "Same 3 volts when on. More on-time looks brighter."
  - text: |
      ### write_analog: 0 to 1023
      `pin0.write_analog(n)` makes PWM on pin 0.

      * **0** is always off.
      * **512** is on about half the time.
      * **1023** is always on: full brightness.

      The fraction of time the pin is on is the **duty cycle**. The micro:bit does the fast blinking for you!
    visual:
      type: wave
      duty: [0, 25, 50, 100]
      values: [0, 256, 512, 1023]
  - text: |
      ### for loops and range()
      A **for loop** runs once for each number.

      ```python
      for n in range(0, 10, 2):
          display.scroll(n)
      ```

      `range(start, stop, step)` starts at 0 and adds 2 each time. It **stops before** `stop`, so 10 is never shown!
    visual:
      type: flow
      caption: "range(0, 10, 2) makes 0, 2, 4, 6, 8. No 10!"
      steps:
        - {icon: "0️⃣", label: "n = 0"}
        - {icon: "2️⃣", label: "n = 2"}
        - {icon: "4️⃣", label: "n = 4"}
        - {icon: "6️⃣", label: "n = 6"}
        - {icon: "8️⃣", label: "n = 8"}
  - text: |
      ### Counting down
      To count **down**, use a **negative step**.

      `range(10, 0, -2)` gives 10, 8, 6, 4, 2.

      It still **stops before** the stop number, so 0 is never reached.
    visual:
      type: scale
      min: 0
      max: 10
      caption: "range(10, 0, -2) steps down by 2 and stops before 0."
      marks:
        - {at: 0, label: "0 (stop)"}
        - {at: 2, label: "2", pointer: true}
        - {at: 4, label: "4", pointer: true}
        - {at: 6, label: "6", pointer: true}
        - {at: 8, label: "8", pointer: true}
        - {at: 10, label: "10 (start)", pointer: true}
  - text: |
      ### Putting it together: a fade
      * Count **up** from 0 to 1023. Give each number to `write_analog`. The LED gets a tiny bit brighter each time.
      * Then count back **down**.

      That's a **fade**, like the "breathing" light on a sleeping laptop.
    visual:
      type: flow
      loop: true
      loop_label: repeat forever
      steps:
        - {icon: "🌑", label: "start at 0 (off)"}
        - {icon: "📈", label: "count up, get brighter"}
        - {icon: "🌕", label: "1023 (full)"}
        - {icon: "📉", label: "count down, get dimmer"}
  - text: |
      ### Why 1023? Counting in binary
      Computers store numbers in **binary**, using only **0s and 1s**. Each digit is a **bit**.

      * Every extra bit **doubles** how many numbers you can make.
      * 8 bits make 256 numbers (0 to 255).
      * 10 bits make 1024 numbers: **0 to 1023**.

      `write_analog` uses **10 bits**. All ten bits on = 1023.
    visual:
      type: bits
      value: 1023
      bits: 10
      caption: "1023 in binary is 1111111111: all ten bits on."
  - text: |
      ### One number, three ways
      Programmers can write the same number in different **bases** (ways of counting).

      * **Binary** is base 2.
      * **Hexadecimal** (hex) is base 16.

      Try `display.scroll(bin(1023))` and `display.scroll(hex(1023))`.
    visual:
      type: compare
      caption: "Python shows binary as 0b1111111111 and hex as 0x3ff."
      items:
        - {icon: "🔟", title: "Base 10", text: "1023"}
        - {icon: "💻", title: "Binary (base 2)", text: "1111111111"}
        - {icon: "🔣", title: "Hex (base 16)", text: "0x3ff"}
circuit:
  intro: >-
    It's the same LED circuit as Lesson 3: P0 → resistor → LED → GND. If it's
    still on your board, just check it against these steps. Unplug the USB
    cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect 3V straight to GND with a wire - that's a short circuit.
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to the top **blue (–)
        rail** at **T-1**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Resistor and LED
      instruction: >-
        Put the 220 Ω resistor from **c10** to **c14**. Put the LED's **long leg
        (+)** in **e14** and its **short leg (–)** in **e15**.
      check: Is the LED's long leg in column 14, next to the resistor?
      tip: The flat edge on the LED's rim marks the short leg (–).
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
        - {type: led, id: led1, anode: e14, cathode: e15, color: red}
    - title: Connect to pin 0 and ground
      instruction: >-
        Add a **yellow** wire from **P0** to **a10**. Add a **black** wire from
        **a15** to the **blue (–) rail** at **T-15**.
      check: Is the loop (P0, resistor, LED, ground) complete?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
code:
  intro: >-
    This program fades the LED up, then back down, forever - a "breathing"
    light.
  starter: |
    from microbit import *

    step = 8      # bigger step = faster fade
    wait = 5      # milliseconds at each brightness

    while True:
        for brightness in range(0, 1024, step):      # fade up
            pin0.write_analog(brightness)
            sleep(wait)
        for brightness in range(1023, -1, -step):    # fade down
            pin0.write_analog(brightness)
            sleep(wait)
  walkthrough:
    - lines: "3-4"
      explain: Two **variables** control the speed. Change them once and the whole fade changes.
    - lines: "6"
      explain: "`while True:` repeats the fade up + fade down forever."
    - lines: "7-9"
      explain: >-
        Counts 0, 8, 16 ... up to 1016, setting each brightness. The stop is
        1024 because range stops *before* it.
    - lines: "10-12"
      explain: >-
        Counts **down** from 1023 with a **negative step** (`-step`). The stop
        is **-1**, so it gets close to 0.
  try_it:
    - Change step to 1, then to 64. What happens to the fade?
    - Make the LED fade up slowly but drop down fast (use two different waits).
    - Try pin0.write_analog(50) on its own. How dim can you go before it looks off?
debug:
  story: >-
    Alex wants a breathing light. First the micro:bit stops with an error
    about the value. After that's fixed, the LED never fades down. It just
    jumps from bright to dark. Find the **two** bugs, then press **Check my fix**.
  buggy_code: |
    from microbit import *

    while True:
        for brightness in range(0, 1024, 8):
            pin0.write_digital(brightness)
            sleep(5)
        for brightness in range(1023, 0, 8):
            pin0.write_analog(brightness)
            sleep(5)
  hints:
    - write_digital only understands 0 and 1. Which command understands 0 to 1023?
    - Starting at 1023 and adding 8 each time... will you ever get down to 0? How do you count backwards with range?
  checks:
    - {type: syntax}
    - {type: not_contains, pattern: "write_digital\\(", message: "write_digital only knows 0 or 1. Use write_analog for brightness levels."}
    - {type: contains, pattern: "pin0\\.write_analog\\(", message: "Set the brightness with pin0.write_analog()."}
    - {type: not_contains, pattern: "range\\(\\s*10\\d\\d\\s*,\\s*-?\\d+\\s*,\\s*(?!-)[\\w+]+\\s*\\)", message: "To count DOWN, range needs a negative step, like range(1023, -1, -8)."}
  solution: |
    from microbit import *

    while True:
        for brightness in range(0, 1024, 8):
            pin0.write_analog(brightness)
            sleep(5)
        for brightness in range(1023, -1, -8):
            pin0.write_analog(brightness)
            sleep(5)
  reflection_prompt: Why did range(1023, 0, 8) never run at all? What did you change to fix it?
quiz:
  - question: What does pin0.write_analog(512) do to the LED?
    visual:
      type: scale
      min: 0
      max: 1023
      marks:
        - {at: 0, label: "0"}
        - {at: 512, label: "512", pointer: true}
        - {at: 1023, label: "1023"}
    choices:
      - Turns it fully on
      - Makes it about half as bright
      - Turns it off
      - Makes it blink once every 512 ms
    answer: 1
    explain: 512 is about half of 1023, so the pin is on about 50% of the time - it looks about half bright.
  - question: Which numbers does range(0, 10, 3) make?
    choices:
      - 0, 3, 6, 9
      - 0, 3, 6, 9, 10
      - 3, 6, 9
      - 0, 3, 6
    answer: 0
    explain: Start at 0, add 3 each time, and stop before reaching 10.
  - question: How do you count down from 10 to 1?
    choices:
      - range(10, 1)
      - range(10, 0, 1)
      - range(10, 0, -1)
      - range(1, 10, -1)
    answer: 2
    explain: Counting down needs a negative step, and the stop (0) is never reached, so the last number is 1.
  - question: Why does a PWM LED look dim instead of blinking?
    choices:
      - The resistor gets hotter
      - It blinks too fast; your eyes see the average
      - The pin sends out less voltage
    answer: 1
    explain: The pin is still only on (3 V) or off (0 V), but switching very fast makes your brain see an in-between brightness.
  - question: What number makes write_analog fully ON?
    choices:
      - "1"
      - "100"
      - "1023"
      - "9"
    answer: 2
    explain: write_analog goes from 0 (always off) to 1023 (always on).
  - question: Why is the biggest write_analog value 1023?
    visual:
      type: bits
      value: 1023
      bits: 10
    choices:
      - "10 bits make 1024 numbers: 0 to 1023"
      - The pin can send up to 1023 volts
      - The number was picked at random
      - The LED has 1023 tiny lights inside
    answer: 0
    explain: 2 × 2 × 2 … ten times is 1024, so 10 bits count from 0 to 1023. In binary, 1023 is 1111111111.
challenge:
  title: Mood Lighting
  prompt: >-
    Design a light show for your LED. Make it calm, creepy or exciting! Use
    for loops and write_analog to make a pattern nobody else has.
  levels:
    - "Mild: Make a heartbeat. Do two quick fades up and down, then pause."
    - "Medium: Make a candle flicker. Use random.randint to pick a new brightness every few ms."
    - "Spicy: Use button A to switch light modes, like fade, flicker and strobe. Show the mode number: 1, 2 or 3."
  submit_prompt: Describe your light show and explain how your for loop or random numbers change the brightness.
teacher_notes: |
  * **"value must be 0 or 1" error:** a student used `write_digital` with a brightness number.
  * **LED only gets brighter, then snaps off:** the count-down `range` has a positive step, so it runs zero times.
    Have students print the range: `display.scroll(str(list(range(10, 0, 2))))` shows `[]`.
  * **Slight flicker at low brightness:** the default PWM period is 20 ms. Students can add
    `pin0.set_analog_period(1)` before the loop for a smoother fade (optional).
  * **No light at all:** check the LED direction first, then move the yellow wire to 3V to test the LED.
  * Our eyes don't see brightness in a straight line: the change from 0 to 100 looks bigger than 900 to 1023.
    Curious students can try squaring the number (`b * b // 1023`) for a smoother-looking fade.
  * Early finishers: `import random` for the candle challenge; `random.randint(200, 1023)`.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CT.b.1
    how: for loops with range() count up and down to fade an LED, nested inside a forever loop.
  - code: 6-8.CT.b.5
    how: write_analog only accepts 0-1023, and range() stops before its stop value, so students reason about the end points.
  - code: 6-8.CT.b.2
    how: Predict how changing the step size or the wait changes the speed and smoothness of the fade.
  - code: 6-8.CS.a.4
    how: PWM is how a digital controller makes an output look like it's in between on and off.
  - code: 6-8.CT.c.1
    how: "A Learn card shows the same number in base 10, binary (1023 = 1111111111) and hexadecimal (0x3ff), and students use bin() and hex()."
  - code: 6-8.CT.c.2
    how: "Students see why write_analog stops at 1023: the micro:bit stores it as a 10-bit binary integer."
