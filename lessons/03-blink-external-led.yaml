id: blink-external-led
unit: 1
order: 3
title: Blink an External LED
subtitle: Wire an LED to pin 0 and make it blink with Python
duration_minutes: 35
level: Beginner
big_idea: >-
  A micro:bit pin is a switch your code controls: write 1 to send 3 volts out
  of the pin, write 0 to turn it off.
objectives:
  - Build an LED circuit on a breadboard controlled by pin 0
  - Use pin0.write_digital() to turn an output on and off
  - Use a while True loop and sleep() to make a repeating pattern
  - Store timing in a variable so it is easy to change
vocabulary:
  - term: Digital output
    definition: A pin that is either fully ON (1, about 3 volts) or fully OFF (0, 0 volts).
  - term: Breadboard
    definition: A board with hidden metal strips that connect parts without soldering.
  - term: Current-limiting resistor
    definition: A resistor in series with an LED so too much current can't flow and burn it out.
  - term: Variable
    definition: A name that stores a value, like delay = 500.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 2-3 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 3}
  - {key: learn, name: Learn, minutes: 4}
  - {key: circuit, name: Build the circuit, minutes: 9}
  - {key: code, name: Code it, minutes: 7}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 2}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Blinking an external LED
  note: Watch how the long leg of the LED goes toward pin 0.
warmup:
  prompt: >-
    Last time you lit an LED straight from the 3V pin. It stayed on all the time.
    What would you need to change so a program could turn it on and off?
learn:
  - |
    ### Pins are switches
    The gold strips along the bottom of the micro:bit are **pins**. When your
    code runs `pin0.write_digital(1)`, pin 0 connects to about **3 volts**.
    When it runs `pin0.write_digital(0)`, pin 0 drops to **0 volts**.

    So instead of wiring the LED to **3V** (always on), we wire it to **P0**
    (on only when the code says so).
  - |
    ### The breadboard's secret wiring
    Inside a breadboard, the five holes **a–e** in one numbered column are
    connected. So are **f–j**. The long rails marked **+** and **–** run the
    whole length of the board. Two legs in the *same* column are connected;
    legs in *different* columns are not.
  - |
    ### The path of the electricity
    **P0 → resistor → LED long leg (+) → LED short leg (–) → GND.**
    Electricity needs a complete loop back to GND. If the loop has a gap, nothing lights.
circuit:
  intro: >-
    You'll build the loop P0 → resistor → LED → GND. Unplug the USB cable
    while you build, then plug it back in to test.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect 3V straight to GND with a wire - that's a short circuit.
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to the top **blue (–)
        rail**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Resistor
      instruction: >-
        Put the 220 Ω resistor in row **c**, from column **10** to column **14**.
        Resistors have no direction - either way works.
      check: Does the resistor jump across several columns (not both legs in one)?
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
    - title: LED
      instruction: >-
        Put the LED's **long leg (+, anode)** in **e14**, the same column as the
        resistor's right leg. Put the **short leg (–, cathode)** in **e15**.
      check: Is the long leg in column 14 and the short leg in column 15?
      tip: The cathode side of the LED's rim is flat. Flat = minus.
      add:
        - {type: led, id: led1, anode: e14, cathode: e15, color: red}
    - title: Connect to pin 0 and ground
      instruction: >-
        Add a **yellow** wire from **P0** to **a10** (the resistor's column).
        Add a **black** wire from **a15** (the LED's short-leg column) to the
        **blue (–) rail**.
      check: Trace the loop with your finger - P0, resistor, LED, ground. Is it complete?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
code:
  intro: >-
    This program turns pin 0 on, waits, turns it off, waits - forever.
  starter: |
    from microbit import *

    delay = 500   # milliseconds (1000 ms = 1 second)

    while True:
        pin0.write_digital(1)   # LED on
        sleep(delay)
        pin0.write_digital(0)   # LED off
        sleep(delay)
  walkthrough:
    - lines: "1"
      explain: Loads the micro:bit library so Python knows about pin0, sleep and display.
    - lines: "3"
      explain: A **variable** called delay holds 500. Change it once and the whole blink changes.
    - lines: "5"
      explain: "`while True:` repeats the indented lines forever."
    - lines: "6-9"
      explain: On, wait, off, wait. Both waits matter - try deleting one and see what happens.
  try_it:
    - Change delay to 100. Then 2000. What changes?
    - Make the LED stay on for a long time and off for a short time (use two different numbers).
    - Add display.show(Image.HEART) before the loop.
debug:
  story: >-
    Jordan's LED is supposed to blink, but it just stays on. There are **two**
    bugs. Find them, fix them, and press **Check my fix**.
  buggy_code: |
    from microbit import *

    while True:
        pin0.write_digital(1)
        Sleep(500)
        pin0.write_digital(0)
  hints:
    - Python is case-sensitive. Is every word spelled exactly right?
    - After the LED turns off, how long does it stay off before the loop turns it back on?
  checks:
    - {type: syntax}
    - {type: not_contains, pattern: "Sleep\\(", message: "Python is case-sensitive: sleep must be lowercase."}
    - {type: contains, pattern: "write_digital\\(1\\)\\s*\\n\\s*sleep\\(\\s*\\w+\\s*\\)", message: "Wait after turning the LED on."}
    - {type: contains, pattern: "write_digital\\(0\\)\\s*\\n\\s*sleep\\(\\s*\\w+\\s*\\)", message: "Wait after turning the LED off too - otherwise it's only off for a microsecond."}
  solution: |
    from microbit import *

    while True:
        pin0.write_digital(1)
        sleep(500)
        pin0.write_digital(0)
        sleep(500)
  reflection_prompt: Why did the LED look like it was always on, even though the code turned it off?
quiz:
  - question: What does pin0.write_digital(1) do?
    choices:
      - Reads a button on pin 0
      - Sends about 3 volts out of pin 0
      - Makes pin 0 1% brighter
      - Waits 1 second
    answer: 1
    explain: Digital 1 means ON - the pin is connected to about 3 V.
  - question: Which LED leg connects toward pin 0 (through the resistor)?
    choices:
      - The short leg (cathode)
      - The long leg (anode)
      - Either one
    answer: 1
    explain: Current flows into the long leg (+) and out the short leg (–) to GND. LEDs only work one way.
  - question: Two legs are in holes a12 and d12. Are they connected?
    choices:
      - Yes - a through e in one column are connected
      - No - they're in different rows
    answer: 0
    explain: The five holes a-e in a numbered column share one metal strip.
  - question: What is the resistor for?
    choices:
      - It makes the LED blink
      - It limits the current so the LED isn't damaged
      - It stores electricity
    answer: 1
    explain: Without it, too much current could flow through the LED and the pin.
challenge:
  title: Secret Signal
  prompt: >-
    Use your blinking LED to send a message. Invent a code - or use Morse code -
    and program the LED to flash a word. Can a partner decode it?
  levels:
    - "Mild: Flash an SOS: 3 short, 3 long, 3 short."
    - "Medium: Use variables `dot` and `dash` for the times and spell your initials."
    - "Spicy: Add a second LED on pin 1 that lights between letters, or make button A start the message."
  submit_prompt: What message did your LED send, and how does your code make dots and dashes?
teacher_notes: |
  * The most common problem is a backwards LED. Have students swap the legs before anything else.
  * If nothing lights, test the LED by moving the yellow wire from P0 to 3V. If it lights now, it's a code problem.
  * Early finishers: introduce `for i in range(3):` for the SOS challenge.
