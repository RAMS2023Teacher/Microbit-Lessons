id: temperature-data
unit: 2
order: 9
title: Temperature Data Detective
subtitle: Collect temperature readings in a list, find the high, low and average, and warn when it's too hot
duration_minutes: 35
level: Intermediate
big_idea: >-
  A list lets your program remember many readings, so it can find patterns
  like the highest, lowest and average temperature - and react when something
  goes wrong.
objectives:
  - Read the temperature with temperature()
  - Store readings in a list with append()
  - Find the low, high and average of a list
  - Light a warning LED when it gets too hot
vocabulary:
  - term: List
    definition: One variable that holds many values in order, like readings = [21, 22, 22, 23].
  - term: append
    definition: Adds a new value to the end of a list, like readings.append(24).
  - term: Average (mean)
    definition: Add up all the values and divide by how many there are.
  - term: Threshold
    definition: A cut-off number. Above it, the program does one thing; below it, something else.
  - term: Data logging
    definition: Saving readings over time so you can look at them later, like a weather station.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 red LED
  - 1 resistor, 220 Ω (red-red-brown)
  - 3 jumper wires
  - Optional - a cup of cool water in a sealed zip bag, or a warm hand, to change the temperature
agenda:
  - {key: warmup, name: Warm-up, minutes: 3}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Build the warning light, minutes: 6}
  - {key: code, name: Code it, minutes: 9}
  - {key: debug, name: Debug, minutes: 5}
  - {key: quiz, name: Check for understanding, minutes: 2}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Lists and temperature data on the micro:bit
  note: Watch how the list gets one number longer every time a new reading is added.
warmup:
  prompt: >-
    A weather reporter says "Today's high was 24 and the low was 15." How do
    you think they know that? What would a machine need to remember to figure it out?
learn:
  - text: |
      ### The micro:bit has a thermometer
      `temperature()` gives the temperature in **degrees Celsius**, as a whole number like `22`.

      The sensor is inside the main **processor chip**. The chip makes a little heat while it works. So it often reads a degree or two **warmer** than the room.
    visual:
      type: compare
      items:
        - {icon: "🏠", title: "Room: 21 °C", text: "The air around you"}
        - {icon: "🔲", title: "temperature(): 22 °C", text: "The chip, a little warmer"}
  - text: |
      ### Try it: warm it up
      Show the temperature: `display.scroll(temperature())`

      Then put your thumb on the back of the micro:bit for **30 seconds**. Try again. Did the number go up?
    visual:
      type: graph
      points: [22, 22, 22, 23, 23, 23, 24]
      x_label: "seconds of thumb warmth →"
      y_label: "°C"
      min: 20
      max: 26
      caption: "A warm thumb raises the reading slowly."
  - text: |
      ### Lists remember many values
      A normal variable holds **one** value. A **list** holds lots of them, in order.

      ```python
      readings = []          # an empty list
      readings.append(21)    # now [21]
      readings.append(23)    # now [21, 23]
      len(readings)          # 2 - how many are in the list
      ```

      Square brackets `[ ]` make a list. `.append()` adds to the **end**.
    visual:
      type: flow
      steps:
        - {icon: "📭", label: "readings = []"}
        - {icon: "➕", label: "append(21) → [21]"}
        - {icon: "➕", label: "append(23) → [21, 23]"}
  - text: |
      ### Python's data tools
      Once your readings are in a list, Python can sum them up for you:

      * `min(readings)`: the **lowest** value
      * `max(readings)`: the **highest** value
      * `sum(readings) / len(readings)`: the **average**
    visual:
      type: graph
      points: [21, 22, 22, 23, 24, 23, 22]
      y_label: "°C"
      min: 20
      max: 25
      caption: "Here min is 21, max is 24, and the average is about 22.4."
  - text: |
      ### Keep only the newest 30
      The micro:bit has **limited memory**. So we keep only the **newest 30** readings.

      Each item has a **position**, starting at **0**. `readings[0]` is the first one.

      `readings.pop(0)` removes the **oldest**, at the front of the list.
    visual:
      type: flow
      steps:
        - {icon: "➕", label: "append: new one at end"}
        - {icon: "🔢", label: "more than 30?"}
        - {icon: "🗑️", label: "pop(0): drop the oldest"}
  - text: |
      ### A warning light with a threshold
      A **threshold** is a cut-off.

      * Temperature **at or above** `HOT`? Turn the red LED on pin 0 **on**.
      * Otherwise, turn it **off**.

      That's just `if` / `else` with `pin0.write_digital()`. You already know this!
    visual:
      type: graph
      points: [24, 25, 25, 26, 27, 29, 30, 29, 27, 26]
      line: {y: 28, label: "HOT = 28"}
      y_label: "°C"
      caption: "Red dots are above HOT, so the warning LED is on."
  - text: |
      ### Bonus: save your data with `log`
      The micro:bit V2 can **save readings**, even after you unplug it. Each `log.add()` adds a row to a table.

      ```python
      import log
      log.set_labels('temp', timestamp=log.SECONDS)
      log.add(temp=temperature())
      ```

      Plug it into a computer. Open the **MICROBIT** drive. Double-click **MY_DATA.HTM** to see a table and a chart.
    visual:
      type: flow
      steps:
        - {icon: "💾", label: "log.add() saves a row"}
        - {icon: "🔌", label: "Unplug: data stays"}
        - {icon: "📊", label: "Open MY_DATA.HTM"}
circuit:
  intro: >-
    This is the same LED circuit you built before: P0 → resistor → LED → GND.
    This time it becomes a "too hot" alarm light. Unplug the USB cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect 3V straight to GND with a wire - that's a short circuit.
    - Don't heat the micro:bit with a hair dryer, lighter or hot water. A warm hand is enough!
  steps:
    - title: Ground rail
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from the breakout's **GND** pin to hole **T-1** on the top
        **blue (–) rail**.
      check: Is your black wire in the rail with the blue line next to it?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
    - title: Resistor
      instruction: >-
        Put the 220 Ω resistor in row **c**, from **c10** to **c14**.
        Resistors have no direction - either way works.
      check: Is one leg in column 10 and the other in column 14?
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
    - title: Warning LED
      instruction: >-
        Put the red LED's **long leg (+, anode)** in **e14**, the same column as
        the resistor's right leg. Put the **short leg (–, cathode)** in **e15**.
      check: Is the long leg in column 14 and the short leg in column 15?
      tip: The flat edge on the LED's rim is the cathode (–) side.
      add:
        - {type: led, id: led1, anode: e14, cathode: e15, color: red}
    - title: Connect pin 0 and ground
      instruction: >-
        Add a **yellow** wire from **P0** to **a10** (the resistor's left column).
        Add a **black** wire from **a15** (the LED's short-leg column) to **T-15**
        on the blue (–) rail.
      check: Trace the loop with your finger - P0, resistor, LED, ground. Is it complete?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
      - [mb.P0, mb.GND]
code:
  intro: >-
    This program takes a reading every second and adds it to a list. The LED
    warns you when it's too hot. Press **A** for the low and high, and **B** for the average.
  starter: |
    from microbit import *

    HOT = 28          # degrees C - change this to fit your room
    readings = []     # start with an empty list

    while True:
        t = temperature()
        readings.append(t)
        if len(readings) > 30:
            readings.pop(0)     # forget the oldest reading

        if t >= HOT:
            pin0.write_digital(1)       # too hot - warning light on
            display.show(Image.SAD)
        else:
            pin0.write_digital(0)
            display.show(Image.HAPPY)

        if button_a.was_pressed():
            display.scroll("Lo " + str(min(readings)))
            display.scroll("Hi " + str(max(readings)))
        if button_b.was_pressed():
            average = sum(readings) / len(readings)
            display.scroll("Avg " + str(round(average, 1)))

        sleep(1000)
  walkthrough:
    - lines: "3-4"
      explain: "`HOT` is your **threshold**. `[]` makes an **empty list**, once, before the loop."
    - lines: "7-10"
      explain: Read the temperature and add it to the end. Over 30 readings? `pop(0)` drops the oldest.
    - lines: "12-17"
      explain: "`if` / `else` with the threshold: the LED and the face show if it's too hot."
    - lines: "19-24"
      explain: "`min()` and `max()` give Lo and Hi. The average is the total divided by how many."
  try_it:
    - Set HOT one degree above the room's temperature. Warm the micro:bit in your hand until the LED turns on.
    - Press A right away, then again after warming it. How do Lo and Hi change?
    - "When A and B are both pressed (`button_a.is_pressed() and button_b.is_pressed()`), clear the list with `readings = []`."
debug:
  story: >-
    Priya's temperature tracker crashes with an error. Even once it runs, the
    low and the high are always the **same number**. There are **two** bugs.
    Fix them and press **Check my fix**.
  buggy_code: |
    from microbit import *

    HOT = 28

    while True:
        readings = []
        t = temperature()
        readings.add(t)

        if t >= HOT:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)

        if button_a.was_pressed():
            display.scroll(min(readings))
            display.scroll(max(readings))
        sleep(1000)
  hints:
    - Lists don't have an `.add()` - what's the word for adding something to the end of a list?
    - Where is the list created? What happens to it every time the loop starts over?
  checks:
    - {type: syntax}
    - {type: not_contains, pattern: '\.add\(', message: "Lists use .append() to add a value, not .add()."}
    - {type: contains, pattern: 'readings\.append\(', message: "Add each new reading to the list with readings.append(...)."}
    - {type: contains, pattern: '^readings\s*=\s*\[\s*\]', message: "Create the empty list once, before the while loop (not indented)."}
    - {type: not_contains, pattern: '^\s+readings\s*=\s*\[\s*\]', message: "The list is being emptied inside the loop - every reading erases the old ones. Move readings = [] above the loop."}
  solution: |
    from microbit import *

    HOT = 28
    readings = []

    while True:
        t = temperature()
        readings.append(t)

        if t >= HOT:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)

        if button_a.was_pressed():
            display.scroll(min(readings))
            display.scroll(max(readings))
        sleep(1000)
  reflection_prompt: Why did the low and high always match when the list was created inside the loop?
quiz:
  - question: After this code runs, what is in the list? `nums = []` then `nums.append(5)` then `nums.append(8)`
    visual:
      type: flow
      steps:
        - {icon: "📭", label: "nums = []"}
        - {icon: "➕", label: "nums.append(5)"}
        - {icon: "➕", label: "nums.append(8)"}
        - {icon: "❓", label: "nums is now…?"}
    choices:
      - "[8, 5]"
      - "[5, 8]"
      - "[13]"
      - "[]"
    answer: 1
    explain: append() adds each value to the end, so the list grows in order - [5, 8].
  - question: The list is [20, 22, 24]. What does sum(readings) / len(readings) give?
    choices:
      - "66"
      - "3"
      - "22.0"
      - "24"
    answer: 2
    explain: The sum is 66 and there are 3 readings, so the average is 66 / 3 = 22.0.
  - question: Why is the micro:bit's temperature often a little higher than the room?
    choices:
      - The sensor is in the chip, which warms up
      - The LED on pin 0 heats it up
      - Celsius numbers are always higher
    answer: 0
    explain: temperature() reads the chip itself, and chips make a little heat while running.
  - question: What happens if you put readings = [] inside the while True loop?
    choices:
      - Nothing different
      - It's emptied every loop, so it holds one reading
      - The program runs faster and saves more data
    answer: 1
    explain: Every pass through the loop makes a brand-new empty list, wiping out the old readings.
  - question: With HOT = 28, when does `if t >= HOT:` turn the LED on?
    visual:
      type: scale
      min: 24
      max: 32
      marks:
        - {at: 24, label: "24"}
        - {at: 26, label: "26"}
        - {at: 28, label: "HOT = 28", pointer: true}
        - {at: 30, label: "30"}
        - {at: 32, label: "32"}
    choices:
      - Only when t is exactly 28
      - When t is 28 or more
      - When t is less than 28
    answer: 1
    explain: ">= means 'greater than or equal to', so 28, 29, 30... all turn the LED on."
challenge:
  title: Mini Weather Station
  prompt: >-
    Turn your micro:bit into a science instrument! How fast does it warm up in
    your hand, or cool down near a window? Collect the data, then show it off.
  levels:
    - "Bronze: Add a blue or green LED on pin 1 that lights when it's too cold (below a COLD threshold)."
    - "Silver: Use the V2 log module to record the temperature every 5 seconds. Open MY_DATA.HTM and describe the chart."
    - "Gold: Show a live bar graph that grows as it gets warmer. Make the LED blink faster the hotter it gets."
  hints:
    Bronze:
      - "Add `COLD = 20` next to `HOT`. Then test with `if t < COLD:`."
      - "Use `pin1.write_digital()`. Add an `else` that turns it off."
    Silver:
      - "Add `import log` at the top. Call `log.set_labels()` once, before your loop."
      - "Use `sleep(5000)` to wait 5 seconds. Find MY_DATA.HTM on the MICROBIT drive."
    Gold:
      - "Turn temperature into bars with `bars = (t - 20) // 2`. Keep it from 0 to 5."
      - "Hotter means a shorter wait. Try `wait = 1000 - (t - 20) * 30`. Keep it above 50."
  submit_prompt: What experiment did you run, what did your data show, and which list tools (append, min, max, average) did you use?
teacher_notes: |
  **Common problems**
  * **Readings never change:** the chip warms slowly. A warm thumb on the back for 30+ seconds raises it by 1-3 °C. A cool zip-bag of water lowers it. Lower `HOT` so it's 1 degree above the starting reading.
  * **Readings seem high:** this is normal - `temperature()` measures the processor die, so expect 1-3 °C above room temperature, more when the micro:bit has been busy or plugged in a while.
  * **LED never lights:** check the LED direction first, then move the yellow wire from P0 to 3V to test the LED. If it lights, the problem is the threshold or the code.
  * **`NameError: readings`** usually means the list is created after it's used, or spelled differently.
  * `display.scroll()` blocks while text scrolls, so readings pause during it. That's fine for this lesson; mention it if students notice.

  **Data logging (`log` module)**
  * Needs micro:bit **V2** and a recent MicroPython (v2.1 or newer, used by python.microbit.org).
  * Data survives unplugging and re-flashing the same program. `log.delete()` erases it.
  * If memory fills up, `log.add()` raises an error - log every few seconds, not every 10 ms.
  * `log.set_mirroring(True)` also prints each row to the serial console.

  **Safety**
  * No heat guns, lighters, hot water or radiators. Water and electronics don't mix - keep any water sealed in a bag and away from the breadboard.

  **Extensions**
  * Compare readings from two micro:bits with `radio`.
  * Discuss why scientists take many readings and average them instead of trusting one.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.a.6
    how: The micro:bit's temperature sensor collects readings that students summarize and present.
  - code: 6-8.CT.c.5
    how: Gather and organize readings in a list and summarize them with min, max and average; the challenge logs data with the log module.
  - code: 6-8.CT.c.4
    how: Display summary values; in the challenge, look at the logged data as a table and chart (MY_DATA.HTM).
  - code: 6-8.CT.b.1
    how: A loop collects readings; a threshold conditional turns on a too-hot warning LED.
