id: light-sensor
unit: 2
order: 7
title: Light Sensor Night Light
subtitle: Read a photoresistor with read_analog and build an automatic night light
duration_minutes: 35
level: Beginner
big_idea: >-
  An analog input gives a whole range of numbers instead of just 0 or 1, so
  the micro:bit can measure how bright it is and decide what to do.
objectives:
  - Compare digital and analog inputs
  - Measure light with the built-in sensor and an LDR
  - Build a voltage divider with a photoresistor
  - Use a threshold to turn on a night light
vocabulary:
  - term: Analog input
    definition: A pin reading that can be any number from 0 (0 volts) to 1023 (3 volts).
  - term: Photoresistor (LDR)
    definition: A light-dependent resistor. Bright light = low resistance; dark = high resistance.
  - term: Voltage divider
    definition: Two resistors in a row between 3V and GND. The point between them has a voltage somewhere in between.
  - term: Threshold
    definition: The cut-off number your code compares against, like "darker than 300 means night."
  - term: Calibrate
    definition: Measure real readings first, then pick numbers (like the threshold) that fit your room.
materials:
  - micro:bit V2 + USB cable
  - Edge-connector breakout board
  - Half-size breadboard
  - 1 LED (any color)
  - 1 resistor, 220 Ω (red-red-brown)
  - 1 resistor, 10 kΩ (brown-black-orange)
  - 1 photoresistor (LDR)
  - 7 jumper wires
agenda:
  - {key: warmup, name: Warm-up, minutes: 2}
  - {key: learn, name: Learn, minutes: 5}
  - {key: circuit, name: Build the circuit, minutes: 8}
  - {key: code, name: Code it, minutes: 5}
  - {key: practice, name: Your turn, minutes: 3}
  - {key: debug, name: Debug, minutes: 4}
  - {key: quiz, name: Check for understanding, minutes: 3}
  - {key: challenge, name: Open-ended challenge, minutes: 5}
video:
  title: Photoresistors and voltage dividers
  note: Watch the reading change as the presenter covers the sensor with a hand.
warmup:
  prompt: >-
    Streetlights turn on by themselves when it gets dark. How do you think a
    streetlight "knows" it's night? What would it need to measure?
learn:
  - text: |
      ### Digital vs. analog
      * A button is **digital**: pressed or not, **0 or 1**.
      * Light can be dim, very dim, or super bright. An **analog** input gives a number from **0 to 1023**.

      ```python
      value = pin1.read_analog()    # 0 = 0 volts ... 1023 = 3 volts
      ```
    more: |
      **The micro:bit can already sense light!** The 5×5 LEDs can work backwards as a light sensor:
      `level = display.read_light_level()` gives **0 (dark) to 255 (bright)**. But you can't move it or point it,
      so today we also build a sensor we can put **anywhere**.
    visual:
      type: compare
      items:
        - {icon: "🔘", title: "Digital", text: "Only 0 or 1, like a button"}
        - {icon: "🌗", title: "Analog", text: "Any number from 0 to 1023, like light"}
    check:
      question: Which reading could only come from an **analog** input?
      choices: ["0", "1", "612"]
      answer: 2
      why: A digital input only gives 0 or 1. Any number in between means analog.
      hint: Which numbers can a digital input give? Which choice is not one of them?
  - text: |
      ### The photoresistor
      A **photoresistor (LDR)** is a resistor that changes with light.

      * **Bright** → low resistance
      * **Dark** → high resistance

      The micro:bit can't read resistance. It reads **voltage**. So we build a **voltage divider**: two resistors share the 3 volts, like a **tug-of-war**, and P1 reads the middle.
    visual:
      type: part
      part: ldr
    check:
      question: You cover the photoresistor with your hand. Its resistance…
      choices: ["goes down", "goes up", "stays the same"]
      answer: 1
      why: Dark means high resistance, so covering it makes the resistance go up.
      hint: Is it bright or dark under your hand?
  - text: |
      ### Who wins the tug-of-war?
      * **Bright:** the LDR is weak (low resistance). P1 is pulled **up** toward 3V.
      * **Dark:** the LDR is strong (high resistance). The 10 kΩ pulls P1 **down** toward GND.

      **Bright = big number. Dark = small number.**
    visual:
      type: compare
      items:
        - {icon: "☀️", title: "Bright", text: "Low resistance, so a big number"}
        - {icon: "🌙", title: "Dark", text: "High resistance, so a small number"}
    check:
      question: It gets dark in the room. What happens to the number on P1?
      choices: ["It gets bigger", "It gets smaller", "It stays at 1023"]
      answer: 1
      why: In the dark the 10 kΩ wins the tug-of-war and pulls P1 down toward GND.
      hint: Who wins the tug-of-war in the dark, and which way do they pull?
  - text: |
      ### Pick a threshold
      A **threshold** is a cut-off number.

      * Reading **below** it? It's dark. Turn the night light **on**.
      * Reading **above** it? It's bright. Turn it **off**.

      Every room is different, so test first. That's called **calibrating**.

      That's **sense → decide → act**: read the light, choose with `if`, then switch the LED.
    visual:
      type: try
      kind: sensor
      min: 0
      max: 1023
      threshold: 300
      op: "<"
      read: "pin1.read_analog()"
      start: 600
      label: "light reading"
      then: "Dark: the night light turns ON."
      else: "Bright: the night light stays OFF."
    check:
      question: Your threshold is 300 and the reading is 150. What does the night light do?
      choices: ["It stays off", "It blinks", "It turns on"]
      answer: 2
      why: 150 is below the threshold, so it's dark and the light turns on.
      hint: Is 150 above or below the cut-off? Drag the slider to check.
circuit:
  intro: >-
    You'll keep the LED on pin 0 and add a light sensor on pin 1. This time we
    use **both** rails: red (+) for 3V and blue (–) for GND. Unplug the USB
    cable while you build.
  safety:
    - Always build with the micro:bit unplugged.
    - Never connect the red (+) rail straight to the blue (–) rail - that's a short circuit.
    - Use the 10 kΩ resistor (brown-black-orange) for the sensor, not the 220 Ω one.
  remember:
    - text: |
        **Voltage divider:** **3V → LDR → P1 → 10 kΩ → GND**. P1 sits in the middle, where the LDR and
        the 10 kΩ meet, and reads the voltage there.
      visual:
        type: circuit
        caption: "P1 (green) connects where the LDR and the 10 kΩ meet."
        add:
          - {type: wire, from: mb.GND, to: T-1, color: black}
          - {type: wire, from: mb.3V, to: T+1, color: red}
          - {type: ldr, id: ldr1, a: d20, b: d22}
          - {type: resistor, id: r2, a: b22, b: b26, ohms: 10000}
          - {type: wire, from: T+20, to: a20, color: red}
          - {type: wire, from: mb.P1, to: a22, color: green}
          - {type: wire, from: a26, to: T-26, color: black}
  steps:
    - title: Power rails
      instruction: >-
        Push the micro:bit into the breakout board (logo facing up). Run a
        **black** wire from **GND** to the top **blue (–) rail** at **T-1**.
        Run a **red** wire from **3V** to the top **red (+) rail** at **T+1**.
      check: Is red in the + rail and black in the – rail - never both in the same rail?
      add:
        - {type: wire, from: mb.GND, to: T-1, color: black}
        - {type: wire, from: mb.3V, to: T+1, color: red}
    - title: Resistor and LED
      instruction: >-
        Put the 220 Ω resistor from **c10** to **c14**. Put the LED's **long leg
        (+)** in **e14** and its **short leg (–)** in **e15**.
      check: Is the LED's long leg in column 14, next to the resistor?
      tip: Same as Lesson 3 - if it's still built, just check it matches.
      add:
        - {type: resistor, id: r1, a: c10, b: c14, ohms: 220}
        - {type: led, id: led1, anode: e14, cathode: e15, color: yellow}
    - title: LED wires
      instruction: >-
        Add a **yellow** wire from **P0** to **a10**. Add a **black** wire from
        **a15** to the **blue (–) rail** at **T-15**.
      check: Can you trace P0 → resistor → LED → ground?
      add:
        - {type: wire, from: mb.P0, to: a10, color: yellow}
        - {type: wire, from: a15, to: T-15, color: black}
    - title: Photoresistor
      instruction: >-
        Put the photoresistor's legs in **d20** and **d22**. It has no
        direction - either way round works.
      check: Are the two legs in different columns (20 and 22)?
      tip: Bend the legs gently so the sensor's face points up at the ceiling.
      add:
        - {type: ldr, id: ldr1, a: d20, b: d22}
    - title: 10 kΩ resistor
      instruction: >-
        Put the **10 kΩ** resistor (brown-black-orange) from **b22** to **b26**.
        Its left leg shares column 22 with the photoresistor.
      check: Do the photoresistor and the 10 kΩ resistor both have a leg in column 22?
      add:
        - {type: resistor, id: r2, a: b22, b: b26, ohms: 10000}
    - title: Sensor wires
      instruction: >-
        Add a **red** wire from the **red (+) rail** at **T+20** to **a20**.
        Add a **green** wire from **P1** to **a22** (the middle, where the two
        parts meet). Add a **black** wire from **a26** to the **blue (–) rail**
        at **T-26**.
      check: Does the green P1 wire sit in column 22, where the two parts meet?
      add:
        - {type: wire, from: T+20, to: a20, color: red}
        - {type: wire, from: mb.P1, to: a22, color: green}
        - {type: wire, from: a26, to: T-26, color: black}
  verify:
    connected:
      - [mb.P0, r1.a]
      - [r1.b, led1.anode]
      - [led1.cathode, mb.GND]
      - [mb.3V, ldr1.a]
      - [ldr1.b, mb.P1, r2.a]
      - [r2.b, mb.GND]
    not_connected:
      - [led1.anode, led1.cathode]
      - [ldr1.a, ldr1.b]
      - [mb.P1, mb.3V]
      - [mb.P1, mb.GND]
code:
  intro: >-
    When the room gets dark, the night light turns on by itself. Press button A
    to see the current reading so you can **calibrate** your threshold.
  starter: |
    from microbit import *

    threshold = 300    # change this after you test your room

    while True:
        light = pin1.read_analog()      # 0 (dark) to 1023 (bright)
        if light < threshold:
            pin0.write_digital(1)       # dark: night light ON
            display.show(Image.ASLEEP)
        else:
            pin0.write_digital(0)       # bright: night light OFF
            display.show(Image.HAPPY)

        if button_a.was_pressed():
            display.scroll(light)

        sleep(100)
  predict: {"question": "You cover the sensor with your hand. What happens to the night light?", "choices": ["It turns on", "It turns off", "Nothing"], "answer": 0, "explain": "Dark gives a small number, below the threshold."}
  walkthrough:
    - lines: "3"
      explain: The **threshold** is the cut-off between "day" and "night." You'll tune it for your room.
    - lines: "6"
      explain: Reads pin 1 as a number from 0 to 1023. Bright = big, dark = small.
    - lines: "7-12"
      explain: Reading **less than** the threshold? It's dark, so the LED turns on. Otherwise it turns off.
    - lines: "14-15"
      explain: Press A to scroll the reading. Try normal light and a covered sensor, then pick in between.
  try_it:
    - Press A in normal light, then with the sensor covered. Set threshold halfway between.
    - Use pin0.write_analog() so the LED gets brighter as it gets darker. Hint - 1023 - light.
    - Use display.read_light_level() instead. It only goes up to 255. What threshold works now?
practice:
  level: "write"
  prompt: "Write it yourself. Show 'D' for dark, 'M' for medium and 'B' for bright. Pick your own two cut-off numbers."
  remember:
    - text: |
        **More than two choices: elif.** `elif` means **else if**. Put it between `if` and `else`.
        Python checks from the top and runs only the **first** match, e.g.
        `if light < 300:` … `elif light < 700:` … `else:`
  starter: "from microbit import *\n\nwhile True:\n    light = pin1.read_analog()\n    # choose D, M or B with if, elif and else\n    sleep(100)\n"
  solution: "from microbit import *\n\nwhile True:\n    light = pin1.read_analog()\n    if light < 300:\n        display.show(\"D\")\n    elif light < 700:\n        display.show(\"M\")\n    else:\n        display.show(\"B\")\n    sleep(100)\n"
  hints: ["Check the smallest group first.", "elif goes between if and else."]
  checks:
    - {"type": "syntax"}
    - {"type": "contains", "pattern": "if\\s+light\\s*[<>]", "message": "Start with an if that compares light to a number."}
    - {"type": "contains", "pattern": "elif\\s+light\\s*[<>]", "message": "Add an elif for the middle choice."}
    - {"type": "contains", "pattern": "else\\s*:", "message": "Use else for the last choice."}
    - {"type": "contains", "pattern": "display\\.show\\(", "message": "Show each letter on the display."}
debug:
  story: >-
    Priya's night light does the **opposite** of what it should - and it
    doesn't even react when she covers the sensor. There are **two** bugs.
    Find them, fix them, and press **Check my fix**.
  buggy_code: |
    from microbit import *

    threshold = 300

    while True:
        light = pin2.read_analog()
        if light > threshold:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)
        sleep(100)
  hints:
    - Look at your circuit. Which pin is the green sensor wire plugged into?
    - Dark means a small number. Should the LED turn on when light is bigger or smaller than the threshold?
  checks:
    - {type: syntax}
    - {type: contains, pattern: "pin1\\.read_analog\\(\\s*\\)", message: "The sensor is wired to P1 - read it with pin1.read_analog()."}
    - {type: not_contains, pattern: "pin2\\.", message: "Nothing is plugged into pin 2 in this circuit."}
    - type: contains
      pattern: "(<=?\\s*\\w+\\s*:\\s*\\n(?:[^\\n]*\\n)?\\s*pin0\\.write_digital\\(\\s*1)|(>=?\\s*\\w+\\s*:\\s*\\n(?:[^\\n]*\\n)?\\s*pin0\\.write_digital\\(\\s*0)"
      message: "The LED should turn ON when it is dark - when light is LESS than the threshold."
  solution: |
    from microbit import *

    threshold = 300

    while True:
        light = pin1.read_analog()
        if light < threshold:
            pin0.write_digital(1)
        else:
            pin0.write_digital(0)
        sleep(100)
  reflection_prompt: How did you figure out which way the comparison sign should point?
quiz:
  - question: What range of numbers can pin1.read_analog() give?
    choices:
      - 0 or 1
      - 0 to 9
      - 0 to 255
      - 0 to 1023
    answer: 3
    explain: Analog readings go from 0 (0 volts) to 1023 (3 volts). display.read_light_level() is the one that goes to 255.
  - question: In our circuit, what happens to the reading when you cover the photoresistor?
    choices:
      - It goes up
      - It goes down
      - It stays the same
    answer: 1
    explain: Dark makes the LDR's resistance high, so the 10 kΩ resistor pulls P1 toward GND - a smaller number.
  - question: Which if line turns the night light on when it's dark?
    choices:
      - "if light > threshold:"
      - "if light < threshold:"
      - "if light = threshold:"
    answer: 1
    explain: Dark means a small reading, so the light should come on when the reading is less than the threshold.
  - question: Why do we need the 10 kΩ resistor?
    choices:
      - To protect the LED
      - To make a voltage divider that turns light into voltage
      - To make the micro:bit run faster
    answer: 1
    explain: The micro:bit measures voltage, not resistance. The two resistors together turn light into a voltage on P1.
  - question: Your readings are about 600 in normal light and 150 when covered. Which threshold is the best choice?
    visual:
      type: scale
      min: 0
      max: 1023
      marks:
        - {at: 150, label: "150 covered", pointer: true}
        - {at: 600, label: "600 normal light", pointer: true}
    choices:
      - "50"
      - "375"
      - "900"
    answer: 1
    explain: Pick a number in between the two readings. 50 would never trigger and 900 would always be "dark".
  - {"question": "`light` is 500. `if light < 300:` shows A, `elif light < 700:` shows B, and `else:` shows C. What shows?", "choices": ["A", "B", "C"], "answer": 1, "explain": "500 isn't below 300, but it is below 700."}
  - {"question": "From Lesson 6: which line asks if x equals 0?", "choices": ["if x = 0:", "if x == 0:", "x == 0:"], "answer": 1, "explain": "Two equals signs ask a question."}
challenge:
  title: Smart Light Gadget
  prompt: >-
    Invent a gadget that reacts to light: a night light, a sunrise alarm, a
    cookie-jar detector, or something new. Calibrate it for your room and show
    it off.
  levels:
    - "Bronze: Show a different picture for bright, medium and dark. Use if / elif / else and two thresholds."
    - "Silver: Make the LED fade brighter as the room gets darker using write_analog."
    - "Gold: Cookie-jar alarm! When the sensor suddenly sees light, flash the LED and count how many times the jar opened."
  hints:
    Bronze:
      - "Test first. Press button A to see the reading in bright light and in shade."
      - "Check the smallest group first: `if light < dark:`, then `elif light < medium:`, then `else:`."
    Silver:
      - "You need the opposite of the reading. A small light number should give a big LED number."
      - "Try `pin0.write_analog(1023 - light)`."
    Gold:
      - "Start `count = 0` before the loop. Add 1 each time the jar opens."
      - "To count each opening once, remember the last state with `was_open = False`. Act only when it changes."
  submit_prompt: What does your gadget do, what threshold(s) did you choose, and how did you pick them?
teacher_notes: |
  * **Reading stuck near 0:** the red wire from T+20 is missing, or the 3V wire isn't in the red rail.
  * **Reading stuck near 1023:** the 10 kΩ resistor's GND wire (a26 → T-26) is missing, or a 220 Ω was used by mistake
    (readings will stay very high and barely change).
  * **Reading doesn't change when covered:** the green P1 wire isn't in column 22, or the LDR and resistor don't share column 22.
  * **Lights the wrong way:** the comparison is reversed. Ask "is dark a big or small number?"
  * Classroom lights are bright - students may need to cup hands tightly or use a cardboard tube to make it "night."
  * `display.read_light_level()` is a quick no-wiring alternative (0-255). Its first reading after startup can be 0, so read it a couple of times.
  * Extension: introduce `elif` for three levels, or *hysteresis* (on below 250, off above 350) to stop flicker near the threshold.

standards:  # Massachusetts DLCS framework (2016), grades 6-8
  - code: 6-8.CS.a.4
    how: A photoresistor voltage divider (sensor), a threshold rule (control) and an LED (actuator) make an automatic night light.
  - code: 6-8.CS.a.6
    how: Measure light with the built-in sensor and with the photoresistor, and compare the readings.
  - code: 6-8.CT.b.1
    how: A conditional with a threshold, inside a loop, switches the light on when it gets dark.
  - code: 6-8.CT.b.5
    how: Choosing a threshold value, and which way to compare, decides whether the night light works correctly.
