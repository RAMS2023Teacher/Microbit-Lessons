{% macro field(name, label, type="text", value="", hint="", attrs="") %}
<label class="field">
  <span>{{ label }}</span>
  <input type="{{ type }}" name="{{ name }}" value="{{ value }}" {{ attrs|safe }}>
  {% if hint %}<small>{{ hint }}</small>{% endif %}
</label>
{% endmacro %}
{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}
