{% extends "base.html" %}
{% block title %}{{ c.name }} screen · {{ site_name }}{% endblock %}
{% block body_class %}screen-page{% endblock %}
{% block main_class %}screen-main{% endblock %}
{% block content %}
<div id="screen-root"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/screen.js') }}"></script>
<script>
  (function () {
    const csrf = document.querySelector('meta[name=csrf-token]').content;
    const json = (r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
    ClassScreen.start({
      classId: {{ c.id }}, className: {{ c.name|tojson }}, backHref: {{ url_for('teacher.classroom', cid=c.id)|tojson }},
      units: {{ units|tojson }},
      load: () => fetch({{ url_for('teacher.screen_data', cid=c.id)|tojson }}, { credentials: 'same-origin' }).then(json),
      save: (body) => fetch({{ url_for('teacher.screen_settings', cid=c.id)|tojson }}, {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
        body: JSON.stringify(body) }).then(json),
    });
  })();
</script>
{% endblock %}
